<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>خافِت | بوابة الفنيين — Technicians Portal</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><text y='.9em' x='20' font-size='60'>🧑‍🔧</text></svg>" />
<meta name="theme-color" content="#141414" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<style>
  :root{
    --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --brand-soft:#FBF1C6;
    --bg:#FAF7EF; --panel:#F3EEE2; --card:#fff; --line:#EBE5D6;
    --text:#1A1712; --muted:#6E685B;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626;
    --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(40,32,10,.04),0 10px 28px rgba(40,32,10,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}

  header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:1.2rem}
  .brand .mk{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
  .brand .mk svg{width:26px;height:26px}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
  .spacer{flex:1}
  .langsw{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .langsw button{padding:8px 12px;border-radius:9px;font-weight:800;font-size:.85rem;color:var(--muted)}
  .langsw button.active{background:var(--gold);color:var(--ink)}

  .hero{padding:20px 0 4px}
  .hero h1{font-size:1.35rem;font-weight:900}
  .hero p{color:var(--muted);font-size:.92rem;margin-top:2px}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
  .stat .n{font-size:1.5rem;font-weight:900;line-height:1}
  .stat .n.gold{color:var(--gold-deep)}
  .stat .l{color:var(--muted);font-size:.8rem;margin-top:4px}

  .jobs{margin-top:18px;padding-bottom:40px}
  .day-head{position:sticky;top:0;z-index:5;font-weight:900;font-size:1.02rem;color:var(--gold-deep);background:var(--gold-tint);border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin:22px 2px 12px}
  .day-head:first-child{margin-top:4px}
  /* تقويم الشهر */
  .inv-toggle{width:100%;margin-top:16px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px 16px;font-weight:900;font-size:1.05rem;text-align:right;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center}
  .inv-toggle span{color:var(--gold-deep)}
  .inv-box{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .inv-add-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .inv-add-row input{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-weight:700;flex:1;min-width:120px}
  .inv-add-row input#inv_new_unit,.inv-add-row input#inv_new_qty{max-width:90px;flex:0 0 auto}
  .inv-list{margin-top:12px;display:grid;gap:10px}
  .inv-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
  .inv-item.low{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}
  .inv-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .inv-info b{font-size:1.05rem;color:var(--text)}
  .inv-qty{font-weight:800;color:var(--muted);font-size:.9rem}
  .inv-item.low .inv-qty{color:#fca5a5}
  .inv-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .inv-ctl .inv-amt{width:80px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;text-align:center;font-family:inherit}
  .inv-ctl .tbtn{flex:0 0 auto;padding:10px 14px;font-size:.95rem}
  .calbar{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:11px;font-weight:900;font-size:1.05rem;color:var(--gold-deep)}
  .cal-nav{background:var(--card);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:1.25rem;font-weight:900;cursor:pointer;line-height:1;font-family:inherit}
  .cal-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .cal-day{flex:0 0 auto;width:66px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.12s;color:var(--muted);font-family:inherit}
  .cal-day .cd-w{font-size:.68rem;font-weight:700}
  .cal-day .cd-n{font-size:1.18rem;font-weight:900;color:var(--text);line-height:1}
  .cal-day .cd-c{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap}
  .cal-day.has{background:rgba(245,197,24,.1);border-color:rgba(245,197,24,.4)}
  .cal-day.has .cd-c{color:var(--gold-deep)}
  .cal-day.today{border-color:var(--gold)}
  .cal-day.today .cd-n{color:var(--gold-deep)}
  .cal-day.sel{background:var(--gold);border-color:var(--gold)}
  .cal-day.sel .cd-w,.cal-day.sel .cd-n,.cal-day.sel .cd-c{color:var(--ink)}
  .cal-filter{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--gold-deep);font-weight:800}
  .cal-filter button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 13px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.85rem}
  .tjob{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .tjob.done{opacity:.6}
  .tj-head{background:linear-gradient(90deg,rgba(245,197,24,.14),rgba(245,197,24,.05));padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .tj-when{font-weight:900;font-size:1.28rem;display:flex;align-items:center;gap:8px}
  .status{font-size:.76rem;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap;background:var(--gold-tint);color:var(--muted);border:1px solid var(--line)}
  .status.new{background:rgba(245,197,24,.15);color:var(--gold-deep)}
  .status.confirmed{background:rgba(56,132,255,.15);color:#7fb0ff}
  .status.progress{background:rgba(245,197,24,.15);color:var(--gold-deep)}
  .status.done{background:rgba(34,197,94,.15);color:#6ee7a0}
  .tj-body{padding:16px 18px}
  .tj-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:1.12rem}
  .tj-row:last-child{border-bottom:none}
  .tj-k{min-width:124px;color:var(--muted);font-weight:700;font-size:1rem;flex-shrink:0}
  .tj-v{flex:1;font-weight:800}
  .tj-v a{color:var(--gold-deep);font-weight:800}
  .quick-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;padding:6px 14px;border-radius:999px;font-size:.9rem;margin-bottom:6px}
  .tj-row.early-row{background:rgba(37,211,102,.08);border-radius:10px;padding:10px 8px;border-bottom:none}
  .tj-row.early-row .tj-v{color:#5ee68f;font-weight:800}
  .tvideo{display:inline-flex;align-items:center;gap:6px;background:#7c3aed;color:#fff !important;padding:9px 15px;border-radius:11px;font-weight:800;font-size:.92rem;margin-top:4px}
  .ttrans{display:inline-block;background:rgba(56,132,255,.15);color:#7fb0ff !important;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.82rem;margin-right:6px;white-space:nowrap}
  .tmap{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--gold);color:var(--ink);padding:9px 15px;border-radius:11px;font-weight:800;font-size:.9rem}
  .tacts{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 16px}
  .tbtn{flex:1;padding:16px;border-radius:13px;font-weight:900;font-size:1.12rem;text-align:center}
  .tbtn.start{background:var(--gold);color:var(--ink)}
  .tbtn.done{background:var(--ok);color:#fff}
  .tbtn.donelbl{background:var(--ok-soft);color:#6ee7a0}
  .tbtn.reject{flex:0 0 auto;background:transparent;border:1px solid rgba(248,113,113,.45);color:#fca5a5;font-size:.95rem}
  .rj-list{display:grid;gap:9px}
  .rj-opt{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px 15px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
  .rj-opt:hover{border-color:#fca5a5}
  .tbtn.follow{flex:0 0 auto;background:rgba(56,132,255,.14);border:1px solid rgba(56,132,255,.4);color:#7fb0ff;font-size:.95rem}
  .fu-field{margin-bottom:13px}
  .fu-field label{display:block;font-weight:800;color:var(--muted);font-size:.9rem;margin-bottom:6px}
  .fu-field input,.fu-field textarea{width:100%;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:1.05rem;font-family:inherit}
  .fu-field input:focus,.fu-field textarea:focus{outline:none;border-color:var(--gold)}
  .delay-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:rgba(255,149,0,.08);border-top:1px solid var(--line)}
  .delay-ctl .dc-l{font-weight:800;color:#f0a340;font-size:.95rem}
  .delay-ctl .dc-l b{color:#ffb347}
  .delay-ctl .dc-btns{display:flex;gap:7px}
  .delay-ctl .dc-btns button{background:#2a2318;border:1px solid rgba(255,149,0,.4);color:#ffb347;font-weight:900;border-radius:10px;padding:9px 13px;font-size:.95rem;cursor:pointer;font-family:inherit}
  .delay-ctl .dc-btns .dc-reset{background:var(--card);border-color:var(--line);color:var(--muted)}
  .tbtn.arrive{background:#25D366;color:#fff}
  .tbtn.arrivedlbl{background:rgba(37,211,102,.15);color:#5ee68f}
  .tbtn.onway{background:#3884ff;color:#fff}
  .tbtn.onwaylbl{background:rgba(56,132,255,.15);color:#7fb0ff}
  .tj-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .status.arrived-b{background:rgba(37,211,102,.18);color:#5ee68f;border-color:transparent}
  .twa{display:inline-flex;align-items:center;gap:4px;background:rgba(37,211,102,.14);color:#5ee68f !important;padding:3px 10px;border-radius:999px;font-weight:800;white-space:nowrap}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .ico{font-size:3.4rem;margin-bottom:12px;opacity:.5}
  .offline{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px 16px;margin-top:14px;font-size:.9rem;font-weight:600}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--ink);padding:14px 24px;border-radius:14px;font-weight:800;z-index:60;opacity:0;transition:.3s;box-shadow:var(--shadow);max-width:90%;text-align:center;pointer-events:none}
  .tbtn.inv{background:var(--gold-tint);border:1px solid var(--gold-soft);color:var(--gold-deep)}
  .tbtn.inv.sent{background:rgba(34,197,94,.14);border-color:transparent;color:#6ee7a0}
  /* محرر الفاتورة */
  .inv-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .inv-modal.show{display:flex}
  .inv-card{background:var(--panel);color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px}
  .inv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .inv-head b{font-size:1.35rem;font-weight:900}
  .inv-head button{width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--text);font-size:1.2rem}
  .inv-add{display:flex;gap:8px;margin-bottom:14px}
  .inv-add select{flex:1;padding:15px 12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:800;font-size:1.05rem}
  .inv-add .cust{padding:15px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:800;white-space:nowrap;font-size:1rem}
  .inv-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .inv-row .ir-name{flex:1;font-weight:800;font-size:1.15rem}
  .inv-row .ir-pname{flex:1;min-width:0;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:1.05rem;font-family:inherit}
  .inv-row .ir-pname:focus{outline:none;border-color:var(--gold)}
  .inv-row .ir-qty{display:flex;align-items:center;background:var(--card);border-radius:11px;overflow:hidden}
  .inv-row .ir-qty button{width:38px;height:40px;font-weight:900;color:var(--gold-deep);font-size:1.35rem}
  .inv-row .ir-qty span{min-width:30px;text-align:center;font-weight:900;font-size:1.15rem}
  .inv-row .ir-price{width:92px;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:900;text-align:center;font-size:1.1rem}
  .inv-row .ir-del{color:var(--danger);font-size:1.3rem;padding:6px}
  .inv-empty{color:var(--muted);text-align:center;padding:20px;font-weight:700;font-size:1.05rem}
  .inv-disc{margin-top:12px;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.35);border-radius:10px;padding:9px 13px;color:#5ee68f;font-weight:800;font-size:.92rem}
  .inv-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:14px;border-top:2px solid var(--line);font-weight:900;font-size:1.5rem}
  .inv-total b{color:var(--gold-deep)}
  .inv-acts{display:flex;gap:10px;margin-top:18px}
  .inv-acts .tbtn{flex:1;font-size:1.08rem;padding:17px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .logout{color:var(--muted);font-weight:700;font-size:.85rem;padding:6px 10px}
  /* تسجيل الدخول */
  .login{max-width:380px;margin:44px auto;padding:0 18px;text-align:center}
  .login .ic{font-size:3rem;margin-bottom:8px}
  .login h1{font-size:1.5rem;font-weight:900}
  .login p{color:var(--muted);margin:6px 0 20px;font-size:.9rem}
  .login input{width:100%;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:1.05rem;margin-bottom:12px}
  .login input:focus{outline:none;border-color:var(--gold)}
  .login .btn{width:100%;background:var(--gold);color:var(--ink);font-weight:900;padding:16px;border-radius:13px;font-size:1.05rem;transition:.15s}
  .login .btn:hover{background:var(--gold-strong)}
  .login .lgerr{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px;margin-top:12px;font-weight:600;font-size:.9rem}

  /* ===== الشريط السفلي: أربعة أقسام ===== */
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(23,26,32,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tb{flex:1;padding:8px 3px 7px;background:none;border:none;color:var(--muted);font-family:inherit;cursor:pointer;position:relative}
  .tb i{display:block;font-size:1.15rem;font-style:normal;line-height:1.3}
  .tb span{display:block;font-size:.6rem;font-weight:800;margin-top:1px}
  .tb.on{color:var(--gold-deep)}
  .tb.on::before{content:"";position:absolute;top:0;right:24%;left:24%;height:2px;background:var(--gold);border-radius:0 0 3px 3px}
  .tb .tdot{position:absolute;top:6px;left:27%;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1.5px solid var(--card)}

  /* ===== المستودع الاحترافي ===== */
  :root{ --amber:#FBBF24; --red:#F87171; }
  /* ==== تبويب حسابي ==== */
  .acc-wrap{padding:18px 0 100px}
  .acc-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .acc-av{width:56px;height:56px;border-radius:16px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.8rem;flex-shrink:0}
  .acc-head b{display:block;font-size:1.18rem;font-weight:900;line-height:1.3}
  .acc-head span{color:var(--muted);font-size:.85rem;font-weight:700}
  .acc-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .acc-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:700}
  .acc-row:last-child{border-bottom:0}
  .acc-row span{color:var(--muted)}
  .acc-lbl{font-weight:900;padding:14px 0 10px}
  .acc-langs{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
  .acc-lang{padding:9px 16px;border-radius:11px;font-weight:800;font-size:.9rem;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .acc-lang.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .acc-code{background:linear-gradient(135deg,rgba(245,197,24,.16),rgba(245,197,24,.05));border:1px solid rgba(245,197,24,.45);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
  .acc-code small{color:var(--muted);font-size:.84rem;line-height:1.6;display:block}
  .acc-code-v{font-size:1.9rem;font-weight:900;color:var(--gold-deep);letter-spacing:6px;margin:8px 0}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:inherit;text-align:inherit}
  .set-row:last-child{border-bottom:0}
  .set-row .sr-l{display:flex;align-items:center;gap:11px;font-weight:700;font-size:.95rem}
  .set-row .sr-ic{font-size:1.2rem}
  .set-row .sr-ar{color:var(--muted);font-weight:900;font-size:1.2rem}
  .set-row.danger .sr-l{color:#c0392b}
  .set-body{padding:6px 2px 12px}
  .set-body input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-size:1rem}
  /* ═ مربّعات الرئيسية (زي لوحة الإدارة) ═ */
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  @media(max-width:430px){.hgrid{grid-template-columns:1fr}}

const DIGITS={ ar:'٠١٢٣٤٥٦٧٨٩', ur:'۰۱۲۳۴۵۶۷۸۹', hi:'०१२३४५६७८९', ne:'०१२३४५६७८९', en:'0123456789' };
function ar(n){ const d=DIGITS[lang]||DIGITS.en; return String(n).replace(/[0-9]/g,x=>d[+x]); }
function arNum(n){ return String(n).replace(/[0-9]/g,x=>'٠١٢٣٤٥٦٧٨٩'[+x]); } // عربي دائماً (للفاتورة المطبوعة للعميل)
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function fmtDurAr(mins){ if(!mins) return t('byInspection'); const h=Math.floor(mins/60),m=mins%60,p=[]; if(h===1)p.push('ساعة'); else if(h===2)p.push('ساعتان'); else if(h>2)p.push(ar(h)+' ساعات'); if(m)p.push(ar(m)+' دقيقة'); return p.join(' و'); }
function jobDur(mins){ if(!mins) return t('byInspection'); if(lang==='ar') return fmtDurAr(mins); const h=Math.floor(mins/60),m=mins%60;
  const H=lang==='ne'?'घण्टा':lang==='hi'?'घंटा':lang==='ur'?'گھنٹہ':'h', M=lang==='ne'?'मिनेट':lang==='hi'?'मिनट':lang==='ur'?'منٹ':'min';
  const p=[]; if(h)p.push(h+' '+H); if(m)p.push(m+' '+M); return p.join(' '); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); }
function jobDate(iso){ const d=parseISO(iso); return WEEK[lang][d.getDay()]+', '+ar(d.getDate())+' '+MON[lang][d.getMonth()]; }
function dayHeadLabel(iso){
  const d=parseISO(iso), today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  const REL={ar:['اليوم','غداً'],en:['Today','Tomorrow'],ne:['आज','भोलि'],hi:['आज','कल'],ur:['آج','کل']};
  const rel = diff===0?REL[lang][0] : diff===1?REL[lang][1] : '';
  return (rel?rel+' · ':'')+jobDate(iso);
}
function jobTime(mins){ let h=Math.floor(mins/60),m=mins%60; const ap=(lang==='ar'||lang==='ur')?(h<12?'ص':'م'):(h<12?'AM':'PM'); let h12=h%12||12; return ar(h12)+':'+ar(String(m).padStart(2,'0'))+' '+ap; }
function isRTL(){ return lang==='ar'||lang==='ur'; }
function dateISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function initPush(){

let invEditing=null, invItems=[];
function svcName2(s){ if(lang==='ar') return s.name; const tr=SVC_I18N[s.id]; return (tr&&tr[lang])?tr[lang]:s.name; }
function itemDisplay(it){ if(it.id && it.id!=='custom'){ const s=svc(it.id); if(s) return svcName2(s); } return it.name; }
function openInvoice(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  invEditing=id;
  invItems = (o.invoice&&o.invoice.items) ? o.invoice.items.map(it=>({id:it.id||'custom',stockId:it.stockId||null,name:it.name,qty:+it.qty||1,price:+it.price||0,deducted:+it.deducted||0})) : [];
  renderInvoice();
}
/* قطعة من المستودع: تدخل الفاتورة بسعر البيع، وتنخصم عند الحفظ */
function addStockPart(id){ if(!id) return; captureInvPrices(); const it=INV.find(x=>x.id===id); if(it){ invItems.push({id:'stock',stockId:it.id,name:it.name,qty:1,price:+it.sell_price||0,deducted:0}); } renderInvoice(); }
function closeInvoice(){ invEditing=null; document.getElementById('invModal').classList.remove('show'); document.getElementById('invModal').innerHTML=''; }
function captureInvPrices(){
  document.querySelectorAll('.ir-price').forEach(inp=>{ const i=+inp.dataset.i; if(invItems[i]) invItems[i].price=+inp.value||0; });
  document.querySelectorAll('.ir-pname').forEach(inp=>{ const i=+inp.dataset.i; if(invItems[i]) invItems[i].name=inp.value; });
}
function addInvItem(id){ if(!id) return; captureInvPrices(); const s=svc(id); if(s){ invItems.push({id:s.id,name:s.name,qty:1,price:s.price}); } renderInvoice(); }
function addCustomItem(){ captureInvPrices(); invItems.push({id:'custom',name:'',qty:1,price:0}); renderInvoice(); }
function addPart(){ captureInvPrices(); invItems.push({id:'part',name:'',qty:1,price:0}); renderInvoice(); }
function invQty(i,d){ captureInvPrices(); if(invItems[i]){ invItems[i].qty=Math.max(1,(invItems[i].qty||1)+d); } renderInvoice(); }
function invRemove(i){ captureInvPrices(); invItems.splice(i,1); renderInvoice(); }
function invTotal(){ return invItems.reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0); }
function invPct(){ const o=ORDERS.find(x=>x.id===invEditing); return o?(+o.discountPct||0):0; }
function invNet(){ const p=invPct(); return Math.round(invTotal()*(1-p/100)); }
async function saveInvoice(){
  captureInvPrices();
  const o=ORDERS.find(x=>x.id===invEditing); if(!o) return;
  // خصم قطع المستودع من المخزون — الفرق فقط (يمنع الخصم المزدوج عند إعادة الحفظ/التعديل)
  for(const it of invItems){
    if(it.id==='stock' && it.stockId){
      const inv=INV.find(x=>x.id===it.stockId); if(!inv) continue;
      const want=+it.qty||1, done=+it.deducted||0, delta=want-done;
      if(delta!==0){
        inv.qty=Math.max(0,(+inv.qty||0)-delta);
        await invSaveQty(inv);
        await logStock(inv, -delta, (lang==='ar'?'صرف — فاتورة ':'invoice — ')+o.id);
        it.deducted=want;
      }
    }
  }
  const invoice={ items:invItems.map(it=>({id:it.id||'custom',stockId:it.stockId||null,name:it.name,qty:+it.qty||1,price:+it.price||0,deducted:+it.deducted||0})), subtotal:invTotal(), discountPct:invPct(), total:invNet(), createdAt:Date.now() };
  o.invoice=invoice;
  if(cloudReady && o.dbId){ try{ await sb.from('khafet_orders').update({invoice:invoice}).eq('id',o.dbId); }catch(e){} }
  else { try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY))||{}; const tt=(s.orders||[]).find(x=>x.id===o.id); if(tt){ tt.invoice=invoice; localStorage.setItem(SAVE_KEY,JSON.stringify(s)); } }catch(e){} }
  toast(t('invoiceSent')); closeInvoice(); render();
}
function printInv(){ captureInvPrices(); const o=ORDERS.find(x=>x.id===invEditing); if(!o) return; const tmp={...o, invoice:{items:invItems,subtotal:invTotal(),discountPct:invPct(),total:invNet()}}; printInvoiceDoc(tmp); }

  const w=window.open('','_blank'); if(!w){ toast('اسمح بالنوافذ المنبثقة'); return; } w.document.write(html); w.document.close();

/* ===== الدخول برقم الجوال + كلمة المرور (بلا رسائل = بلا تكلفة على كل دخول) ===== */
function normPhone(v){
  let d=String(v||'').replace(/[^0-9]/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(d.startsWith('0'))  d='966'+d.slice(1);
  if(!d.startsWith('966')) d='966'+d;
  return d;
}
function lgFail(msg){ const e=document.getElementById('lgerr'); if(e){ e.textContent=msg||'تعذّر الدخول · Sign-in failed'; e.style.display='block'; } }
function showLogin(){
  const lo=document.getElementById('logoutBtn'); if(lo) lo.style.display='none';
  const ab0=document.getElementById('acctBtn'); if(ab0) ab0.style.display='none';

      <p>ادخل برقم جوالك وكلمة المرور · Sign in</p>

      <button class="btn" onclick="doLogin()">دخول · Login</button>
      <label class="rememberme"><input type="checkbox" id="lg_rem" checked> تذكرني · Remember me</label>
      <button type="button" class="forgot-link" onclick="showForgot('')">نسيت كلمة المرور؟ · Forgot password?</button>
      <div id="lgerr" class="lgerr" style="display:none">تعذّر الدخول · Sign-in failed</div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)">
        <div style="color:var(--muted);font-size:.9rem;margin-bottom:10px;font-weight:700">فني جديد؟ سجّل واحصل على كودك 👇</div>
        <a href="provider.html?techreg=1" class="btn" style="display:block;text-align:center;text-decoration:none;background:transparent;border:2px solid var(--gold);color:var(--ink)">🤝 تسجيل فني جديد</a>
      </div>
    </div>`;
  const wp=document.getElementById('wp'); if(wp) wp.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

/* ═══════ نسيت كلمة المرور — كود على الجوال ثم كلمة مرور جديدة ═══════ */
let _fgPhone=null;
function showForgot(msg){
  const pre=((document.getElementById('wu')||{}).value)||'';
  document.getElementById('app').innerHTML=`
    <div class="login">
      <div class="ic">🔑</div><h1>استعادة كلمة المرور</h1>
      <p>اكتب رقم جوالك المسجّل، ونرسل لك كود تأكيد.</p>
      <input id="fg_phone" inputmode="tel" placeholder="رقم الجوال · 05xxxxxxxx" autocomplete="tel" value="${pre}" />
      <button class="btn" onclick="sendForgotCode()">📲 أرسل كود التأكيد</button>
      ${msg?`<div class="lgerr" style="display:block">${msg}</div>`:''}
      <button type="button" class="forgot-link" onclick="showLogin()">‹ رجوع لتسجيل الدخول</button>
    </div>`;
  const el=document.getElementById('fg_phone');
  if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') sendForgotCode(); });
}
async function sendForgotCode(){
  const d=normPhone((document.getElementById('fg_phone')||{}).value||'');
  if(d.length<12){ showForgot('❌ رقم الجوال غير صحيح'); return; }
  if(!cloudReady){ showForgot('لا يوجد اتصال بالخادم'); return; }
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳ جاري الإرسال...'; }
  try{
    const { error }=await sb.auth.signInWithOtp({ phone:'+'+d, options:{ shouldCreateUser:false } });
    if(error){ showForgot('❌ الرقم غير مسجّل، أو تعذّر الإرسال — حاول بعد قليل'); return; }
    _fgPhone='+'+d; showForgotCode('');
  }catch(e){ showForgot('تعذّر الإرسال، حاول مرة ثانية'); }
}
function showForgotCode(msg){
  document.getElementById('app').innerHTML=`
    <div class="login">
      <div class="ic">✉️</div><h1>تعيين كلمة مرور جديدة</h1>
      <p>أرسلنا كوداً إلى <b style="direction:ltr;display:inline-block">${_fgPhone||''}</b></p>
      <input id="fg_code" inputmode="numeric" maxlength="8" placeholder="••••" style="text-align:center;letter-spacing:6px;font-size:1.3rem" />
      <input id="fg_p1" type="password" placeholder="كلمة المرور الجديدة (٦ فأكثر)" autocomplete="new-password" />
      <input id="fg_p2" type="password" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" />
      <button class="btn" onclick="confirmForgot()">✅ حفظ ودخول</button>
      ${msg?`<div class="lgerr" style="display:block">${msg}</div>`:''}
      <button type="button" class="forgot-link" onclick="sendForgotCode()">لم يصلك الكود؟ إعادة الإرسال</button>
      <button type="button" class="forgot-link" onclick="showLogin()">‹ رجوع لتسجيل الدخول</button>
    </div>`;
  setTimeout(()=>{ const c=document.getElementById('fg_code'); if(c) c.focus(); },80);
  const p2=document.getElementById('fg_p2');
  if(p2) p2.addEventListener('keydown',e=>{ if(e.key==='Enter') confirmForgot(); });
}
async function confirmForgot(){
  const code=((document.getElementById('fg_code')||{}).value||'').trim();
  const a=((document.getElementById('fg_p1')||{}).value)||'', b=((document.getElementById('fg_p2')||{}).value)||'';
  if(code.length<4){ showForgotCode('اكتب كود التأكيد المرسل لجوالك'); return; }
  if(a.length<6){ showForgotCode('كلمة المرور ٦ خانات على الأقل'); return; }
  if(a!==b){ showForgotCode('كلمتا المرور غير متطابقتين'); return; }
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  try{
    const { error:ve }=await sb.auth.verifyOtp({ phone:_fgPhone, token:code, type:'sms' });
    if(ve){ showForgotCode('❌ الكود غير صحيح أو انتهت صلاحيته'); return; }
    const { error:ue }=await sb.auth.updateUser({ password:a });
    if(ue){ showForgotCode('تعذّر حفظ كلمة المرور — جرّب كلمة مختلفة'); return; }
    _fgPhone=null;
    toast('✅ تم تغيير كلمة المرور');
    const { data:info }=await sb.rpc('my_staff_info');
    if(info && info.role){ loggedIn=true; TECH=info; render(); loadOrders(); initPush(); }
    else showLogin();
  }catch(e){ showForgotCode('تعذّر، حاول مرة ثانية'); }
}
async function doLogin(){
  const d=normPhone((document.getElementById('wu')||{}).value||'');
  const p=((document.getElementById('wp')||{}).value||'');
  const btn=document.querySelector('.login .btn');
  if(d.length<12){ lgFail('رقم الجوال غير صحيح'); return; }
  if(!p){ lgFail('اكتب كلمة المرور'); return; }
  if(!cloudReady){ lgFail('لا يوجد اتصال بالخادم'); return; }
  if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  try{
    const { error }=await sb.auth.signInWithPassword({ phone:'+'+d, password:p });
    if(error) throw new Error('bad');
    const { data:role }=await sb.rpc('staff_role');
    if(!role){ await sb.auth.signOut(); throw new Error('no-role'); }
    await loadMyName();
    try{ localStorage.setItem('khafet_remember', (document.getElementById('lg_rem')||{checked:true}).checked?'1':'0'); }catch(e){}
    loggedIn=true; render(); loadOrders(); initPush();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='دخول · Login'; }
    lgFail((e&&e.message==='no-role') ? 'هذا الرقم غير مسجّل كفني — راجع الإدارة' : 'الرقم أو كلمة المرور غير صحيحة');
  }
}
async function logout(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} loggedIn=false; localStorage.removeItem('khafet_worker_auth'); render(); }

async function changePass(){
  const a=((document.getElementById('np1')||{}).value)||'', b=((document.getElementById('np2')||{}).value)||'';
  if(a.length<6){ toast(lang==='ar'?'٦ خانات على الأقل':'Min 6 characters'); return; }
  if(a!==b){ toast(lang==='ar'?'غير متطابقتين':'Do not match'); return; }
  try{ const { error }=await sb.auth.updateUser({ password:a }); if(error) throw error;
    const p1=document.getElementById('np1'),p2=document.getElementById('np2'); if(p1)p1.value=''; if(p2)p2.value=''; toggleSet('pass');
    toast(lang==='ar'?'✅ تم تحديث كلمة المرور':'✅ Password updated');
  }catch(e){ const m=(e&&e.message)||''; toast(/different from the old/i.test(m)?(lang==='ar'?'لازم تكون مختلفة عن القديمة':'Must differ from old'):(lang==='ar'?'تعذّر التحديث':'Update failed')); }
}
async function deleteAccount(){
  if(!confirm(lang==='ar'?'حذف حسابك؟ لن تستقبل مهام بعدها.':'Delete your account?')) return;
  let ok=false; try{ const { data }=await sb.rpc('deactivate_my_account'); ok=!!data; }catch(e){}
  if(!ok){ toast(lang==='ar'?'تعذّر الحذف — راجع الإدارة':'Delete failed'); return; }
  try{ if(sb) await sb.auth.signOut(); }catch(e){} loggedIn=false; localStorage.removeItem('khafet_worker_auth'); render();
  toast(lang==='ar'?'تم حذف الحساب':'Account deleted');
}

/* ---- تقويم الشهر (نظرة عامة على الحجوزات) ---- */
let calMonth=(function(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
/* يفتح على اليوم الحالي — الفني يشوف شغل اليوم أول شي */
let calFilter=dateISO(new Date());
/* الطلبات المنجزة تنصفط؛ الضغط عليها يفتحها (فاتورة/متابعة) */
let doneOpen={};
function toggleDone(id){ doneOpen[id]=!doneOpen[id]; render(); }
const AR_WK_SHORT=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
function wkShort(dow){ return lang==='ar'?AR_WK_SHORT[dow]:WEEK[lang][dow]; }
function jobCountOn(iso){ return ORDERS.filter(o=>o.date===iso && o.status!=='cancelled').length; }
function calPrev(){ calMonth.setMonth(calMonth.getMonth()-1); calFilter=null; render(); }
function calNext(){ calMonth.setMonth(calMonth.getMonth()+1); calFilter=null; render(); }
function calPick(iso){ calFilter=(calFilter===iso?null:iso); render(); }
function calClear(){ calFilter=null; render(); }
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const todayISO=dateISO(new Date());
  let cells='';
  for(let dd=1; dd<=days; dd++){
    const d=new Date(y,m,dd), iso=dateISO(d), c=jobCountOn(iso);
    const cls=[c?'has':'', iso===todayISO?'today':'', calFilter===iso?'sel':''].filter(Boolean).join(' ');
    cells+=`<button class="cal-day ${cls}" onclick="calPick('${iso}')">
      <span class="cd-w">${wkShort(d.getDay())}</span>
      <b class="cd-n">${ar(dd)}</b>
      <span class="cd-c">${c?('👤 '+ar(c)):'·'}</span>
    </button>`;
  }
  const showAll={ar:'عرض الكل',en:'Show all',ne:'सबै',hi:'सभी',ur:'سب دیکھیں'}[lang];
  const filterBar = calFilter
    ? `<div class="cal-filter"><b>📅 ${dayHeadLabel(calFilter)}</b><button onclick="calClear()">${showAll}</button></div>` : '';
  return `<div class="calbar">
    <div class="cal-head"><button class="cal-nav" onclick="calPrev()">${isRTL()?'›':'‹'}</button><b>${MON[lang][m]+' '+ar(y)}</b><button class="cal-nav" onclick="calNext()">${isRTL()?'‹':'›'}</button></div>
    <div class="cal-strip">${cells}</div>
    ${filterBar}
  </div>`;
}

/* إضافة صنف جديد (باسم + وحدة + كمية + أسعار + حد أدنى) */
async function invAddPrompt(){
  const A=lang==='ar';
  const name=prompt(A?'اسم الصنف:':'Item name:'); if(!name||!name.trim()) return;
  const unit=prompt(A?'الوحدة (حبة/متر/كرتون):':'Unit:','حبة')||'حبة';
  const qty=Math.abs(+prompt(A?'الكمية الحالية:':'Current qty:','0')||0);
  const buy=Math.abs(+prompt(A?'سعر الشراء (ر.س):':'Buy price:','0')||0);
  const sell=Math.abs(+prompt(A?'سعر البيع (ر.س):':'Sell price:','0')||0);
  const mn=Math.abs(+prompt(A?'الحد الأدنى للتنبيه:':'Min alert qty:','3')||3);
  const data={ name:name.trim(), unit, qty, buy_price:buy, sell_price:sell, min_qty:mn };
  if(cloudReady){ try{ const r=await sb.from('khafet_inventory').insert(data).select().single();
    if(!r.error&&r.data){ INV.unshift(r.data); if(qty>0) await logStock(r.data,qty,A?'رصيد افتتاحي':'opening'); } }catch(e){ toast('⚠️ '+(e.message||'')); return; } }
  toast('✅ '+(A?'انضاف':'Added')); render();
}
/* تعديل صنف (الأسعار/الحد الأدنى/الوحدة) */
async function invEdit(id){
  const A=lang==='ar'; const it=INV.find(x=>x.id===id); if(!it) return;
  const buy=prompt(A?('سعر شراء «'+it.name+'»:'):'Buy price:', it.buy_price||0); if(buy===null) return;
  const sell=prompt(A?'سعر البيع:':'Sell price:', it.sell_price||0); if(sell===null) return;
  const mn=prompt(A?'الحد الأدنى للتنبيه:':'Min alert:', it.min_qty||3); if(mn===null) return;
  const patch={ buy_price:Math.abs(+buy||0), sell_price:Math.abs(+sell||0), min_qty:Math.abs(+mn||0) };
  Object.assign(it, patch);
  if(cloudReady&&it.id){ try{ await sb.from('khafet_inventory').update(patch).eq('id',it.id); }catch(e){} }
  toast('✅ '+(A?'تعدّل':'Updated')); render();
}

let bkDate=null, bkTime=null; const bkVals={};
function pickBkDate(iso){ bkDate=iso; bkTime=null; render(); }
function pickBkTime(m){ bkTime=m; render(); }
/* أول حجز قائم داخل النافذة بنفس اليوم */
function bkWinOrder(iso,m){
  return ORDERS.find(o=>o.date===iso && o.status!=='cancelled' &&
    (+o.startMin||0) < m+BK_WINDOW && ((+o.endMin)||((+o.startMin||0)+60)) > m) || null;
}
/* ضغط نافذة محجوزة → افتح طلبات ذلك اليوم وانزل على الحجز نفسه */
function openBkWindow(iso,m){
  const o=bkWinOrder(iso,m); if(!o) return;
  tab='orders'; calFilter=iso; render();
  setTimeout(function(){
    const el=document.getElementById('job-'+(o.dbId||'').replace(/[^a-zA-Z0-9_-]/g,''));
    if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
  }, 150);
}
/* ═ جدول اليوم بالرئيسية ═ */
let schedDate=null, schedOpen=null;
function schedPick(iso){ schedDate=iso; schedOpen=null; render(); }
function schedTapWin(iso,m){
  const o=bkWinOrder(iso,m);
  if(o){
    /* ضغطة تفتح تفاصيل هذا الحجز فقط — وضغطة ثانية تسكّرها */
    schedOpen = (schedOpen===o.dbId) ? null : o.dbId;
    if(o.dbId) markJobsSeen([o.dbId]);
    if(o.status==='done') doneOpen[o.id]=true;   /* المكتمل يفتح مفروداً عشان الفاتورة وغيرها */
    render();
    if(schedOpen) setTimeout(function(){
      const el=document.getElementById('job-'+(o.dbId||'').replace(/[^a-zA-Z0-9_-]/g,''));
      if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
    }, 120);
  } else {
    bkDate=iso; bkTime=m; tab='book'; render();
    try{window.scrollTo(0,0);}catch(e){}
  }
}
function schedHTML(){
  const A=lang==='ar';
  const today=new Date(); today.setHours(0,0,0,0);
  const REL={ar:'اليوم',en:'Today',ne:'आज',hi:'आज',ur:'آج'};
  const chips=[];
  for(let i=0;i<16;i++){
    const d=new Date(today); d.setDate(today.getDate()+i); const iso=dateISO(d);
    chips.push(`<button class="dchip ${schedDate===iso?'active':''}" onclick="schedPick('${iso}')"><small>${i===0?(REL[lang]||REL.ar):WEEK[lang][d.getDay()]}</small><b>${ar(d.getDate())}</b><span class="mon">${MON[lang][d.getMonth()]}</span></button>`);
  }
  const seenS=seenJobs();
  const slots=[];
  for(let m=BK_WORK_START;m+60<=BK_WORK_END;m+=BK_WINDOW){
    const o=bkWinOrder(schedDate,m);
    let cls='free', sub=A?'فاضي':'Free';
    if(o){
      if(o.status==='done'){ cls='b-done'; sub=A?'✓ مكتمل — الفاتورة':'✓ Done — invoice'; }
      else if(o.dbId&&!seenS.has(o.dbId)){ cls='b-new'; sub=A?'🟢 جديد':'🟢 NEW'; }

/* نفس إعدادات خافت: دوام ٨ص–١٠م ونافذة وصول ساعتين والجمعة عطلة */
const BK_WORK_START=8*60, BK_WORK_END=22*60, BK_WINDOW=120;
function bkWindowLabel(m){ return jobTime(m)+' – '+jobTime(Math.min(m+BK_WINDOW,BK_WORK_END)); }
function renderBookTab(){
  const A=lang==='ar';
  const today=new Date(); today.setHours(0,0,0,0);
  if(!bkDate) bkDate=dateISO(today);

  /* شريط الأيام — زي خافت بالضبط: أسبوعان بدون الجمعة + «تاريخ أبعد» */
  const stripDays=[];
  for(let i=0;i<16;i++){ const d=new Date(today); d.setDate(today.getDate()+i); if(d.getDay()!==5) stripDays.push(d); }
  const dchips=stripDays.map((d,i)=>{
    const iso=dateISO(d);
    return `<button class="dchip ${bkDate===iso?'active':''}" onclick="pickBkDate('${iso}')">
      <small>${i===0?(REL[lang]||REL.ar):WEEK[lang][d.getDay()]}</small><b>${ar(d.getDate())}</b><span class="mon">${MON[lang][d.getMonth()]}</span></button>`;
  }).join('');
  const farActive = bkDate && !stripDays.some(d=>dateISO(d)===bkDate);
  const fd = farActive ? parseISO(bkDate) : null;
  const farChip=`<label class="dchip more-date ${farActive?'active':''}">
    ${farActive
      ? `<small>${WEEK[lang][fd.getDay()]}</small><b>${ar(fd.getDate())}</b><span class="mon">${MON[lang][fd.getMonth()]}</span>`
      : `<small>📅</small><b>＋</b><span class="mon">${A?'تاريخ أبعد':'Later date'}</span>`}
    <input type="date" min="${dateISO(today)}" value="${farActive?bkDate:''}" onchange="if(this.value)pickBkDate(this.value)" />
  </label>`;
  /* نوافذ اليوم بالترتيب — أول مربع أول ساعتين (٨–١٠ ص) وهكذا؛ المحجوزة تنضغط لتفاصيلها والجديدة بالأخضر */
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const isToday=bkDate===dateISO(now);
  const seenB=seenJobs();
  const slots=[];
  for(let m=BK_WORK_START;m+60<=BK_WORK_END;m+=BK_WINDOW){
    if(isToday && m+BK_WINDOW<=nowMin) continue;
    const bo=bkWinOrder(bkDate,m);
    if(bo){
      const isNewB = bo.dbId && bo.status!=='done' && !seenB.has(bo.dbId);
      slots.push(`<button class="slot win busy ${isNewB?'newbk':''}" onclick="openBkWindow('${bkDate}',${m})">${bkWindowLabel(m)}<span class="bl">${isNewB?(A?'🟢 حجز جديد — اضغط':'🟢 NEW — tap'):(A?'محجوز — اضغط للتفاصيل':'Booked — tap for details')}</span></button>`);
    } else {
      slots.push(`<button class="slot win ${bkTime===m?'active':''}" onclick="pickBkTime(${m})">${bkWindowLabel(m)}</button>`);
    }

  return `<div class="hero"><h1>📅 ${tl(2)}</h1><p>${A?'احجز موعد جديد للعميل وأنت بالموقع':'Book an appointment on the spot'}</p></div>
  <div class="bookf">
    <div class="fu-field"><label>${A?'اسم العميل':'Customer name'}</label><input id="bk_name" value="${esc(bkVals.name||'')}" oninput="bkVals.name=this.value" placeholder="${A?'الاسم':'Name'}" /></div>
    <div class="fu-field"><label>${A?'الجوال':'Phone'}</label><input id="bk_phone" inputmode="tel" value="${esc(bkVals.phone||'')}" oninput="bkVals.phone=this.value" placeholder="05xxxxxxxx" /></div>
    <div class="fu-field"><label>${A?'الخدمة المطلوبة':'Service'}</label><input id="bk_svc" value="${esc(bkVals.svc||'')}" oninput="bkVals.svc=this.value" placeholder="${A?'مثال: تسليك مجاري':'e.g. Drain cleaning'}" /></div>
  </div>
  <div class="bkpanel"><h3>📅 ${A?'اختر اليوم':'Pick a day'}</h3><div class="dates">${dchips}${farChip}</div></div>
  <div class="bkpanel"><h3>🕐 ${A?'اختر نافذة الوصول':'Pick an arrival window'}</h3>
    ${slots.length?`<div class="slots">${slots.join('')}</div>`:`<p style="color:var(--muted);font-weight:700">${A?'لا توجد أوقات متاحة في هذا اليوم، جرّب يوماً ثاني.':'No windows left this day — try another.'}</p>`}
    <p style="color:var(--muted);font-size:.8rem;font-weight:700;margin-top:10px">${A?'المنقّط = محجوز، اضغطيه تشوفين تفاصيله · الأخضر = حجز جديد ما شفته بعد':'Dashed = booked, tap for details · Green = new unseen booking'}</p>
  </div>
  <div class="bookf">
    <div class="fu-field"><label>${A?'العنوان':'Address'}</label><textarea id="bk_addr" rows="2" oninput="bkVals.addr=this.value" placeholder="${A?'حي · شارع · رقم المبنى':'District · street'}">${esc(bkVals.addr||'')}</textarea></div>
    <button class="tbtn done" id="bk_go" style="width:100%;margin-top:6px" onclick="createBooking()">✅ ${A?'أكّد الحجز':'Confirm booking'}${bkTime!=null?' — '+bkWindowLabel(bkTime):''}</button>
  </div>`;
}
async function createBooking(){
  const A=lang==='ar';
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('bk_name'), phone=g('bk_phone'), svc=g('bk_svc'), date=bkDate, addr=g('bk_addr');
  if(!name||!phone){ toast('⚠️ '+(A?'عبّي الاسم والجوال':'Fill name & phone')); return; }
  if(!date||bkTime==null){ toast('🕐 '+(A?'اختر اليوم والوقت':'Pick a day & time')); return; }
  const startMin=bkTime, duration=60;
  const payload={ customer_name:name, customer_phone:phone, address:{ street:addr },
    items:[{id:'custom',name:svc||(A?'خدمة':'Service'),ico:'🔧',qty:1,price:0,custom:true}],
    service_date:date, start_min:startMin, duration:duration, end_min:startMin+duration,
    price:0, final_price:0, free:false, status:'confirmed', rating:0, reminded:false,
    quick:true, note:(A?'حجز أنشأه الفني':'Created by technician'), video_url:'', invoice:null, provider_phone:null };
  const btn=document.getElementById('bk_go'); if(btn){ btn.disabled=true; btn.textContent='⏳'; }
  if(cloudReady){
    try{ const r=await sb.from('khafet_orders').insert(payload).select().single(); if(r.error) throw r.error; }
    catch(e){ toast('⚠️ '+(e.message||'')); if(btn){ btn.disabled=false; btn.textContent='📅'; } return; }
  }
  toast('✅ '+(A?'تم الحجز':'Booked'));
  bkTime=null; bkVals.name=''; bkVals.phone=''; bkVals.svc=''; bkVals.addr='';
  tab='orders'; calFilter=date;
  if(cloudReady) loadOrders(); else render();
}
/* ---- قسم الفواتير ---- */
function invOrderTotal(o){
  const iv=o.invoice; if(!iv) return 0;
  if(typeof iv.total==='number') return iv.total;
  return (iv.items||[]).reduce((s,it)=>s+((+it.price||0)*(+it.qty||1)),0);
}
function renderInvoicesTab(){
  const A=lang==='ar';

    (b.date+String(b.startMin).padStart(4,'0')).localeCompare(a.date+String(a.startMin).padStart(4,'0')));
  const total=list.reduce((s,o)=>s+invOrderTotal(o),0);
  const rows = list.length ? list.map(o=>`
    <button class="ivrow" onclick="openInvoice('${o.id}')">
      <span class="iv-m"><b>${esc((o.customer&&o.customer.name)||'')}</b><span>${jobDate(o.date)} · ${jobTime(o.startMin)}</span></span>
      <span class="iv-amt">${ar(Math.round(invOrderTotal(o)))}</span>

function setLang(l){ lang=l; localStorage.setItem('khafet_techlang',l); if(invEditing) renderInvoice(); render(); }
/* الطلبات الجديدة غير المقروءة — زي بريد الإيميل */
function seenJobs(){ try{ return new Set(JSON.parse(localStorage.getItem('khafet_tech_seen')||'[]')); }catch(e){ return new Set(); } }
function markJobsSeen(ids){ try{ const s=seenJobs(); ids.forEach(i=>i&&s.add(i)); localStorage.setItem('khafet_tech_seen', JSON.stringify([...s].slice(-400))); }catch(e){} }
function jobAgo(o){
  if(!o.createdAt) return '';
  const mins=Math.max(1, Math.round((Date.now()-new Date(o.createdAt).getTime())/60000));
  const A=lang==='ar';
  if(mins<60) return A?('وصل قبل '+ar(mins)+' د'):(mins+'m ago');
  const h=Math.round(mins/60);
  if(h<24) return A?('وصل قبل '+ar(h)+' س'):(h+'h ago');
  const d=Math.round(h/24);
  return A?('وصل قبل '+ar(d)+' يوم'):(d+'d ago');
}

    /* الرئيسية: الجدول فقط — تفاصيل الحجز تطلع بس للمربع المضغوط */
    view=`${heroHTML}${schedHTML()}${shown.length?`
      <div style="margin-top:16px;font-weight:900;font-size:1.08rem">📋 ${lang==='ar'?'تفاصيل الحجز':'Booking details'}</div>
      <div class="jobs" style="margin-top:10px">${cards}</div>`:''}`;
  } else {
    let sec;
    if(tab==='inv')           sec=renderInvTab();
    else if(tab==='book')     sec=renderBookTab();
    else if(tab==='invoices') sec=renderInvoicesTab();
    else if(tab==='acct')     sec=renderAccountTab();
    else                      sec=ordersContent;
    view=`<div class="sechead" style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <button class="backbtn" onclick="goHome()">‹ ${homeLbl}</button>
        <b style="font-size:1.12rem;font-weight:900;flex:1">${secLbl}</b>
      </div>
      <div style="margin-top:12px">${sec}</div>`;
  }
  /* الشريط السفلي الثابت + مسافة تمنع تغطية آخر المحتوى */
  document.getElementById('app').innerHTML = view + '<div style="height:84px"></div>' + renderTabs();
  /* بعد ما شاف قائمة الطلبات، الجديد الحالي يُعتبر مقروءاً */
  if(tab==='orders'){
    const ids=jobs.map(o=>o.dbId).filter(Boolean);
    setTimeout(function(){ markJobsSeen(ids); }, 1500);
  }
}
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),1800); }

document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
loadLocal(); render();                 // اعرض فوراً من المحلي
if(window.supabase) initCloud();        // ثم من السحابة
else window.addEventListener('load', initCloud);

/* 👁 إظهار/إخفاء كلمة المرور — يُطبَّق تلقائياً على أي حقل كلمة مرور يظهر بالصفحة */
const _EYE_OPEN='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const _EYE_OFF='<svg viewBox="0 0 24 24"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
function _pwToggle(btn){
  const inp=btn.parentNode.querySelector('input');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  btn.innerHTML = show?_EYE_OFF:_EYE_OPEN;
  btn.setAttribute('aria-label', show?'إخفاء كلمة المرور':'إظهار كلمة المرور');
  try{ inp.focus({preventScroll:true}); }catch(e){}
}
function applyPwEyes(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.parentNode && inp.parentNode.classList && inp.parentNode.classList.contains('pwwrap')) return;
    const w=document.createElement('span'); w.className='pwwrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.innerHTML=_EYE_OPEN;
    b.setAttribute('aria-label','إظهار كلمة المرور');
    b.setAttribute('tabindex','-1');
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); _pwToggle(b); };
    w.appendChild(b);
  });
}
/* يراقب الصفحة: أي حقل كلمة مرور جديد يُرسم، ينضاف له الزر تلقائياً */
try{
  new MutationObserver(function(){ applyPwEyes(); })
    .observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}
document.addEventListener('DOMContentLoaded', applyPwEyes);
setTimeout(applyPwEyes, 300);
</script>
