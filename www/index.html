function locOkHtml(){
  return `<div class="loc-ok">✅ تم تحديد موقعك بدقة · <a href="${state.address.mapUrl}" target="_blank" rel="noopener">شوف على الخريطة</a></div>`;
}
function detectLocation(){
  const el=document.getElementById('loc-status');
  const btn=document.querySelector('.loc-btn');
  if(!navigator.geolocation){ toast('جهازك ما يدعم تحديد الموقع'); return; }
  if(el) el.innerHTML='<div class="loc-loading">⏳ جارٍ تحديد موقعك... اسمح بالإذن</div>';
  if(btn) btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude.toFixed(6), lng=pos.coords.longitude.toFixed(6);
    state.address.lat=lat; state.address.lng=lng;
    state.address.mapUrl='https://www.google.com/maps?q='+lat+','+lng;
    save();
    if(btn){ btn.classList.remove('busy'); btn.classList.add('set');
      const b=btn.querySelector('b'), s=btn.querySelector('small');
      if(b) b.textContent='✓ موقعك محدّد'; if(s) s.textContent='تقدر تحدّثه لو تغيّر';
    }
    if(el) el.innerHTML=locOkHtml();
    toast('تم تحديد موقعك ✅');
    reverseGeocodeCity(lat,lng);   // استنتج المدينة من الموقع (لتوزيع المزوّدين) · بصمت
  }, function(err){
    if(btn) btn.classList.remove('busy');
    if(el) el.innerHTML='<div class="loc-err">⚠️ ما قدرنا نحدد موقعك. اسمح بإذن الموقع، أو اكتب العنوان تحت.</div>';
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
}
// استنتاج اسم المدينة من الإحداثيات (اختياري · لتوزيع الطلب على مزوّدي نفس المدينة)
async function reverseGeocodeCity(lat,lng){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ar&zoom=10&lat='+lat+'&lon='+lng);
    if(!r.ok) return;
    const j=await r.json(); const ad=j&&j.address;
    const city = ad && (ad.city||ad.town||ad.village||ad.county||ad.state);
    if(city){ state.address.city=city; save(); }
  }catch(e){/* تجاهل بصمت */}
}
function pickDate(iso){
  // يحمي «التاريخ الأبعد» كمان · لأن تقويم الجهاز يسمح باختيار أي يوم
  if(isOffDay(iso)){ toast('يوم '+AR_DAYS[parseISO(iso).getDay()]+' إجازة، اختر يوماً آخر'); return; }
  state.booking.date=iso; state.booking.time=null; renderTime();
}
function pickTime(min){ state.booking.time=min; renderTime(); }
function toggleWantsEarlier(){ state.booking.wantsEarlier = state.booking.wantsEarlier===false; renderTime(); }
// يبحث عن أبكر موعد متاح قبل موعد الطلب الحالي (يظهر إذا ألغى عميل ثاني وفرّغ وقت)
function earlierSlotFor(o){
  if(!o || o.status==='cancelled' || o.status==='done') return null;
  const need = o.duration || 60;
  const curKey = o.date + String(o.startMin).padStart(4,'0');
  const today=new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<30;i++){
    const d=new Date(today); d.setDate(today.getDate()+i); const iso=dateISO(d);
    if(iso > o.date) break;                       // ما نتجاوز موعده الحالي
    for(let t=WORK_START;t+need<=WORK_END;t+=ARRIVAL_WINDOW){
      if(iso+String(t).padStart(4,'0') >= curKey) break;   // وصلنا موعده أو بعده
      if(slotAvailable(iso,t,need,o.id,groupsOfItems(o.items))) return {date:iso,time:t};
    }
  }
  return null;
}
// كم دقيقة متوقّع يتأخر هذا الموعد بسبب طلبات قبله بنفس اليوم أضاف لها الفني وقت إضافي
function expectedDelayFor(o){
  if(!o || o.status==='done' || o.status==='cancelled') return 0;
  return state.orders
    .filter(x=> x.id!==o.id && x.date===o.date && x.status!=='cancelled' && x.status!=='done' && x.startMin<=o.startMin)
    .reduce((a,x)=>a+(x.delayMin||0),0);
}
async function advanceOrder(id){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const e=earlierSlotFor(o);
  if(!e){ toast('ما عاد فيه موعد أبكر متاح'); render(); return; }
  if(!confirm(LX('تقديم موعدك إلى ','Move your visit to ')+dayLabel(e.date)+' · '+windowLabel(e.time)+'؟')) return;
  o.date=e.date; o.startMin=e.time; o.endMin=e.time+(o.duration||60);
  save();
  render();
  cloudPatch(o.dbId,{service_date:o.date, start_min:o.startMin, end_min:o.endMin}).then(ok=>{ if(ok) toast('تم تقديم موعدك ✅'); });
}

function renderTime(){
  if(!quickMode && cartCount()===0){ go('home'); return; }
  // حدّث الجدول المشغول الحقيقي · لو تغيّر أعد رسم المواعيد
  loadBusy().then(ch=>{ if(ch && view==='time') render(); });
  const b=state.booking;
  if(b.date && daysUntil(b.date)<0){ b.date=null; b.time=null; }   // حجز قديم محفوظ بالجهاز
  const today=new Date(); today.setHours(0,0,0,0);
  const need0=scheduleDuration();
  // افتراضياً: أقرب يوم فيه وقت متاح فعلاً
  if(!b.date){
    for(let i=0;i<14;i++){ const d=new Date(today); d.setDate(today.getDate()+i); const iso=dateISO(d);
      let has=false; for(let tt=WORK_START;tt+need0<=WORK_END;tt+=ARRIVAL_WINDOW){ if(slotAvailable(iso,tt,need0)){has=true;break;} }
      if(has){ b.date=iso; break; } }
    if(!b.date) b.date=dateISO(today);
  }
  // نتخطّى أيام الإجازة تماماً · ما تظهر بالشريط
  const days=[]; for(let i=0;i<16;i++){ const d=new Date(today); d.setDate(today.getDate()+i);
    if(!OFF_DAYS.includes(d.getDay())) days.push(d); }
  const dchips=days.map(d=>{
    const iso=dateISO(d), isToday=i0(d,today), active=b.date===iso;
    const early = !quickMode && advanceEligible(iso);   // خصم ٥٪ فقط لما الأيام القريبة ممتلئة
    return `<button class="dchip ${active?'active':''}" onclick="pickDate('${iso}')" style="position:relative">
      ${early?`<span style="position:absolute;top:-7px;left:-4px;background:#0b7a3b;color:#fff;font-size:.6rem;font-weight:900;padding:2px 5px;border-radius:7px;line-height:1">٥٪-</span>`:''}
      <small>${isToday?'اليوم':AR_DAYS[d.getDay()]}</small><b>${ar(d.getDate())}</b><span class="mon">${AR_MONTHS[d.getMonth()]}</span></button>`;
  }).join('');
  // مربع «تاريخ أبعد» · تقويم لاختيار أي يوم (بعد أسبوعين، شهر...)
  const farActive = b.date && !days.some(d=>dateISO(d)===b.date);
  const fd = farActive ? parseISO(b.date) : null;
  const farChip = `<label class="dchip more-date ${farActive?'active':''}">
    ${farActive
      ? `<small>${AR_DAYS[fd.getDay()]}</small><b>${ar(fd.getDate())}</b><span class="mon">${AR_MONTHS[fd.getMonth()]}</span>`
      : `<small>📅</small><b>＋</b><span class="mon">تاريخ أبعد</span>`}
    <input type="date" min="${dateISO(today)}" value="${farActive?b.date:''}" onchange="if(this.value)pickDate(this.value)" />
  </label>`;

  const need=scheduleDuration();
  const slots=[];
  for(let t=WORK_START;t+need<=WORK_END;t+=ARRIVAL_WINDOW){
    const ok=slotAvailable(b.date,t,need), active=b.time===t;
    slots.push(`<button class="slot win ${active?'active':''}" ${ok?'':'disabled'} onclick="pickTime(${t})">${windowLabel(t,need)}</button>`);
  }
  const anyFree=slots.some(s=>!s.includes('disabled'));
  const ready=b.time!=null;
  const we=state.booking.wantsEarlier!==false;

  document.getElementById('app').innerHTML=`
    <div class="wrap screen" style="padding-bottom:100px">
      ${pageHead('متى يناسبك؟', quickMode?'home':'pick')}
      ${stepBar(2)}
      <div class="panel" style="margin-top:14px"><h3>📅 اختر اليوم</h3><div class="dates">${dchips}${farChip}</div></div>
      <div class="notify-toggle ${we?'on':''}" style="margin-top:14px" onclick="toggleWantsEarlier()">
        <span class="nt-check">${we?'✓':''}</span>
        <span class="nt-t"><b>🔔 بلّغوني لو صار موعد أبكر</b><small>لو أحد ألغى وصار وقت أقرب، نتواصل معك ونقدّم موعدك</small></span>
      </div>
      <div class="panel" id="slotsPanel"><h3>🕐 ${LX('اختر وقت الوصول','Choose arrival time')}</h3>
        ${anyFree?`<div class="slots">${slots.join('')}</div>`:`<p style="color:var(--muted)">لا توجد أوقات متاحة في هذا اليوم، جرّب يوماً ثاني.</p>`}
      </div>
      ${quickMode?'':`<div class="flow-sum" style="margin-top:14px">⏱️ <span>${LX(`مدة الزيارة التقريبية: <b>${fmtDuration(need)}</b> · نحجزها لك كاملة.`,`Estimated visit time: <b>${fmtDuration(need)}</b> · we reserve it all for you.`)}</span></div>`}
    </div>
    ${ready?`<div class="nextbar"><div class="wrap">
      <div class="nb-info"><b>${windowLabel(b.time,need)}</b><small>${dayLabel(b.date)}</small></div>
      <button class="nb-go" onclick="nextFromTime()">التالي <span>←</span></button>
    </div></div>`:''}`;
}
// عند الضغط على «التالي» بدون اختيار نافذة وصول: نبّه العميل ووجّهه للسلوتات بدل ما يسكت الزر
function nextFromTime(){
  if(state.booking.time==null){
    toast(LX('🕐 اختر وقت الوصول أول','🕐 Choose an arrival time first'));
    const el=document.getElementById('slotsPanel');
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    return;
  }
  go('info');
}

  ].join('');

/* ---------- كود الخصم ---------- */
/* التحقّق من كود الإحالة يصير في *الخادم* · المتصفح ما يقرّر خصماً.
   يرجع سبباً واضحاً: كود غلط / كودك أنت / مو أول طلب. */
let refCheck={ code:'', ok:false, reason:'', busy:false };
const REF_MSG={
  unknown: '❌ الكود غير صحيح',
  self:    '❌ ما تقدر تستخدم كودك أنت',
  not_new: 'ℹ️ الخصم لأول طلب فقط · وأنت عميل عندنا من قبل 🙏',
  not_signed_in: '❌ تعذّر التحقق، حدّث الصفحة',
  network: '⚠️ تعذّر التحقق، تأكد من الإنترنت وحاول ثانية'
};
/* كود الإحالة محفوظ «خافت-XXXXXX»: بالإنجليزي نعرضه KHAFET-XXXXXX، ونقبل الشكلين عند الإدخال */
function codeShow(c){ c=String(c||''); return _uiEN() ? c.replace(/^خافت[-\s]?/,'KHAFET-') : c; }
function codeNorm(v){ v=String(v||'').trim(); return v.replace(/^khafet[-\s]?/i,'خافت-'); }
async function setPromo(v){
  state.promo=codeNorm(v);
  captureBookingInputs();
  if(!state.promo){ refCheck={code:'',ok:false,reason:'',busy:false}; renderInfo(); return; }
  refCheck={ code:state.promo, ok:false, reason:'', busy:true }; renderInfo();
  try{
    if(!myUid) await ensureAnonSession();
    const { data, error } = await sb.rpc('check_referral', { p_code: state.promo });
    if(error) throw error;
    refCheck={ code:state.promo, ok:!!(data&&data.ok), reason:(data&&data.reason)||'', busy:false };
    if(refCheck.ok && !(WELCOME_CREDIT>0) && FRIEND_BONUS>0 && isVerified){ try{ const fc=await sb.rpc('claim_friend_credit',{ p_code: state.promo }); if(fc && fc.data && fc.data.ok){ await loadMyRef(); toast(LX('🎁 انضاف لك '+ar(fc.data.amount)+' ريال رصيد','🎁 '+fc.data.amount+' SAR credit added')); } }catch(e){} }
  }catch(e){ console.warn('ref check:', e.message||e);
    // فشل الاتصال ≠ كود خاطئ · نميّزهما فلا نتّهم كود العميل ظلماً
    refCheck={ code:state.promo, ok:false, reason:'network', busy:false }; }
  renderInfo();
}

/* ---------- خريطة اختيار الموقع (Leaflet + OpenStreetMap) ---------- */
let _pmap=null, _pmarker=null;
function ensureMarker(lat,lng){
  if(!_pmap) return;
  if(_pmarker){ _pmarker.setLatLng([lat,lng]); }
  else{
    _pmarker=L.marker([lat,lng],{draggable:true}).addTo(_pmap);
    _pmarker.on('dragend',()=>{ const p=_pmarker.getLatLng(); setPin(p.lat,p.lng); });
  }
}
/* ══════════ عناوين متعددة: بيتي، بيت أهلي، الاستراحة... ══════════ */
function addrTitle(a,i){ return (a&&a.label)||(a&&a.house?('منزل '+a.house):'')||('عنوان '+ar((i||0)+1)); }
function addrChipsHtml(){
  const list=state.addresses||[]; if(!list.length) return '';
  const cur=state.address||{};
  const chips=list.map((a,i)=>`<button type="button" class="addr-chip ${cur.id&&cur.id===a.id?'active':''}" onclick="useAddress(${i})">🏠 ${esc(addrTitle(a,i))}</button>`).join('');
  return `<div class="addr-chips">${chips}<button type="button" class="addr-chip new" onclick="newAddress()">＋ عنوان جديد</button></div>`;
}
function useAddress(i){ const a=(state.addresses||[])[i]; if(!a) return; captureBookingInputs(); state.address=Object.assign({}, a); save(); render(); }
function newAddress(){ captureBookingInputs(); state.address={city:'',district:'',street:'',house:'',mark:'',notes:'',lat:'',lng:'',mapUrl:'',photoUrl:'',label:''}; save(); render(); }
/* يحفظ العنوان الحالي في القائمة: يحدّث الموجود أو يضيف جديد (حد أقصى 6) */
function rememberAddress(){
  const a=state.address||{}; if(!(a.lat&&a.lng) && !a.house) return;
  state.addresses=state.addresses||[];
  if(!a.id) a.id='a'+Date.now().toString(36);
  const i=state.addresses.findIndex(x=>x.id===a.id);
  if(!a.label && i<0 && state.addresses.length===0) a.label='بيتي';
  const copy=Object.assign({}, a);
  if(i>=0) state.addresses[i]=copy; else state.addresses.push(copy);
  if(state.addresses.length>6) state.addresses=state.addresses.slice(-6);
  save();
}
function deleteAddress(i){ const a=(state.addresses||[])[i]; if(!a) return; if(!confirm(LX('حذف العنوان «','Delete the address “')+addrTitle(a,i)+LX('»؟','”?'))) return; state.addresses.splice(i,1); if(state.address&&state.address.id===a.id) state.address.id=null; save(); render(); }
function initPickMap(){
  const el=document.getElementById('pickmap'); if(!el) return;
  if(!window.L){ setTimeout(initPickMap,300); return; }   // انتظر تحميل مكتبة الخريطة
  const a=state.address;
  const hasLoc=!!(a.lat&&a.lng);
  const lat=hasLoc?+a.lat:26.2794, lng=hasLoc?+a.lng:50.2083;   // افتراضي: الخبر
  if(_pmap){ try{_pmap.remove();}catch(e){} _pmap=null; _pmarker=null; }
  _pmap=L.map(el,{zoomControl:true}).setView([lat,lng], hasLoc?16:12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_pmap);
  if(hasLoc) ensureMarker(lat,lng);
  _pmap.on('click',(e)=>{ ensureMarker(e.latlng.lat,e.latlng.lng); setPin(e.latlng.lat,e.latlng.lng); });
  setTimeout(()=>{ try{_pmap.invalidateSize();}catch(e){} },220);   // إصلاح حجم الخريطة بعد الرسم
}
function setPin(lat,lng){
  const la=(+lat).toFixed(6), ln=(+lng).toFixed(6);
  state.address.lat=la; state.address.lng=ln;
  state.address.mapUrl='https://www.google.com/maps?q='+la+','+ln;
  save();
  const st=document.getElementById('loc-status'); if(st) st.innerHTML=locOkHtml();
  const ast=document.getElementById('acc-loc-status'); if(ast) ast.innerHTML=accLocOkHtml();   // صفحة الحساب
  reverseGeocodeCity(la,ln);
}
function locateMe(){
  if(!navigator.geolocation){ toast('جهازك ما يدعم تحديد الموقع'); return; }
  toast('⏳ جارٍ تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(_pmap){ _pmap.setView([lat,lng],17); ensureMarker(lat,lng); }
    setPin(lat,lng); toast('تم تحديد موقعك ✅ تقدر تعدّله بسحب الدبوس');
  }, function(){ toast('اسمح بإذن الموقع أو اضغط على الخريطة يدوياً'); }, {enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

let lastOrderId=null;

  rememberAddress();   // يحفظ العنوان في قائمة عناوينه ليختاره بضغطة المرة الجاية

  const items = quickMode

  const loyDisc = quickMode ? 0 : loyaltyDiscFor();
  const duration=scheduleDuration();
  const _subnote=(document.getElementById('f_subnote')||{}).value||'';
  const note=state.subReq ? ((state.quickNote||'')+(_subnote.trim()?(' · ملاحظات العميل: '+_subnote.trim()):'')) : ((state.problem&&state.problem.desc)||'');
  const promoCodeIn=(document.getElementById('f_promo')||{}).value ? document.getElementById('f_promo').value.trim() : (state.promo||'');
  // الخصم والرصيد والولاء يُعاد حسابهم في الخادم · هذي بس للعرض
  const discPct = (loyDisc>0 || !refCheck.ok) ? 0 : FRIEND_PCT;
  const refOk = !!refCheck.ok && !(loyDisc>0) && !quickMode;
  const promo = promoInfo(quickMode||loyDisc>0||discPct>0);
  const advDisc = quickMode ? 0 : advanceDiscFor(b.date, cartPrice(), quickMode);   // خصم ٥٪ الذكي
  const afterDisc = Math.max(0, Math.round(cartPrice()*(1-discPct/100)) - loyDisc - advDisc - promo.amt);
  const creditUse = quickMode ? 0 : Math.min(myRef.balance||0, afterDisc);
  const videoFile=(document.getElementById('f_video')||{}).files;
  const houseFile=(document.getElementById('f_housePhoto')||{}).files;
  const payNow = (quickMode||state.subReq) ? 0 : Math.max(0, afterDisc - creditUse);
  const payMethodNow = (orderPayMethod==='tamara' && payNow>=TAMARA_MIN_LABOR) ? 'tamara' : (orderPayMethod==='applepay' && APPLEPAY_OK) ? 'applepay' : (orderPayMethod==='card' && cardInappOn()) ? 'card' : 'online';
  if(payNow>0 && payMethodNow==='card'){ _cardData=cardRead(); if(!_cardData) return; }
  if(payNow>0 && !cloudReady){ toast(LX('الدفع يحتاج اتصال بالإنترنت','Payment needs an internet connection')); return; }

  const btn=document.getElementById('orderPayCta')||document.querySelector('.cta'); const btnTxt=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='⏳ جارٍ الإرسال...'; }

  // ارفع المقطع (إن وُجد) إلى Supabase Storage
  let videoUrl='';
  if(videoFile && videoFile[0]){
    if(cloudReady){
      if(btn) btn.textContent='⏳ جارٍ رفع المقطع...';
      try{ videoUrl=await uploadVideo(videoFile[0]); }
      catch(e){ toast('تعذّر رفع المقطع، بنكمّل الطلب بدونه'); }

    }
    if(btn) btn.textContent='⏳ جارٍ الإرسال...';
  }
  // ارفع صورة المنزل (إن وُجدت) · تُخزَّن داخل العنوان
  if(houseFile && houseFile[0] && cloudReady){
    if(btn) btn.textContent='⏳ جارٍ رفع صورة المنزل...';
    try{ a.photoUrl=await uploadVideo(houseFile[0]); }
    catch(e){ toast('تعذّر رفع صورة المنزل، بنكمّل بدونها'); }
    if(btn) btn.textContent='⏳ جارٍ الإرسال...';
  }

  const base={
    createdAt:Date.now(), items, customer:{...c}, address:{...a},
    date:b.date, startMin:b.time, duration, endMin:b.time+duration,
    price: quickMode?0:cartPrice(),
    finalPrice: quickMode?0:Math.max(0, afterDisc - creditUse),
    referredBy: (refOk ? codeNorm(promoCodeIn) : ''), creditUsed: creditUse,
    loyaltyDisc: loyDisc, advanceDisc: advDisc, promoDisc: promo.amt, promoKind: promo.kind||'',
    free:false, status:'new', rating:0, reminded:false, quick:quickMode, note, videoUrl, wantsEarlier: state.booking.wantsEarlier!==false,
    promoCode: refOk?codeNorm(promoCodeIn):'', discountPct: discPct,
    payRequired: payNow>0,
  };
  let order=null;
  if(payNow>0){
    // الحجز المدفوع ما يُحفظ بالجهاز: لازم يوصل الخادم ثم يفتح الدفع
    try{ order=await cloudInsert(base); }
    catch(e){ console.error('❌ فشل حفظ الطلب:', e); toast(serverMsg(e)||LX('ما وصل الطلب، تأكد من الإنترنت وحاول مرة ثانية','Order not sent, check your connection and try again')); if(btn){ btn.disabled=false; btn.textContent=btnTxt; } return; }
    state.orders.unshift(order);
    state.myOrderIds=(state.myOrderIds||[]); state.myOrderIds.push(order.id);
    state.cart={}; state.parts={}; state.booking={date:null,time:null}; state.problem={desc:''}; state.promo=''; quickMode=false;
    save(); lastOrderId=order.id;

      // الدفع في مكانه: العميل يبقى على صفحة الفاتورة. بعد الدفع تطلع تفاصيل طلبه، ولو لغى أو تعذّر يلقى طلبه في «طلباتي»
      _payingNow=true; let started=false;
      try{ started=await startOrderPayment(order, payMethodNow); } finally { _payingNow=false; }
      if(!started) go('mybookings');
    } else go('confirm');
    return;
  }
  if(cloudReady){
    try{ order=await cloudInsert(base); }
    catch(e){
      // اطبع السبب كامل · لا تبتلعه بصمت
      console.error('❌ فشل حفظ الطلب في الخادم:', {

      toast(LX('⏳ ما فيه إنترنت، يُرسل طلبك تلقائيًا أول ما يرجع الاتصال','⏳ No connection, your order will be sent automatically when you are back online'));
      setTimeout(resendPending, 8000);
    }
  }
  if(!order){ state.seq++; order=Object.assign({id:'#'+ar(state.seq), num:state.seq, dbId:null}, base); }
  state.orders.unshift(order);
  state.myOrderIds=(state.myOrderIds||[]); state.myOrderIds.push(order.id);
  state.cart={}; state.parts={}; state.booking={date:null,time:null}; state.problem={desc:''}; state.promo=''; quickMode=false;
  save(); lastOrderId=order.id; go('confirm');
}

/* ══════════ الأغراض المستخدمة + بلاغ الضمان ══════════
   القطع المستخدمة = بنود فاتورة الفني القادمة من المخزون (stockId).
   ضمان القطع سنتان من تاريخ الخدمة (حسب البنود). البلاغ = طلب جديد مجاني مرتبط بالطلب الأصلي. */
const PARTS_WARRANTY_DAYS=730;
function orderParts(o){ const inv=o.invoice; if(!inv||!Array.isArray(inv.items)) return []; return inv.items.filter(it=>it&&(it.stockId||it.id==='stock')); }
function pbZoom(u){ if(!u) return; u=String(u).trim(); if(/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^https?:/i.test(u)) return; document.body.insertAdjacentHTML('beforeend',`<div class="pb-zoom" onclick="this.remove()"><img src="${esc(u)}" /></div>`); }
function partsBox(o){
  if(o.status!=='done'||o.warrantyOf) return '';
  const parts=orderParts(o); if(!parts.length) return '';
  const ageDays=(Date.now()-new Date(o.date||o.createdAt).getTime())/86400000;
  const inW=ageDays<=PARTS_WARRANTY_DAYS;
  const rows=parts.map((p,i)=>{
    const claim=state.orders.find(x=>x.warrantyOf&&o.dbId&&x.warrantyOf===o.dbId&&x.warrantyItem===p.name);

/* أقرب موعد صالح لبلاغ الضمان · الخادم يرفض أي وقت فات أو يوم إجازة */
function nextClaimSlot(){
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const d=new Date(); d.setHours(0,0,0,0);
  let sm=Math.max(WORK_START, Math.ceil((nowMin+LEAD_MIN+5)/ARRIVAL_WINDOW)*ARRIVAL_WINDOW);
  if(sm+60>WORK_END){ d.setDate(d.getDate()+1); sm=WORK_START; }
  for(let i=0;i<14 && isOffDay(dateISO(d));i++){ d.setDate(d.getDate()+1); sm=WORK_START; }
  return { date:dateISO(d), startMin:sm };
}
async function claimWarranty(orderId, idx){

    providerPhone:o.providerPhone||'', promoCode:'', discountPct:0, referredBy:'', creditUsed:0, loyaltyDisc:0, advanceDisc:0,

/* كم ساعة باقية على موعد الطلب (سالب = فات الموعد) */
function hoursUntil(o){ if(!o||!o.date) return 999; const d=parseISO(o.date); d.setHours(0,0,0,0); return (d.getTime()+(+o.startMin||0)*60000-Date.now())/3600000; }
/* سياسة الإلغاء: مجاني حتى 4 ساعات قبل الموعد، وبعدها عبر التواصل فقط */
async function cancelOrder(id){ const o=state.orders.find(x=>x.id===id); if(!o) return; if(hoursUntil(o)<cancelHours()){ toast('باقي أقل من '+ar(cancelHours())+' ساعات على الموعد، تواصل معنا للإلغاء'); return; } if(!confirm(LX('متأكد من إلغاء الطلب ','Cancel order ')+o.id+'؟'+(o.paidAmount>0?LX(' يرجع لك المبلغ كامل.',' You will get a full refund.'):''))) return;

  if(ok){ toast('تم إلغاء الطلب'); } else { const x=state.orders.find(y=>y.id===id); if(x&&x.status==='cancelled'&&!x.dbId){ x.status=prev; } save(); render(); } }

/* ══════════ إعادة الطلب بضغطة: نفس الخدمات والعنوان، يختار الموعد بس ══════════ */
function reorder(id){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const cart={};
  (o.items||[]).forEach(i=>{ if(i.part||i.custom||isFeeId(i.id)||i.id==='quick') return; const s=SERVICES.find(x=>x.id===i.id); if(s&&!s.hidden) cart[i.id]=Math.max(1,+i.qty||1); });
  if(!Object.keys(cart).length){ toast('خدمات هذا الطلب ما عادت متاحة، اختر من القائمة'); go('home'); return; }
  quickMode=false; state.subReq=null; state.cart=cart; state.parts={}; state.booking={date:null,time:null}; state.problem={desc:''};
  if(o.address&&(o.address.lat||o.address.house)) state.address=Object.assign({}, state.address||{}, o.address);
  save(); toast('🔁 حطّينا نفس الخدمات والعنوان، اختر الموعد'); go('time');
}

let _rs=null;
function kmodalEl(){ let m=document.getElementById('kmodal'); if(!m){ m=document.createElement('div'); m.id='kmodal'; m.className='kmodal'; m.onclick=e=>{ if(e.target===m) closeKModal(); }; document.body.appendChild(m); } return m; }
function closeKModal(){ const m=document.getElementById('kmodal'); if(m) m.remove(); _rs=null; }
function openReschedule(id){

  if(hoursUntil(o)<cancelHours()){ toast('باقي أقل من '+ar(cancelHours())+' ساعات على الموعد، تواصل معنا لتغييره'); return; }
  _rs={id:o.id, date:o.date, time:null};
  rsRender();
  loadBusy().then(ch=>{ if(ch&&_rs) rsRender(); });   // حدّث الجدول المشغول الحقيقي

function rsRender(){
  if(!_rs) return;
  const o=state.orders.find(x=>x.id===_rs.id); if(!o){ closeKModal(); return; }
  const need=o.duration||60;
  const today=new Date(); today.setHours(0,0,0,0);
  const days=[]; for(let i=0;i<16;i++){ const d=new Date(today); d.setDate(today.getDate()+i); if(!OFF_DAYS.includes(d.getDay())) days.push(d); }
  if(!days.some(d=>dateISO(d)===_rs.date)) _rs.date=dateISO(days[0]);
  const dchips=days.map(d=>{ const iso=dateISO(d); return `<button type="button" class="dchip ${_rs.date===iso?'active':''}" onclick="rsPick('${iso}')"><small>${i0(d,today)?'اليوم':AR_DAYS[d.getDay()]}</small><b>${ar(d.getDate())}</b><span class="mon">${AR_MONTHS[d.getMonth()]}</span></button>`; }).join('');
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const slots=[];
  for(let t=WORK_START;t+need<=WORK_END;t+=ARRIVAL_WINDOW){
    const past = _rs.date===dateISO(today) && t < nowMin+LEAD_MIN;
    const same = _rs.date===o.date && t===o.startMin;
    const ok = !past && !same && slotAvailable(_rs.date,t,need,o.id,groupsOfItems(o.items));
    slots.push(`<button type="button" class="slot win ${_rs.time===t?'active':''}" ${ok?'':'disabled'} onclick="rsTime(${t})">${windowLabel(t)}</button>`);
  }
  const anyFree=slots.some(s=>!s.includes('disabled'));
  kmodalEl().innerHTML=`<div class="kbox">
    <div class="kh"><b>📅 تغيير موعد ${esc(o.id)}</b><button type="button" class="kx" onclick="closeKModal()">✕</button></div>

    <h3 style="font-size:.95rem;margin-bottom:8px">اختر اليوم</h3><div class="dates">${dchips}</div>
    <h3 style="font-size:.95rem;margin:12px 0 8px">${LX('اختر وقت الوصول','Choose arrival time')}</h3>
    ${anyFree?`<div class="slots">${slots.join('')}</div>`:`<p style="color:var(--muted)">لا توجد أوقات متاحة في هذا اليوم، جرّب يوماً ثاني.</p>`}
    <div class="kacts"><button type="button" class="cta gold" ${_rs.time==null?'disabled':''} onclick="rsConfirm()">تأكيد الموعد الجديد</button></div>
  </div>`;
}
function rsPick(iso){ if(!_rs||isOffDay(iso)) return; _rs.date=iso; _rs.time=null; rsRender(); }
function rsTime(t){ if(!_rs) return; _rs.time=t; rsRender(); }
function rsConfirm(){
  if(!_rs) return;
  const o=state.orders.find(x=>x.id===_rs.id); if(!o||_rs.time==null) return;
  if(hoursUntil(o)<cancelHours()){ toast('باقي أقل من '+ar(cancelHours())+' ساعات على الموعد، تواصل معنا لتغييره'); closeKModal(); return; }

function rate(id,n){ const o=state.orders.find(x=>x.id===id); if(!o||o.rating) return; o.rating=n; save(); cloudPatch(o.dbId,{rating:n}); toast('شكراً لتقييمك '+'⭐'.repeat(n)); render(); }
function saveFeedback(id, btn){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const ta = btn && btn.parentElement ? btn.parentElement.querySelector('textarea') : null;
  const val = ta ? ta.value.trim() : '';
  if(!val){ toast('اكتب رسالتك أولاً'); return; }
  if(o.feedback){ return; }   // مقفلة · ما تتغيّر بعد الإرسال
  o.feedback=val; save(); cloudPatch(o.dbId,{feedback:val}); toast('شكراً، وصلتنا رسالتك 🌟'); render();
}

function pageHead(title,backTo){ return `<div class="pagehead"><button class="back" onclick="go('${backTo}')" title="رجوع">→</button><h2>${title}</h2></div>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* رابط آمن: https فقط، وإلا نبني رابط بحث من العنوان */
function safeUrl(u, fallback){ try{ var s=String(u==null?'':u).trim(); if(s.slice(0,8).toLowerCase()==='https://' && !/\s/.test(s) && s.indexOf('"')<0 && s.indexOf(String.fromCharCode(39))<0 && s.indexOf('<')<0 && s.indexOf('>')<0 && s.indexOf(String.fromCharCode(92))<0) return s; }catch(e){} return fallback||''; }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=(typeof TR==='function'?TR(msg):msg); t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

const T_DICT_N={}; for(const _k in T_DICT){ T_DICT_N[_west(_k).trim()]=T_DICT[_k]; }
applyCachedCatalog();   // آخر كتالوج محفوظ بالجهاز (قبل ما يوصل الجديد من الخادم)
const _EMO=/^((?:[←-⯿️‍\u{1F000}-\u{1FAFF}]+\s*)+)([\s\S]+)$/u;
function _tr(raw){
  if(raw==null) return raw;
  const s=String(raw);
  const m0=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const lead=m0[1], core=m0[2], trail=m0[3];
  if(!core) return raw;
  // مطابقة كاملة (غير حسّاسة لشكل الأرقام العربية/الغربية)
  const h=T_DICT_N[_west(core)];
  if(h!=null && h!=='') return lead+h+trail;
  // مطابقة بعد إزالة رمز تعبيري/سهم بادئ (مثل: 🔧 سباكة → 🔧 Plumbing)
  const em=core.match(_EMO);
  if(em){ const r=T_DICT_N[_west(em[2].trim())]; if(r!=null && r!=='') return lead+em[1]+r+trail; }
  // لا مطابقة كاملة: طبّق بدائل الكلمات ثم حوّل الأرقام للغربية
  let out=core, ch=false;
  for(const [a,b] of _TOK){ if(out.indexOf(a)>=0){ out=out.split(a).join(b); ch=true; } }
  const w=_west(out); if(w!==out){ out=w; ch=true; }
  return ch? lead+out+trail : raw;
}
function TR(s){ return UILANG==='en'? _tr(s): s; }   // للاستخدام في التوست ونحوه
const _SKIP='.tip-card,.tip-body,.tip-content,.tip-hero,.tip-cat,.tip-img,.notr';  // محتوى ديناميكي (مقالات) لا يُترجم
function _translateEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  for(const node of nodes){
    if(node.parentElement && node.parentElement.closest(_SKIP)) continue;   // تجاوز محتوى المقالات
    if(node.__o===undefined) node.__o=node.nodeValue;   // خزّن الأصل مرة واحدة
    const t=_tr(node.__o);
    if(t!==node.nodeValue) node.nodeValue=t;
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po===undefined) el.__po=el.getAttribute('placeholder'); const t=T_DICT_N[_west((el.__po||'').trim())]; if(t) el.setAttribute('placeholder',t); });
}
function _restoreEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n; while(n=w.nextNode()){ if(n.__o!==undefined && n.nodeValue!==n.__o) n.nodeValue=n.__o; }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po!=null) el.setAttribute('placeholder',el.__po); });
}
let _mo=null;
function _startI18n(){
  if(!_mo) _mo=new MutationObserver(()=>{ if(UILANG==='en') applyLang(); });
  try{ _mo.disconnect(); }catch(e){}
  const app=document.getElementById('app'), hd=document.querySelector('header.top');
  if(app) _mo.observe(app,{childList:true,subtree:true,characterData:true});
  if(hd)  _mo.observe(hd,{childList:true,subtree:true,characterData:true});
  ['locModal','termsModal','toast'].forEach(id=>{ const el=document.getElementById(id); if(el) _mo.observe(el,{childList:true,subtree:true,characterData:true}); });
}
function applyLang(){
  if(UILANG!=='en') return;
  if(_mo){ try{_mo.disconnect();}catch(e){} }
  _translateEl(document.querySelector('header.top'));
  _translateEl(document.getElementById('app'));
  ['locModal','termsModal','toast'].forEach(id=>{ const el=document.getElementById(id); if(el) _translateEl(el); });
  _startI18n();
}

const _EYE_OPEN='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const _EYE_OFF='<svg viewBox="0 0 24 24"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
function _pwToggle(btn){
  const inp=btn.parentNode.querySelector('input');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  btn.innerHTML = show?_EYE_OFF:_EYE_OPEN;
  btn.setAttribute('aria-label', show?'إخفاء كلمة المرور':'إظهار كلمة المرور');
  try{ inp.focus({preventScroll:true}); }catch(e){}
}
function applyPwEyes(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.parentNode && inp.parentNode.classList && inp.parentNode.classList.contains('pwwrap')) return;
    const w=document.createElement('span'); w.className='pwwrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.innerHTML=_EYE_OPEN;
    b.setAttribute('aria-label','إظهار كلمة المرور');
    b.setAttribute('tabindex','-1');
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); _pwToggle(b); };
    w.appendChild(b);
  });
}
/* يراقب الصفحة: أي حقل كلمة مرور جديد يُرسم، ينضاف له الزر تلقائياً */
try{
  new MutationObserver(function(){ applyPwEyes(); })
    .observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}
document.addEventListener('DOMContentLoaded', applyPwEyes);
