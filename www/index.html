function cancelOrder(id){ const o=state.orders.find(x=>x.id===id); if(!o) return; if(!confirm('متأكد من إلغاء الطلب '+o.id+'؟')) return; o.status='cancelled'; save(); cloudPatch(o.dbId,{status:'cancelled'}); toast('تم إلغاء الطلب'); render(); }
function printCustInvoice(id){ const o=state.orders.find(x=>x.id===id); if(o&&o.invoice) printInvoiceDoc(o); }
function printInvoiceDoc(o){
  const inv=o.invoice||{items:[],total:0};
  const rows=(inv.items||[]).map(it=>`<tr><td>${esc(it.name)}</td><td>${ar(it.qty||1)}</td><td>${money(+it.price||0)}</td><td>${money((+it.price||0)*(+it.qty||1))}</td></tr>`).join('');
  const d=new Date(); const ds=ar(d.getDate())+'/'+ar(d.getMonth()+1)+'/'+ar(d.getFullYear());
  const html='<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>فاتورة '+o.id+'</title>'
   +'<style>body{font-family:Cairo,system-ui,Arial,sans-serif;padding:24px;color:#141414;max-width:520px;margin:0 auto}'
   +'.h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #F5C518;padding-bottom:12px}'
   +'.h .b{font-size:1.5rem;font-weight:900}.h .b span{background:#F5C518;padding:2px 10px;border-radius:8px}'
   +'.meta{color:#555;font-size:.9rem;margin:12px 0}.meta div{margin:3px 0}'
   +'table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:right;padding:9px 6px;border-bottom:1px solid #eee;font-size:.92rem}'
   +'th{background:#FBF3D0;font-weight:800}.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem;margin-top:14px;border-top:2px solid #141414;padding-top:10px}'
   +'.ft{margin-top:22px;text-align:center;color:#888;font-size:.85rem}@media print{.noprint{display:none}}</style></head><body>'
   +'<div class="h"><div class="b">🔧 <span>'+BRAND+'</span></div><div style="text-align:left"><b>فاتورة</b><br>'+o.id+'</div></div>'
   +'<div class="meta"><div>العميل: '+esc(o.customer.name)+' · '+esc(o.customer.phone)+'</div><div>التاريخ: '+ds+'</div></div>'
   +'<table><thead><tr><th>الخدمة</th><th>العدد</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div class="tot"><span>الإجمالي</span><span>'+money(inv.total||0)+'</span></div>'
   +'<div class="ft">شكراً لتعاملك مع '+BRAND+' · '+PHONE+'</div>'
   +'<div class="noprint" style="text-align:center;margin-top:18px"><button onclick="print()" style="padding:10px 22px;font-weight:800;border:none;background:#141414;color:#fff;border-radius:10px;cursor:pointer">🖨️ طباعة</button></div>'
   +'</body></html>';
  const w=window.open('','_blank'); if(!w){ toast('اسمح بالنوافذ المنبثقة للطباعة'); return; } w.document.write(html); w.document.close();
}
function rate(id,n){ const o=state.orders.find(x=>x.id===id); if(!o||o.rating) return; o.rating=n; save(); cloudPatch(o.dbId,{rating:n}); toast('شكراً لتقييمك '+'⭐'.repeat(n)); render(); }
function saveFeedback(id, btn){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const ta = btn && btn.parentElement ? btn.parentElement.querySelector('textarea') : null;
  const val = ta ? ta.value.trim() : '';
  if(!val){ toast('اكتب رسالتك أولاً'); return; }
  if(o.feedback){ return; }   // مقفلة — ما تتغيّر بعد الإرسال
  o.feedback=val; save(); cloudPatch(o.dbId,{feedback:val}); toast('شكراً — وصلتنا رسالتك 🌟'); render();
}

function pageHead(title,backTo){ return `<div class="pagehead"><button class="back" onclick="go('${backTo}')" title="رجوع">→</button><h2>${title}</h2></div>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=(typeof TR==='function'?TR(msg):msg); t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---- محرّك الترجمة ---- */
function _west(s){ return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
const _TOK=[["/ سنة","/ year"],["/سنة","/year"],["توفّر","Save "],["ريال","SAR"],["ر.س","SAR"],["٪","%"]];
const T_DICT_N={}; for(const _k in T_DICT){ T_DICT_N[_west(_k).trim()]=T_DICT[_k]; }
const _EMO=/^((?:[←-⯿️‍\u{1F000}-\u{1FAFF}]+\s*)+)([\s\S]+)$/u;
function _tr(raw){
  if(raw==null) return raw;
  const s=String(raw);
  const m0=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const lead=m0[1], core=m0[2], trail=m0[3];
  if(!core) return raw;
  // مطابقة كاملة (غير حسّاسة لشكل الأرقام العربية/الغربية)
  const h=T_DICT_N[_west(core)];
  if(h!=null && h!=='') return lead+h+trail;
  // مطابقة بعد إزالة رمز تعبيري/سهم بادئ (مثل: 🔧 سباكة → 🔧 Plumbing)
  const em=core.match(_EMO);
  if(em){ const r=T_DICT_N[_west(em[2].trim())]; if(r!=null && r!=='') return lead+em[1]+r+trail; }
  // لا مطابقة كاملة: طبّق بدائل الكلمات ثم حوّل الأرقام للغربية
  let out=core, ch=false;
  for(const [a,b] of _TOK){ if(out.indexOf(a)>=0){ out=out.split(a).join(b); ch=true; } }
  const w=_west(out); if(w!==out){ out=w; ch=true; }
  return ch? lead+out+trail : raw;
}
function TR(s){ return UILANG==='en'? _tr(s): s; }   // للاستخدام في التوست ونحوه
const _SKIP='.tip-card,.tip-body,.tip-content,.tip-hero,.tip-cat,.tip-img,.notr';  // محتوى ديناميكي (مقالات) لا يُترجم
function _translateEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  for(const node of nodes){
    if(node.parentElement && node.parentElement.closest(_SKIP)) continue;   // تجاوز محتوى المقالات
    if(node.__o===undefined) node.__o=node.nodeValue;   // خزّن الأصل مرة واحدة
    const t=_tr(node.__o);
    if(t!==node.nodeValue) node.nodeValue=t;
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po===undefined) el.__po=el.getAttribute('placeholder'); const t=T_DICT_N[_west((el.__po||'').trim())]; if(t) el.setAttribute('placeholder',t); });
}
function _restoreEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n; while(n=w.nextNode()){ if(n.__o!==undefined && n.nodeValue!==n.__o) n.nodeValue=n.__o; }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po!=null) el.setAttribute('placeholder',el.__po); });
}
let _mo=null;
function _startI18n(){
  if(!_mo) _mo=new MutationObserver(()=>{ if(UILANG==='en') applyLang(); });
  try{ _mo.disconnect(); }catch(e){}
  const app=document.getElementById('app'), hd=document.querySelector('header.top');
  if(app) _mo.observe(app,{childList:true,subtree:true,characterData:true});
  if(hd)  _mo.observe(hd,{childList:true,subtree:true,characterData:true});
}
function applyLang(){
  if(UILANG!=='en') return;
  if(_mo){ try{_mo.disconnect();}catch(e){} }
  _translateEl(document.querySelector('header.top'));
  _translateEl(document.getElementById('app'));
  _startI18n();
}
function syncLangBtn(){ const b=document.getElementById('langBtn'); if(b){ const s=b.querySelector('.lbl'); if(s) s.textContent = UILANG==='en'?'ع':'EN'; } }
function setUILang(l){
  UILANG=l; try{localStorage.setItem('khafet_uilang',l);}catch(e){}
  document.documentElement.lang = l==='en'?'en':'ar';
  document.documentElement.dir  = l==='en'?'ltr':'rtl';
  render();                                   // يعيد البناء بالعربي
  if(l==='en') applyLang(); else _restoreEl(document.querySelector('header.top'));
  syncLangBtn();
  window.scrollTo(0,0);
}
function toggleLang(){ setUILang(UILANG==='en'?'ar':'en'); }

document.documentElement.lang = UILANG==='en'?'en':'ar';
