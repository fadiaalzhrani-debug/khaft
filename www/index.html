<html lang="ar" dir="rtl">
<head>

<meta name="description" content="خافِت · منصة صيانة منزلية شاملة: سباكة، كهرباء، تكييف، نجارة، دهان، أجهزة وتنظيف. احجز فني موثوق في الوقت المناسب لك." />
<link rel="icon" href="logo.png" />
<meta name="theme-color" content="#F5C518" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    /* هوية خافِت · أصفر ذهبي + فحمي دافئ */
    --gold:#F5C518; --gold-strong:#E3AF07; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --ink-soft:#40392E; --brand:#1A1712; --brand-dark:#000000; --brand-soft:#FBF1C9;
    --accent:#F5C518; --accent-soft:#FEF6D6;
    --bg:#FAF7EF; --card:#FFFFFF; --muted:#6E685B; --line:#EBE5D6; --line-strong:#DED6C3;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626; --danger-soft:#FBE4E4; --warn:#B45309;
    --r:18px; --r-sm:12px; --r-lg:24px;
    --shadow:0 1px 2px rgba(40,32,10,.04), 0 10px 28px rgba(40,32,10,.06);
    --shadow-sm:0 1px 2px rgba(40,32,10,.04), 0 4px 12px rgba(40,32,10,.045);
    --shadow-gold:0 8px 26px rgba(245,197,24,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:940px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:1rem}
  h1,h2,h3{line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
  .hidden{display:none !important}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold);color:var(--ink)}

  /* ===== Header ===== */
  header.top{position:sticky;top:0;z-index:40;background:rgba(250,247,239,.82);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;height:68px}
  .logo{display:flex;align-items:center;gap:11px;font-weight:900;font-size:1.4rem;color:var(--ink);letter-spacing:-.01em}
  .logo .mk{width:40px;height:40px;border-radius:13px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-gold)}
  .logo .brand-txt{display:flex;flex-direction:column;line-height:1.08}
  .logo .brand-txt small{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:1px}
  .logo .mk img{width:100%;height:100%;object-fit:cover;display:block}
  .spacer{flex:1}
  .hbtn{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;font-weight:700;font-size:.92rem;transition:.18s}
  .hbtn.solid{background:var(--gold);color:var(--ink)}
  .hbtn.solid:hover{background:var(--gold-strong)}
  .hbtn.ghost{background:transparent;color:var(--muted)}
  .hbtn.ghost:hover{background:rgba(0,0,0,.05);color:var(--ink)}
  .hbtn .badge{background:var(--ink);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:.75rem;display:grid;place-items:center}
  /* اختيار الموقع */
  .loc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-tint);border:1px solid var(--gold-soft);border-radius:999px;padding:8px 13px;font-weight:800;font-size:.9rem;color:var(--ink);max-width:170px}
  .loc-chip #locCity{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loc-chip .chev{color:var(--muted);font-size:.8rem}
  .loc-modal{position:fixed;inset:0;z-index:75;background:rgba(20,18,10,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .loc-modal.show{display:flex}
  .loc-sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px}
  .loc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .loc-head b{font-size:1.2rem;font-weight:900}
  .loc-head button{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:1.1rem}
  .loc-sheet .hint{color:var(--muted);font-size:.9rem;margin-bottom:14px}
  .loc-gps{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:#fff;font-weight:800;padding:14px;border-radius:13px;margin-bottom:14px}
  .loc-cities{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .loc-cities button{padding:13px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fcfbf6;font-weight:800;font-size:.92rem;transition:.12s}
  .loc-cities button:hover{border-color:var(--gold)}
  .loc-cities button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .loc-other{display:flex;gap:8px;margin-top:14px}
  .loc-other input{flex:1;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fcfbf6}
  .loc-other button{background:var(--gold);color:var(--ink);font-weight:900;padding:0 20px;border-radius:12px}

  /* ===== Hero ===== */
  .hero{background:linear-gradient(158deg,#F9D338 0%,#F5C518 52%,#EFBC0C 100%);color:var(--ink);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%, rgba(255,255,255,.35), transparent 55%);pointer-events:none}
  .hero-in{padding:44px 20px 48px;text-align:center;position:relative;z-index:1}
  .hero-mark{width:74px;height:74px;margin:0 auto 14px;color:var(--ink)}
  .hero-logo{display:inline-block;width:92px;height:92px;border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 26px rgba(0,0,0,.14);background:#fff}
  .hero-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .hero h1{font-size:2.15rem;font-weight:900;letter-spacing:-.035em}
  .hero p{font-size:1.05rem;max-width:460px;margin:9px auto 0;color:var(--ink-soft);font-weight:600}
  .hero-sub b{display:block;font-size:1.18rem;font-weight:900;color:var(--ink)}
  .hero-sub span{display:block;font-size:.98rem;font-weight:600;color:var(--ink-soft);margin-top:3px}
  /* هيرو مختصر */
  .hero-slim .hero-in{padding:30px 20px 34px}
  .hero.hero-slim h1{font-size:2rem}
  .hero-slim p{margin-top:5px}
  .hero-wave{display:block;width:100%;height:22px;color:var(--bg);position:relative;z-index:1}

  /* ===== Layout ===== */
  section{margin-top:34px}
  .sec-head{margin-bottom:16px}
  .sec-head h2{font-size:1.35rem;font-weight:900}
  .sec-head p{color:var(--muted);font-size:.92rem;margin-top:2px}

  .features{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:22px;color:var(--muted);font-size:.9rem;font-weight:600}
  .features span{display:inline-flex;gap:6px;align-items:center}

  /* Category tiles */
  .ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .ctile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;box-shadow:var(--shadow-sm);transition:.18s}
  .ctile:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--gold)}
  .ct-ic{width:58px;height:58px;margin:0 auto 12px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.7rem}
  .ctile b{display:block;font-size:1.05rem;font-weight:800}
  .ctile small{color:var(--muted);font-size:.82rem}

  /* Popular row */
  .popular{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 12px;text-align:center;transition:.15s;position:relative;box-shadow:var(--shadow-sm)}
  .pcard:hover{border-color:var(--gold);transform:translateY(-3px)}
  .pcard .pic{font-size:1.7rem}
  .pcard b{display:block;font-size:.92rem;margin-top:4px}
  .pcard small{color:var(--muted);font-size:.76rem}
  .pcard .padd{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:1.2rem}

  /* Loyalty slim */
  .loystrip{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border:1px solid #F1E3A8;border-radius:var(--r);padding:15px 18px}
  .loystrip .ls-ic{font-size:1.7rem}
  .loystrip .ls-txt{flex:1;font-size:.95rem;font-weight:600}
  .loystrip .ls-txt b{font-weight:800}
  .loystrip .ls-count{font-weight:900;font-size:1.15rem;background:#fff;border:1px solid #F1E3A8;padding:6px 13px;border-radius:999px;white-space:nowrap}

  /* Service cards */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:.15s}
  .scard:hover{box-shadow:var(--shadow);border-color:#e3ddc9}
  .scard .stop{display:flex;gap:13px;align-items:flex-start}
  .scard .sico{width:50px;height:50px;border-radius:15px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.6rem;flex-shrink:0}
  .scard .sinfo{flex:1}
  .scard .scat{font-size:.74rem;color:var(--muted);font-weight:700}
  .scard h3{font-size:1.05rem;font-weight:800;margin-top:1px}
  .scard .sdesc{color:var(--muted);font-size:.9rem;margin-top:3px;min-height:36px}
  .scard .meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pill{font-size:.79rem;font-weight:700;padding:6px 11px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
  .pill.time{background:#f3f1e9;color:#5c5a50}
  .pill.price{background:var(--gold-soft);color:#7a5f00}
  .scard .add{margin-top:15px;background:var(--ink);color:#fff;font-weight:800;padding:12px;border-radius:13px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
  .scard .add:hover{background:#000}
  .scard .add.in{background:var(--ok)}

  /* Floating cart */
  .cartbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--ink);color:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.18);transform:translateY(120%);transition:.25s}
  .cartbar.show{transform:translateY(0)}
  .cartbar .wrap{display:flex;align-items:center;gap:14px;height:68px}
  .cartbar .ci{background:rgba(255,255,255,.14);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;position:relative}
  .cartbar .ci b{position:absolute;top:-6px;left:-6px;background:var(--gold);color:var(--ink);border-radius:999px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
  .cartbar .cinfo{flex:1;line-height:1.35}
  .cartbar .cinfo b{font-size:1.02rem}
  .cartbar .cinfo small{opacity:.8;display:block;font-size:.82rem}
  .cartbar .cgo{background:var(--gold);color:var(--ink);font-weight:900;padding:12px 22px;border-radius:13px;display:flex;gap:7px;align-items:center}

  /* ===== Sub screens ===== */
  .screen{min-height:60vh;padding-bottom:30px}
  .pagehead{display:flex;align-items:center;gap:13px;margin:22px 0 4px}
  .back{width:44px;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow-sm);transition:.15s}
  .back:hover{background:#f4f2ea}
  .pagehead h2{font-size:1.5rem;font-weight:900;letter-spacing:-.02em}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:22px;margin-top:16px}
  .panel h3{font-size:1.05rem;font-weight:800;margin-bottom:15px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}

  /* Cart lines */
  .cline{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
  .cline:last-child{border-bottom:none}
  .cline .ci2{width:46px;height:46px;border-radius:13px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.4rem;flex-shrink:0}
  .cline .cn{flex:1}
  .cline .cn b{font-size:.98rem}
  .cline .cn small{color:var(--muted);display:block;font-size:.8rem}
  .qty{display:flex;align-items:center;background:#f4f2ea;border-radius:11px;overflow:hidden}
  .qty button{width:34px;height:36px;font-weight:900;font-size:1.15rem}
  .qty span{min-width:28px;text-align:center;font-weight:800}
  .del{color:var(--danger);font-size:1.15rem;padding:6px}
  .totals{display:flex;flex-direction:column;gap:9px}
  .totals .row{display:flex;justify-content:space-between;align-items:center}
  .totals .row.big{font-size:1.18rem;font-weight:900;border-top:2px dashed var(--line);padding-top:13px;margin-top:4px}
  .totals .muted{color:var(--muted)}
  .est{background:var(--gold-soft);border:1px solid #F1E3A8;border-radius:var(--r-sm);padding:14px 16px;display:flex;gap:12px;align-items:center;margin-top:16px}
  /* ملخص الطلب بشكل فاتورة */
  .rcpt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .rc-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--ink);color:var(--gold)}
  .rc-head b{font-size:1.02rem;font-weight:900}
  .rc-head small{color:#d8d2bd;font-weight:700;font-size:.78rem}
  .rc-sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px 4px;font-weight:900;font-size:.86rem;color:var(--muted);letter-spacing:.02em}
  .rc-sec small{font-weight:700;font-size:.74rem;color:var(--muted)}
  .rc-row{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:start;padding:10px 16px;border-top:1px dashed var(--line)}
  .rc-row .rc-n{font-weight:800;line-height:1.35}
  .rc-row .rc-n small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;margin-top:1px}
  .rc-row .rc-p{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
  .rc-row.off{opacity:.65}
  .rc-row.off .rc-n{text-decoration:line-through}
  .rc-row.off .rc-n small{text-decoration:none}
  .rc-x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:900;font-size:1.05rem;font-family:inherit;cursor:pointer;line-height:1}
  .rc-add{padding:6px 12px;border-radius:9px;border:1.5px solid var(--gold);background:var(--gold-tint);color:var(--ink);font-weight:800;font-size:.8rem;font-family:inherit;cursor:pointer;white-space:nowrap}
  .rc-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;grid-column:1/-1}
  .rc-opts button{padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:.8rem;font-family:inherit;cursor:pointer;color:var(--ink)}
  .rc-opts button.on{background:var(--gold);border-color:var(--gold)}
  .rc-total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-top:2px solid var(--ink);font-weight:900;font-size:1.06rem;background:var(--gold-tint)}
  .rc-total .big{font-size:1.15rem}
  .rc-note{padding:8px 16px 12px;color:var(--muted);font-size:.8rem;font-weight:700;background:var(--gold-tint)}
  .est .big{font-size:1.08rem;font-weight:800}

  /* Forms */
  .field{margin-bottom:15px}
  .field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:7px}
  .field label .req{color:var(--danger)}
  .field input,.field textarea,.field select{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#FCFBF6;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold-strong);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .field textarea{resize:vertical;min-height:72px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

  /* Date chips */
  .dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .dates::-webkit-scrollbar{display:none}

async function registerInstall(app, build){
  try{
    if(!sb) return;
    const day=new Date().toISOString().slice(0,10);
    try{ if(localStorage.getItem('kh_install_day')===day) return; }catch(e){}
    let id=await KH_STORE.getItem('kh_install_id');
    if(!id || !/^[0-9a-f-]{36}$/i.test(id)){
      id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
      await KH_STORE.setItem('kh_install_id',id);
    }
    const C=window.Capacitor; const p=(C&&C.isNativePlatform&&C.isNativePlatform()&&C.getPlatform)?C.getPlatform():'web';
    const r=await sb.rpc('register_install',{ p_id:id, p_app:app, p_platform:(p==='ios'||p==='android')?p:'web', p_build:build });
    if(r && !r.error){ try{ localStorage.setItem('kh_install_day',day); }catch(e){} }
  }catch(e){}
}

function verGt(a,b){ const x=String(a||'').split('.').map(n=>parseInt(n,10)||0), y=String(b||'').split('.').map(n=>parseInt(n,10)||0); for(let i=0;i<Math.max(x.length,y.length);i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; }
let _storeChk=0;
async function checkStoreUpdate(){
  try{
    const C=window.Capacitor; if(!(C&&C.isNativePlatform&&C.isNativePlatform())) return;
    if(Date.now()-_storeChk < 3600000) return; _storeChk=Date.now();
    const AU=(C.Plugins&&C.Plugins.AppUpdate)||(typeof C.registerPlugin==='function'?C.registerPlugin('AppUpdate'):null); if(!AU) return;
    const info=await AU.getAppUpdateInfo({ country:'SA' }); if(!info) return;
    const plat=C.getPlatform();
    const newer = plat==='android' ? (info.updateAvailability===2 && (+info.availableVersionCode||0) > (+info.currentVersionCode||0))
                                   : verGt(info.availableVersionName, info.currentVersionName);
    if(!newer || document.getElementById('updWall')) return;
    // أول يوم من نزول النسخة في آب ستور: ممكن ما توصل لكل الأجهزة، فنسمح بـ«لاحقًا»
    const rel=info.availableVersionReleaseDate ? new Date(info.availableVersionReleaseDate).getTime() : 0;
    const soft = plat==='ios' && rel>0 && (Date.now()-rel < 86400000);
    const A=!_uiEN();
    const w=document.createElement('div'); w.id='updWall'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
    w.innerHTML='<div class="uw-box"><div class="uw-ic">⬆️</div><h2>'+(A?'فيه نسخة جديدة':'New version available')+'</h2><p>'+(A?'حدّث خافِت لآخر نسخة عشان تكمل.':'Update خافِت to the latest version to continue.')+'</p>'
      +'<button type="button" class="uw-btn" id="uwGo">'+(A?'حدّث الآن':'Update now')+'</button>'
      +(soft?'<button type="button" id="uwLater" style="margin-top:12px;background:none;border:none;color:var(--muted);font-weight:800;font-family:inherit;font-size:.95rem;cursor:pointer">'+(A?'لاحقًا':'Later')+'</button>':'')+'</div>';
    document.body.appendChild(w);
    document.getElementById('uwGo').onclick=async function(){
      try{ if(plat==='android' && info.immediateUpdateAllowed){ await AU.performImmediateUpdate(); } else { await AU.openAppStore({ country:'SA' }); } }
      catch(e){ try{ await AU.openAppStore({ country:'SA' }); }catch(_){} } };
    const l=document.getElementById('uwLater'); if(l) l.onclick=function(){ w.remove(); };
  }catch(e){}
}

function vatOf(total){ const L=legalInfo(); if(!(L.vat&&L.vatNo)) return 0; return Math.round((total - total/(1+L.vatPct/100))*100)/100; }
/* رمز QR للفاتورة الضريبية المبسطة (هيئة الزكاة والضريبة: TLV ثم Base64) */
function zatcaQr(total, vatAmt, when){
  const L=legalInfo(); if(!(L.vat&&L.vatNo)) return '';
  try{ const enc=new TextEncoder(); const parts=[[1,L.name],[2,L.vatNo],[3,new Date(when||Date.now()).toISOString()],[4,(+total).toFixed(2)],[5,(+vatAmt).toFixed(2)]];
    let s=''; for(const [t,v] of parts){ const b=enc.encode(String(v)); s+=String.fromCharCode(t)+String.fromCharCode(b.length); b.forEach(c=>{ s+=String.fromCharCode(c); }); }
    return btoa(s); }catch(e){ return ''; }
}

async function ensureAnonSession(){

}

/* ---------- إشعارات التطبيق (Push) ----------
   تشتغل بس لما الموقع يكون داخل تطبيق Capacitor.
   على المتصفح العادي ما يصير شي · بدون أي خطأ. */
function inApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }

/* حالة الإشعارات · تُعرض بصفحة «حسابي» عشان نشخّص بدون أدوات مطوّر */
let pushState='—';
function setPushState(s){ pushState=s; try{ const el=document.getElementById('push-status'); if(el) el.textContent=s; }catch(e){} }

/* الطريقة الصحيحة للوصول لإضافة أصلية بدون حزم JS:
   Capacitor.registerPlugin · أما Capacitor.Plugins فطريقة قديمة قد لا تعمل بالإصدار ٦. */
function getPushPlugin(){
  const C=window.Capacitor;
  if(!C) return null;
  try{ if(typeof C.registerPlugin==='function') return C.registerPlugin('PushNotifications'); }catch(e){}
  return (C.Plugins && C.Plugins.PushNotifications) || null;
}
let _pn=null, _pnReady=false;
function devicePlatform(){ try{ return (window.Capacitor&&window.Capacitor.getPlatform&&window.Capacitor.getPlatform())||'ios'; }catch(e){ return 'ios'; } }
async function initPush(){
  if(!inApp()){ setPushState('متصفح · الإشعارات للتطبيق فقط'); return; }
  try{
    const PN = _pn || getPushPlugin();
    if(!PN){ setPushState('❌ إضافة الإشعارات غير مثبّتة'); return; }
    _pn = PN;
    if(_pnReady) return void registerNow(PN);   // المستمعات مركّبة · أعد الطلب فقط

    // ⚠️ لازم *ننتظر* تركيب المستمعات قبل register · وإلا يوصل ردّ آبل وما فيه أحد يسمعه
    await PN.addListener('registration', async (t)=>{
      try{
        // انتظر الهوية · القفل يرفض أي كتابة بلا auth.uid()
        for(let i=0; i<20 && !myUid; i++){ await ensureAnonSession(); if(!myUid) await new Promise(r=>setTimeout(r,300)); }
        if(!myUid){ setPushState('❌ تعذّر تجهيز الهوية · حدّث الصفحة'); return; }
        // التسجيل عبر دالة الخادم (تفرض auth.uid() بنفسها) · أوثق من الكتابة المباشرة
        const { data, error } = await sb.rpc('register_device', { p_token: t.value, p_platform: devicePlatform() });
        if(error) throw error;
        if(!data || data.ok !== true) throw new Error(data && data.reason ? data.reason : 'رفض الخادم');
        setPushState('✅ الجهاز مسجّل · الإشعارات شغّالة');
      }catch(e){
        console.error('device save:', e);
        setPushState('❌ فشل الحفظ: '+(e.message||e.hint||e.details||JSON.stringify(e)));
      }
    });
    await PN.addListener('registrationError', e=> setPushState('❌ رفضتها آبل: '+JSON.stringify(e)));
    await PN.addListener('pushNotificationActionPerformed', ()=>{ go('mybookings'); });
    _pnReady = true;
    await registerNow(PN);
  }catch(e){ setPushState('❌ خطأ: '+(e.message||e)); }
}
async function registerNow(PN){
  try{
    let perm = await PN.checkPermissions();
    if(perm.receive === 'prompt' || perm.receive === 'prompt-with-rationale') perm = await PN.requestPermissions();
    if(perm.receive !== 'granted'){ setPushState('⚠️ الإذن مرفوض ('+perm.receive+') · فعّله من إعدادات الآيفون'); return; }
    setPushState('⏳ نسجّل الجهاز…');
    await PN.register();
    // لو آبل ما ردّت خلال ١٥ ثانية، قل ذلك بدل ما تعلّق للأبد
    setTimeout(()=>{ if(pushState.indexOf('⏳')===0) setPushState('⚠️ آبل ما ردّت · تأكد من الإنترنت واضغط «أعد المحاولة»'); }, 15000);
  }catch(e){ setPushState('❌ خطأ بالتسجيل: '+(e.message||e)); }
}

let CAT_FEATURED=['plumb','elec','ac'];   // الأقسام اللي تظهر في الواجهة تحت «صيانة»
function applyCatalog(cats, svcs){
  if(!Array.isArray(cats)||!cats.length||!Array.isArray(svcs)||!svcs.length) return false;
  const activeCats=cats.filter(c=>c&&c.id&&c.active!==false).sort((a,b)=>(+a.sort||0)-(+b.sort||0));
  if(!activeCats.length) return false;
  Object.keys(CATS).forEach(k=>{ delete CATS[k]; });
  activeCats.forEach(c=>{ CATS[c.id]={name:c.name, ico:c.icon||'🛠️', featured:!!c.featured, name_en:c.name_en||'', soon:!!c.soon}; });
  CAT_FEATURED=activeCats.filter(c=>c.featured).map(c=>c.id);
  // الخدمات المخفية (مثل خدمات صفحة الحلول) تبقى قابلة للحجز حتى لو قسمها مخفي، لكنها لا تظهر في القوائم
  const list=svcs.filter(s=>s&&s.id&&s.active!==false&&(CATS[s.cat_id]||s.hidden)).sort((a,b)=>(+a.sort||0)-(+b.sort||0))
    .map(s=>({id:s.id, cat:s.cat_id, ico:s.icon||'🔧', name:s.name, desc:s.description||'', dur:+s.duration||0, price:s.custom?0:(+s.price||0), quick:!!s.quick, custom:!!s.custom, hidden:!!s.hidden||!CATS[s.cat_id]||CATS[s.cat_id].soon, name_en:s.name_en||''}));
  SERVICES.length=0; list.forEach(s=>SERVICES.push(s));
  try{ if(typeof T_DICT_N!=='undefined'){ activeCats.forEach(c=>{ if(c.name_en) T_DICT_N[_west(c.name).trim()]=c.name_en; }); list.forEach(s=>{ if(s.name_en) T_DICT_N[_west(s.name).trim()]=s.name_en; }); } }catch(e){}
  try{ Object.keys((state&&state.cart)||{}).forEach(id=>{ if(!svc(id)) delete state.cart[id]; }); }catch(e){}
  return true;
}
function catSoon(k){ return !!(CATS[k]&&CATS[k].soon); }

let PARTS=[];
function applyParts(rows){
  if(!Array.isArray(rows)) return;
  PARTS=rows.filter(r=>r&&r.service_id&&r.item_id).map(r=>({ id:r.id, svc:r.service_id, group:r.group_key, groupName:r.group_name||'', itemId:r.item_id,
    label:r.label||'', qty:+r.qty||1, def:!!r.is_default, sort:+r.sort||0, name:r.item_name||'', name_en:r.item_name_en||'', price:+r.price||0, img:r.image_url||'', inStock:r.in_stock!==false }));
}
function partKey(svcId,group){ return svcId+'|'+group; }
function partLines(){
  if(quickMode||state.subReq) return [];
  const out=[];
  cartItems().forEach(ci=>{
    const groups={};
    PARTS.filter(p=>p.svc===ci.id && p.inStock).sort((a,b)=>a.sort-b.sort).forEach(p=>{ (groups[p.group]=groups[p.group]||[]).push(p); });
    Object.keys(groups).forEach(g=>{
      const opts=groups[g], key=partKey(ci.id,g), st=(state.parts||{})[key]||{};
      const chosen=opts.find(o=>o.itemId===st.itemId)||opts.find(o=>o.def)||opts[0];
      out.push({ key, svcId:ci.id, group:g, groupName:opts[0].groupName, opts, chosen, qty:Math.max(1, Math.min(99, (chosen.qty||1)*(ci.qty||1) + (+st.adj||0))), price:chosen.price, off:!!st.off });
    });
  });
  return out;
}
function partsTotal(){ return partLines().filter(l=>!l.off).reduce((a,l)=>a+l.price*l.qty,0); }
function partName(p){ return (_uiEN() && p.name_en) ? p.name_en : p.name; }
function setPartQty(key,delta){ state.parts=state.parts||{}; const st=state.parts[key]||{}; const line=partLines().find(l=>l.key===key); if(!line) return; const next=line.qty+delta; if(next<1){ togglePart(key,true); return; } if(next>99) return; state.parts[key]=Object.assign({}, st, {adj:(+st.adj||0)+delta, off:false}); captureBookingInputs(); save(); render(); }
function choosePart(key,itemId){ state.parts=state.parts||{}; state.parts[key]=Object.assign({}, state.parts[key]||{}, {itemId, off:false}); captureBookingInputs(); save(); render(); }
function togglePart(key,off){ state.parts=state.parts||{}; state.parts[key]=Object.assign({}, state.parts[key]||{}, off?{off:true}:{off:false, adj:0}); captureBookingInputs(); save(); render(); }

/* رفع مقطع الفيديو إلى Supabase Storage وإرجاع رابطه العام */
/* ---------- وسائط العملاء (صور/فيديو المنزل) ----------
   نخزّن *المسار* مو رابطاً عاماً. الرابط يُولَّد موقّعاً وينتهي بعد دقائق،
   فما أحد يقدر يتصفّح صور بيوت العملاء حتى لو حصل على الرابط لاحقاً. */
async function uploadVideo(file){
  const ext=(file.name.split('.').pop()||'mp4').toLowerCase();
  // اسم طويل عشوائي · ما يُخمّن
  const rnd=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'');
  const path='v_'+Date.now()+'_'+rnd+'.'+ext;
  const { error } = await sb.storage.from('khafet-videos').upload(path, file, {upsert:false, contentType:file.type||'video/mp4'});
  if(error) throw error;
  return path;   // ← المسار، مو الرابط
}
/* يقبل المسار الجديد أو الرابط العام القديم */
function mediaPath(v){
  if(!v) return '';
  const s=String(v).trim();
  /* نقبل فقط مسارًا داخل الباكِت أو رابط تخزين المشروع، ونرفض أي scheme آخر */
  if(/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^https:\/\/[^/]*supabase\.co\/storage\//i.test(s)) return '';
  const m=s.match(/khafet-videos\/(.+?)(\?|$)/);
  return m ? decodeURIComponent(m[1]) : s;
}
async function openMedia(v){
  const p=mediaPath(v);
  if(!p || !sb){ toast('تعذّر فتح الملف'); return; }
  try{
    const { data, error } = await sb.storage.from('khafet-videos').createSignedUrl(p, 600);  // ١٠ دقائق
    if(error || !data) throw error || new Error('no url');
    window.open(data.signedUrl, '_blank', 'noopener');
  }catch(e){ console.warn('media:', e.message||e); toast('تعذّر فتح الملف'); }
}
async function loadOrdersFromCloud(){
  if(!cloudReady || cloudLoading) return;
  cloudLoading=true;
  try{
    // اقصرها على طلبات صاحب الحساب صراحةً · لا نتّكل على RLS وحدها
    // (لو كان الحساب من الطاقم، RLS تسمح له بالكل وما نبي تختلط طلبات غيره هنا)
    let qy = sb.from('khafet_orders').select('*').order('created_at',{ascending:false});
    if(myUid) qy = qy.eq('user_id', myUid);
    const { data, error } = await qy;
    if(error) throw error;
    cloudFails=0;
    // الطلبات اللي ما وصلت الخادم بعد (بلا dbId) نحتفظ بها ونعيد إرسالها، لا نمسحها
    const pending=(state.orders||[]).filter(o=>!o.dbId && o.status!=='cancelled' && (Date.now()-(+o.createdAt||0))<3*864e5);
    state.orders = pending.concat((data||[]).map(rowToOrder));
    save();
    if(pending.length) resendPending();
    if(['home','tech','admin','mybookings'].includes(view)) render();
  }catch(e){
    cloudFails++;
    if(cloudFails===1) console.warn('Supabase load failed:', e.message||e);
    if(cloudFails>=3 && cloudFails<12){
      // توقف مؤقت فقط: نعيد المحاولة تلقائيًا بعد دقيقة، ولا نقطع المزامنة نهائيًا
      setTimeout(()=>{ if(cloudReady) loadOrdersFromCloud(); }, 60000);
    }
  }finally{ cloudLoading=false; }
}
/* الطلبات اللي ما وصلت الخادم (بلا dbId): تُعاد إرسالها تلقائيًا عند رجوع الاتصال أو فتح التطبيق */
let _resending=false;
async function resendPending(){
  if(!cloudReady||_resending) return; _resending=true;
  try{
    const pend=(state.orders||[]).filter(o=>!o.dbId && o.status!=='cancelled' && (Date.now()-(+o.createdAt||0))<3*864e5);
    for(const o of pend){
      let row=null;
      try{
        // لو الطلب وصل فعلًا لكن الرد ضاع، نلقاه بدل ما نكرره
        if(myUid){ const { data }=await sb.from('khafet_orders').select('*').eq('user_id',myUid).eq('service_date',o.date).eq('start_min',o.startMin).eq('customer_phone',(o.customer&&o.customer.phone)||'').limit(1); if(data&&data.length) row=rowToOrder(data[0]); }
        if(!row) row=await cloudInsert(o);

   السباكة والكهرباء فريق واحد (core)، والتكييف فريق، وباقي الأقسام كل واحد لحاله. */
const SLOT_GROUPS={plumb:'core', elec:'core', ac:'ac'};
function slotGroup(cat){ return SLOT_GROUPS[cat] || cat || 'gen'; }
function groupsOfItems(items){
  const g=new Set();
  (items||[]).forEach(it=>{ const s=svc(it&&it.id); if(s&&s.cat) g.add(slotGroup(s.cat)); });
  return Array.from(g);
}
/* السلة الحالية: [] يعني ما نعرف التخصص (طلب سريع) فيزاحم كل الفرق */
function cartGroups(){ return quickMode ? [] : groupsOfItems(cartItems()); }
function groupsClash(a,b){
  if(!a || !a.length || !b || !b.length) return true;   // تخصص غير معروف = يزاحم الكل
  return a.some(x=>b.indexOf(x)>-1);
}
/* سعة كل فريق: كل فني بتخصص معين يزيد حجزًا متزامنًا واحدًا لنفس التخصص */
let CAP={};
function capOf(groups){
  if(!groups || !groups.length) return 1;                       // تخصص غير معروف = فريق واحد
  const n=groups.map(g=>Math.max(1, +CAP[g]||1));
  return Math.min.apply(null, n);                               // الطلب يحتاج كل الفرق، فالأقل هو الحد
}
async function loadBusy(){
  if(!cloudReady||!sb) return false;
  if(Date.now()-busyAt<60000) return false;   // كاش دقيقة
  busyAt=Date.now();
  try{ const cap=await sb.rpc('khafet_slot_capacity'); if(cap && cap.data && typeof cap.data==='object') CAP=cap.data; }catch(e){}
  try{
    const { data }=await sb.rpc('khafet_busy_times');
    if(Array.isArray(data)){ BUSY=data.map(r=>({date:r.d,start:r.s,dur:r.m||60,city:(r.c||'').trim(),groups:Array.isArray(r.g)?r.g:[]})); return true; }
  }catch(e){}
  return false;
}
function slotAvailable(iso,startMin,needMin,excludeId,groups){
  if(isOffDay(iso)) return false;              // إجازة · ما فيه مواعيد
  const end=startMin+needMin+BUFFER;
  if(end-BUFFER>WORK_END) return false;
  const now=new Date();
  if(iso===dateISO(now)){
    const nowMin=now.getHours()*60+now.getMinutes();
    // النافذة تبقى مفتوحة طالما ما انتهت، مع مهلة التجهيز (lead_min) قبل نهايتها
    if(nowMin + LEAD_MIN >= startMin + ARRIVAL_WINDOW) return false;
  }
  // ندمج حجوزات هذا الجهاز مع الجدول الحقيقي لكل العملاء
  const ex=excludeId?state.orders.find(o=>o.id===excludeId):null;
  const myCity=((state.address&&state.address.city)||'').trim();
  const myGroups=(groups&&groups.length)?groups:cartGroups();
  let exSkipped=false;
  const cloud=BUSY.filter(b=>b.date===iso).filter(b=>{
    if(ex && !exSkipped && b.start===ex.startMin){ exSkipped=true; return false; }   // الطلب الجاري تعديله
    if(b.city && myCity && b.city!==myCity) return false;                            // مدينة ثانية = فريق ثاني
    if(!groupsClash(myGroups, b.groups)) return false;                               // تخصص ثاني = جدول ثاني
    return true;
  });
  const seen=new Set(cloud.map(b=>b.start));
  const local=bookingsOn(iso,excludeId)
    .filter(o=>groupsClash(myGroups, groupsOfItems(o.items)))
    .map(o=>({start:o.startMin,dur:o.duration||60}))
    .filter(o=>!seen.has(o.start));   // طلباتي موجودة بالجدولين · بلا تكرار
  const all=cloud.concat(local);
  const cap=capOf(myGroups);
  if(all.length >= MAX_JOBS_PER_DAY*cap) return false;   // جدول الفريق ممتلئ هذا اليوم
  let overlap=0;
  for(const o of all){
    const oEnd=o.start+o.dur+BUFFER;
    if(startMin<oEnd && end>o.start) overlap++;
  }
  return overlap < cap;                                  // يقفل الوقت فقط إذا انشغل كل فنيي التخصص
}

function windowSpan(need){ if(!stOn('long_window_enabled',true)) return ARRIVAL_WINDOW; const from=stNum('long_window_from_min',ARRIVAL_WINDOW)||ARRIVAL_WINDOW; return (need>from) ? Math.ceil(need/ARRIVAL_WINDOW)*ARRIVAL_WINDOW : ARRIVAL_WINDOW; }

   الرمز يُرسل ويُتحقق منه في خادم Supabase · المتصفح ما يقدر يتجاوزه.
   لو العميل داخل بهوية مجهولة، نربط الرقم بنفس الهوية عشان طلباته القديمة تنتقل معه. */
/* قناة إرسال الرمز: 'sms' (رسالة نصية) · آبل ترفض إجبار المستخدم على تثبيت
   تطبيق ثانٍ مثل واتساب للدخول (Guideline 4.2.3). للرجوع لواتساب، غيّرها لـ'whatsapp'. */
const OTP_CHANNEL='sms';
/* حساب مراجعة آبل: يُجبَر على مسار الدخول المباشر (لا «تغيير رقم») ليقبل
   الرمز التجريبي الثابت المضبوط في Supabase → Auth → Phone → Test OTP. */
const DEMO_PHONE='+966500000000';
let otpStep=false, otpPhone='', otpMode='';   // otpMode: 'link' | 'signin'

/* 05xxxxxxxx → +9665xxxxxxxx */
function normPhone(p){
  let d=String(p||'').replace(/[^0-9]/g,'');
  if(d.startsWith('00966')) d=d.slice(2);
  else if(d.startsWith('966')) { /* كما هو */ }
  else if(d.startsWith('0')) d='966'+d.slice(1);
  else if(d.startsWith('5')) d='966'+d;
  return '+'+d;
}

  const body = otpStep ? `

      <button class="cta" onclick="sendOtp()">${chIco} أرسل الرمز عبر ${chName}</button>`;
  document.getElementById('app').innerHTML=`
    <div class="wrap screen">
      ${pageHead('تسجيل الدخول','home')}
      <div class="panel" style="margin-top:14px">${body}</div>
      <div style="height:24px"></div>
    </div>`;

async function sendOtp(){
  const raw=((document.getElementById('lg_cust_phone')||{}).value||'').trim();
  const phone=normPhone(raw);
  if(!/^\+9665\d{8}$/.test(phone)){ toast('اكتب رقم جوال سعودي صحيح (05xxxxxxxx)'); return; }
  if(!cloudReady){ toast('لا يوجد اتصال بالخادم'); return; }
  const btn=document.querySelector('.panel .cta'); if(btn){ btn.disabled=true; btn.textContent='⏳ نرسل الرمز...'; }
  otpPhone=phone;
  try{
    const { data:{ user } } = await sb.auth.getUser();
    // حساب المراجعة يتخطّى ربط الهوية المجهولة، ويدخل مباشرة ليقبل الرمز التجريبي
    if(user && user.is_anonymous && phone!==DEMO_PHONE){
      // اربط الرقم بالهوية الحالية → طلباته السابقة تنتقل معه
      const { error } = await sb.auth.updateUser({ phone });
      if(!error){ otpMode='link'; otpStep=true; render(); return; }
    }
    // رقم مسجّل من قبل (أو جهاز جديد) → دخول عادي
    const { error } = await sb.auth.signInWithOtp({ phone, options:{ channel:OTP_CHANNEL } });
    if(error) throw error;
    otpMode='signin'; otpStep=true; render();
  }catch(e){
    console.warn('otp send:', e.message||e);
    toast('تعذّر إرسال الرمز، تأكد من الرقم وحاول مرة ثانية');
    otpStep=false; render();   // أعد بناء الشاشة (الزر يرجع لنصه الصحيح)
  }
}
async function verifyOtpCode(){
  const token=((document.getElementById('lg_otp')||{}).value||'').trim();
  if(!/^\d{4,8}$/.test(token)){ toast('اكتب الرمز المرسل'); return; }
  const btn=document.querySelector('.panel .cta'); if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  try{
    const { error } = await sb.auth.verifyOtp({
      phone: otpPhone, token,
      type: otpMode==='link' ? 'phone_change' : 'sms'
    });
    if(error) throw error;
    const { data:{ user } } = await sb.auth.getUser();
    if(user){ myUid=user.id; isVerified=true; }
    state.customer=state.customer||{};
    state.customer.phone = state.customer.phone || String(otpPhone||'').replace(/^\+?966/,'0');   // 05xxxxxxxx مثل باقي التطبيق
    save();
    otpStep=false;
    await loadOrdersFromCloud();
    toast('أهلاً بك 👋'); go('account');
    loadMyRef().then(()=>{ if(['account','info','home','checkout'].includes(view)) render(); });   // الرصيد الترحيبي بعد التوثيق
  }catch(e){
    console.warn('otp verify:', e.message||e);
    toast('الرمز غير صحيح أو انتهت صلاحيته');
    if(btn){ btn.disabled=false; btn.textContent='تأكيد ودخول'; }
  }
}

async function submitSubscription(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const name=g('sub_name'), phone=g('sub_phone'), homeNo=g('sub_home');
  if(!name){ toast('اكتب الاسم'); return; }
  if(!phone){ toast('اكتب رقم الجوال'); return; }
  if(!homeNo){ toast('اكتب رقم المنزل'); return; }
  /* موقعه محفوظ من طلباته السابقة؟ نستخدمه تلقائياً بدون ما يعيد التحديد */
  if(!_subLoc && state.address && state.address.lat && state.address.lng)
    _subLoc={lat:state.address.lat, lng:state.address.lng, mapUrl:state.address.mapUrl||('https://www.google.com/maps?q='+state.address.lat+','+state.address.lng)};
  if(!_subLoc){ toast('📍 حدّد موقع منزلك بالزر'); return; }
  if(!termsOK){ toast(LX('لازم توافق على الشروط والأحكام','Please accept the terms')); openTerms(); return; }
  const _p0=subPlan?subPlan.price:0;
  const _pf=_subDisc? Math.round(_p0*(100-_subDisc)/100) : _p0;
  if(_subDisc && payMethod==='tamara') payMethod='online';
  const data={ name, phone, plan:subPlan?subPlan.name:'', price:_pf, status:'new',
                plan_id: subPlan?subPlan.id:'', pay_method: payMethod, pay_status:'unpaid',
                home_no: homeNo, home_loc: _subLoc,
                promo_code: _subPromo||null, discount_pct: _subDisc||0,
                terms_accepted: true, terms_version: TERMS_VERSION, terms_at: new Date().toISOString() };
  const btn=document.querySelector('.cta'); if(btn){ btn.disabled=true; btn.textContent='⏳ جارٍ الإرسال...'; }
  let ok=false;
  /* نولّد الرقم هنا · لأن قراءة الصف بعد الإدراج ممنوعة (حماية خصوصية المشتركين) */
  const subId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
              : ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
                  const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));
  data.id = subId;
  if(cloudReady){ try{ const r=await sb.from('khafet_subscriptions').insert(data);
      if(!r.error) ok=true; else { console.warn('sub insert:',r.error.message); const m=serverMsg(r.error); if(m){ toast(m); if(btn){ btn.disabled=false; btn.textContent='💳 ادفع الآن'; } return; } } }catch(e){ console.warn(e); } }
  /* نحفظ اشتراكه محلياً · عليه تُبنى صفحة «صيانتي السنوية» */
  try{ localStorage.setItem('khafet_mysub', JSON.stringify({id:subId, plan_id:data.plan_id, plan:data.plan, name, phone, home_no:homeNo, ts:Date.now()})); }catch(e){}
  /* بيانات منزله تنحفظ بحسابه · تتعبّى تلقائياً بكل طلب بعدين */
  try{
    state.customer.name = state.customer.name||name;
    state.customer.phone = state.customer.phone||phone;
    state.address.house = homeNo;

  const newRow=MY_CARDS.length?`<div class="cc-row ${cardPick==='new'?'on':''}" onclick="pickCard('new')"><span class="n" style="direction:inherit">${LX('بطاقة ثانية','Another card')}</span></div>`:'';
  const v=k=>esc(_cardDraft[k]||'');
  const fields=cardPick==='new'?`<input id="cc_num" type="tel" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="${LX('رقم البطاقة','Card number')}" value="${v('cc_num')}" oninput="ccFmt(this)">
    <div class="two"><input id="cc_exp" type="tel" inputmode="numeric" autocomplete="cc-exp" maxlength="7" placeholder="MM / YY" value="${v('cc_exp')}" oninput="ccExp(this)"><input id="cc_cvc" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="CVC"></div>
    <input id="cc_name" type="text" autocomplete="cc-name" placeholder="${LX('الاسم على البطاقة','Name on card')}" value="${v('cc_name')}">
    <label class="save"><input type="checkbox" id="cc_save" checked> ${LX('احفظ بطاقتي للطلبات الجاية','Save my card for next orders')}</label>`:'';
  return saved+newRow+fields;
}

/* يقرأ خانات البطاقة ويتحقق منها. يرجّع null مع تنبيه لو فيها غلط */
function cardRead(){
  if(cardPick!=='new' && MY_CARDS.some(c=>c.id===cardPick)) return {saved:cardPick};
  const g=id=>(document.getElementById(id)||{}).value||''; const bad=(id,ar,en)=>{ toast(LX(ar,en)); const e=document.getElementById(id); if(e){ e.focus(); try{ e.scrollIntoView({block:'center'}); }catch(_){} } return null; };
  const number=g('cc_num').replace(/\D/g,''); let sum=0; for(let i=0;i<number.length;i++){ let n=+number[number.length-1-i]; if(i%2===1){ n*=2; if(n>9) n-=9; } sum+=n; }
  if(number.length<13||number.length>19||sum%10!==0) return bad('cc_num','تأكد من رقم البطاقة','Check the card number');
  const ex=g('cc_exp').replace(/\D/g,''); const mm=+ex.slice(0,2), yy=+ex.slice(2,4); const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  if(ex.length!==4||mm<1||mm>12||yy<cy||(yy===cy&&mm<cm)) return bad('cc_exp','تأكد من تاريخ الانتهاء','Check the expiry date');
  const cvc=g('cc_cvc').replace(/\D/g,''); if(cvc.length<3) return bad('cc_cvc','اكتب رمز CVC خلف البطاقة','Enter the CVC on the back of the card');
  let name=g('cc_name').replace(/\s+/g,' ').trim(); if(name && /[^A-Za-z .'-]/.test(name)) return bad('cc_name','اكتب الاسم بالحروف الإنجليزية مثل ما هو على البطاقة','Enter the name in English letters as on the card');
  if(!name) name='Khafet Customer'; else if(name.split(' ').length<2) name+=' Customer';
  return {number, month:String(mm).padStart(2,'0'), year:String(2000+yy), cvc, name, save:!!((document.getElementById('cc_save')||{}).checked)};
}
/* يسأل خادمنا عن حالة الدفعة عدة مرات · يمنع الدفع مرتين لو انقطع الاتصال بعد ما وصلت ميسر */
async function pollPaid(payId, tries){
  for(let i=0;i<(tries||4);i++){
    try{
      const st=await (await fetch(PAY_FN+'/status?id='+encodeURIComponent(payId),{headers:{'Authorization':'Bearer '+(await authToken()),'apikey':SUPABASE_ANON}})).json();
      const s=st&&st.ok&&st.payment&&st.payment.status;
      if(s==='paid') return true;
      if(s && s!=='pending' && s!=='initiated') return false;
    }catch(e){}
    await new Promise(r=>setTimeout(r,2000));
  }
  return false;
}
/* يدفع الطلب بالبطاقة. يرجّع: paid / opened (فتحنا رمز البنك) / failed / fallback (نكمل بصفحة ميسر) */
async function payWithCard(o){
  const c=_cardData; _cardData=null; if(!c) return 'failed';
  try{
    const H=payHeaders(await userToken());
    const init=await (await fetch(PAY_FN+'/card',{method:'POST',headers:H,body:JSON.stringify(c.saved?{ref_id:o.dbId,saved_id:c.saved}:{ref_id:o.dbId})})).json();
    if(!init||!init.ok){ if(init&&init.error==='nothing_due'){ toast(LX('✓ ما عليك مبلغ','✓ Nothing to pay')); loadOrdersFromCloud(); return 'failed'; } toast(LX('ما انقبلت البطاقة، جرّب بطاقة ثانية','The card was not accepted, try another card')); return 'failed'; }
    try{ localStorage.setItem('khafet_pay_pending', init.payment_id); }catch(e){}
    if(init.paid){ try{ await loadOrdersFromCloud(); }catch(e){} showPaidScreen(o); return 'paid'; }
    let url=init.url||'';
    if(!c.saved){
      let j=null;
      try{ const r=await fetch('https://api.moyasar.com/v1/payments',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Basic '+btoa(String(SETTINGS.moyasar_pk)+':')},
        body:JSON.stringify({given_id:init.payment_id, amount:Math.round(init.amount*100), currency:'SAR', description:init.description, callback_url:init.callback_url, metadata:init.metadata,
          source:{type:'creditcard', name:c.name, number:c.number, month:c.month, year:c.year, cvc:c.cvc, save_card:!!c.save}})}); j=await r.json(); }
      catch(e){ if(await pollPaid(init.payment_id,4)){ try{ localStorage.removeItem('khafet_pay_pending'); }catch(_){} try{ await loadOrdersFromCloud(); }catch(_){} showPaidScreen(o); return 'paid'; } return 'fallback'; }   // ما وصلنا ميسر: نتأكد إنها ما اندفعت ثم نكمل بصفحة الدفع
      if(j&&j.status==='initiated'&&j.source&&j.source.transaction_url) url=j.source.transaction_url;
      else if(!(j&&(j.status==='paid'||j.status==='captured'))){ const m=(j&&j.source&&j.source.message)||''; toast(j&&j.errors?LX('تأكد من بيانات البطاقة','Check the card details'):LX('ما انقبلت البطاقة','The card was not accepted')+(m?' · '+m:'')); return 'failed'; }
    }
    if(url){ await openPayUrl(url, init.payment_id, o); return 'opened'; }
    // اندفعت بدون رمز بنك: الخادم يتحقق ويثبّت
    if(await pollPaid(init.payment_id,4)){ try{ localStorage.removeItem('khafet_pay_pending'); }catch(e){} try{ await loadOrdersFromCloud(); }catch(e){} showPaidScreen(o); return 'paid'; }
    return 'failed';
  }catch(e){ console.warn(e); toast(LX('تعذّر الاتصال بالدفع','Payment connection failed')); return 'failed'; }
}
/* دفع طلب موجود بالبطاقة من «طلباتي»: نافذة فيها نفس خانات البطاقة */

/* صفحة الدفع داخل التطبيق: نافذة متصفح فوق التطبيق، ونراقب الدفعة ونسكر النافذة أول ما تندفع. على الويب العادي ننتقل للصفحة كالمعتاد */
let _payWatch=null, _paidJust=null;
function payBrowserPlugin(){ try{ const C=window.Capacitor; if(C&&C.isNativePlatform&&C.isNativePlatform()) return (C.Plugins&&C.Plugins.Browser)||(typeof C.registerPlugin==='function'?C.registerPlugin('Browser'):null); }catch(e){} return null; }
async function openPayUrl(url, payId, o){
  const B=payBrowserPlugin();
  if(!B){ location.href=url; return; }
  try{ await B.open({url:url, presentationStyle:'popover', toolbarColor:'#F1E9DF'}); }catch(e){ location.href=url; return; }
  if(_payWatch) clearInterval(_payWatch); let n=0, lis=null, paidDone=false;
  const stop=()=>{ if(_payWatch){ clearInterval(_payWatch); _payWatch=null; } try{ lis&&lis.remove&&lis.remove(); }catch(e){} };
  _payWatch=setInterval(async()=>{ if(++n>240){ stop(); return; }
    try{ const r=await fetch(PAY_FN+'/status?id='+encodeURIComponent(payId),{headers:{'Authorization':'Bearer '+(await authToken()),'apikey':SUPABASE_ANON}}); const j=await r.json();
      if(j&&j.ok&&j.payment&&j.payment.status==='paid'){ stop(); try{ await B.close(); }catch(e){} try{ localStorage.removeItem('khafet_pay_pending'); }catch(e){} try{ await loadOrdersFromCloud(); }catch(e){} paidDone=true; showPaidScreen(o); } }catch(e){} },3000);
  try{ lis=await B.addListener('browserFinished',async()=>{ stop(); if(paidDone) return; await checkPendingPayment(); if(view==='info') go('mybookings'); }); }catch(e){}
}
/* Apple Pay الأصلي: المبلغ من الخادم، التوكن من شاشة أبل، والخصم في الخادم. يرجع: paid / cancelled / failed / unavailable */
async function nativeApplePay(o){
  const A=applePayPlugin(); if(!A||!APPLEPAY_OK) return 'unavailable';
  const tok=await userToken(); const H={'Content-Type':'application/json','Authorization':'Bearer '+(tok||SUPABASE_ANON),'apikey':SUPABASE_ANON};
  let tk;
  try{ const q=await (await fetch(PAY_FN+'/applepay',{method:'POST',headers:H,body:JSON.stringify({ref_id:o.dbId,quote:true})})).json();
    if(!q||!q.ok||!(q.amount>0)){ apDiag({step:'quote', res:q}); return 'unavailable'; }
    tk=await A.requestPayment({merchantId:APPLEPAY_MERCHANT, amount:Number(q.amount).toFixed(2), label:'خافِت'});
  }catch(e){ const em=String((e&&(e.code||e.message))||e); apDiag({step:'request', err:em, msg:String((e&&e.message)||'')}); return /cancel/i.test(em) ? 'cancelled' : 'unavailable'; }
  if(!tk||!tk.token){ apDiag({step:'request', err:'no_token'}); return 'unavailable'; }
  let ok=false;
  try{ const j=await (await fetch(PAY_FN+'/applepay',{method:'POST',headers:H,body:JSON.stringify({ref_id:o.dbId,token:tk.token})})).json(); ok=!!(j&&j.ok&&j.paid); apDiag({step:'charge', ok:ok, error:j&&j.error, message:j&&j.message}); }catch(e){ apDiag({step:'charge', err:String((e&&e.message)||e)}); }
  try{ await A.completePayment({success:ok}); }catch(e){}
  return ok?'paid':'failed';
}
function showPaidScreen(o){
  if(o && o.id && state.orders.some(x=>x.id===o.id)){ lastOrderId=o.id; _paidJust=o.id; go('confirm'); return; }
  document.getElementById('app').innerHTML=`<div class="wrap screen"><div class="panel" style="margin-top:30px"><div class="payresult"><div class="ic">✅</div><h2>${LX('تم الدفع بنجاح','Payment successful')}</h2><p>${LX('وصلك إيصال على جوالك. تقدر تتابع من «طلباتي».','A receipt was sent to your phone. Track it from "My orders".')}</p></div><button class="cta gold" style="margin-top:14px" onclick="go('mybookings')">${LX('طلباتي','My orders')}</button><button class="cta" style="margin-top:8px" onclick="go('home')">${LX('الرئيسية','Home')}</button></div></div>`;
  window.scrollTo(0,0);
}
/* يفتح صفحة الدفع الآمنة لمبلغ الطلب المتبقي (الخادم يحسب المبلغ) */
async function startOrderPayment(o, method){
  if(!PAY_FN||!o||!o.dbId){ toast(LX('الدفع يحتاج اتصال بالإنترنت','Payment needs an internet connection')); return false; }
  if(method==='card'){
    const r=await payWithCard(o);
    if(r==='paid'||r==='opened') return true;
    if(r!=='fallback') return false;
    method='online';
  }
  if(method==='applepay'){
    const r=await nativeApplePay(o);
    if(r==='paid'){ try{ await loadOrdersFromCloud(); }catch(e){} showPaidScreen(o); return true; }
    if(r==='cancelled') return false;
    if(r==='failed') toast(LX('ما تمت العملية، كمّل الدفع بالبطاقة','Payment did not go through, continue with a card'));
    method='online';   // أي تعذّر: نكمل بصفحة الدفع العادية
  }
  const viaTamara = method==='tamara';
  try{
    const tok=await userToken();
    const r=await fetch(viaTamara?PAY_FN+'/tamara':PAY_FN, { method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(tok||SUPABASE_ANON),'apikey':SUPABASE_ANON},
      body: JSON.stringify({kind:'order', ref_id:o.dbId}) });
    const j=await r.json();
    if(!j.ok||!j.url){
      console.warn('order pay:', j);
      if(j.error==='nothing_due'){ toast(LX('✓ ما عليك مبلغ','✓ Nothing to pay')); loadOrdersFromCloud(); return false; }
      toast(viaTamara?LX('تعذّر فتح تمارا، جرّب الدفع الآن','Could not open Tamara, try Pay now'):LX('تعذّر فتح صفحة الدفع','Could not open the payment page'));
      return false;
    }
    try{ localStorage.setItem('khafet_pay_pending', j.payment_id); }catch(e){}
    await openPayUrl(j.url, j.payment_id, o);
    return true;
  }catch(e){ console.warn(e); toast(LX('تعذّر الاتصال بالدفع','Payment connection failed')); return false; }
}
function payOrder(id, method){ checkApplePay(); const o=state.orders.find(x=>x.id===id); if(o) startOrderPayment(o, method||'online'); }
/* رجوع العميل للتطبيق بعد صفحة الدفع (في الجوال تفتح بالمتصفح) */
let _payPoll=false;
async function checkPendingPayment(){
  let id=null; try{ id=localStorage.getItem('khafet_pay_pending'); }catch(e){}
  if(!id||_payPoll||!PAY_FN) return; _payPoll=true;
  try{
    const r=await fetch(PAY_FN+'/status?id='+encodeURIComponent(id), {headers:{'Authorization':'Bearer '+(await authToken()),'apikey':SUPABASE_ANON}});
    const j=await r.json();
    const st=j&&j.payment&&j.payment.status;
    if(st==='paid'){ try{ localStorage.removeItem('khafet_pay_pending'); }catch(e){} toast(LX('✅ تم الدفع','✅ Payment received')); if(cloudReady) loadOrdersFromCloud(); }
    else if(st&&st!=='pending'){ try{ localStorage.removeItem('khafet_pay_pending'); }catch(e){} }
  }catch(e){} finally{ _payPoll=false; }
}
try{ document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkPendingPayment(); }); window.addEventListener('focus', checkPendingPayment); }catch(e){}

/* توكن الجلسة للدفع (يرجع المفتاح العام لو ما فيه جلسة) */
async function authToken(){
  try{ const s=await sb.auth.getSession(); const t=s&&s.data&&s.data.session&&s.data.session.access_token; if(t) return t; }catch(e){}
  return SUPABASE_ANON;
}
/* إنشاء رابط الدفع وفتحه */
async function startPayment(kind, refId, amount, name, phone, orderNo){
  if(!PAY_FN){ toast(LX('الدفع الإلكتروني غير مفعّل','Online payment is not enabled')); return false; }
  // تمارا لها مسار خاص بنفس الدالة
  const viaTamara = (payMethod==='tamara');
  const url = viaTamara ? PAY_FN+'/tamara' : PAY_FN;
  try{
    const tok = await authToken();   // الخادم يتأكد أن الاشتراك أو الطلب يخصّك
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+tok, 'apikey':SUPABASE_ANON},
      body: JSON.stringify({kind, ref_id:refId, amount, name, phone, order_no:orderNo||null,
        city:(state.address&&state.address.city)||'', address:(state.address&&state.address.details)||''})
    });
    const j = await r.json();
    if(!j.ok || !j.url){
      console.warn('pay:', j);
      toast(viaTamara ? LX('تعذّر فتح صفحة تمارا · جرّب الدفع الإلكتروني','Could not open Tamara · try online payment')
                      : LX('تعذّر فتح صفحة الدفع','Could not open the payment page'));
      return false;
    }
    try{ localStorage.setItem('khafet_pay_pending', j.payment_id); }catch(e){}
    await openPayUrl(j.url, j.payment_id);      // صفحة ميسر / تمارا الآمنة، داخل التطبيق
    return true;
  }catch(e){ console.warn(e); toast(LX('تعذّر الاتصال بالدفع','Payment connection failed')); return false; }
}

/* بعد رجوع العميل من ميسر: ?pay=<id> */
async function checkPaymentReturn(){
  const q = new URLSearchParams(location.search);
  const id = q.get('pay') || (function(){try{return localStorage.getItem('khafet_pay_pending')}catch(e){return null}})();
  if(!q.get('pay')) return false;
  try{ localStorage.removeItem('khafet_pay_pending'); }catch(e){}
  history.replaceState({}, '', location.pathname);

  document.getElementById('app').innerHTML = `<div class="wrap screen"><div class="panel" style="margin-top:30px">
    <div class="payresult"><div class="ic">⏳</div><h2>${LX('نتحقق من الدفع…','Verifying payment…')}</h2></div></div></div>`;

  let paid=false, src='';
  for(let i=0;i<6 && !paid;i++){
    try{
      const r = await fetch(PAY_FN+'/status?id='+encodeURIComponent(id), {headers:{'Authorization':'Bearer '+(await authToken()),'apikey':SUPABASE_ANON}});
      const j = await r.json();
      if(j.ok && j.payment && j.payment.status==='paid'){ paid=true; src=j.payment.moyasar_src||''; break; }
    }catch(e){}
    await new Promise(r=>setTimeout(r, 1500));
  }

  document.getElementById('app').innerHTML = paid
    ? `<div class="wrap screen"><div class="panel" style="margin-top:30px">
        <div class="payresult"><div class="ic">✅</div>
        <h2>${LX('تم الدفع بنجاح','Payment successful')}</h2>
        <p>${LX('وصلك إيصال على جوالك. تقدر تتابع من «طلباتي».','A receipt was sent to your phone. Track it from "My orders".')}</p></div>
        <button class="cta gold" style="margin-top:14px" onclick="go('mybookings')">${LX('طلباتي','My orders')}</button>
        <button class="cta" style="margin-top:8px" onclick="go('home')">${LX('الرئيسية','Home')}</button>
      </div></div>`
    : `<div class="wrap screen"><div class="panel" style="margin-top:30px">
        <div class="payresult"><div class="ic">⚠️</div>
        <h2>${LX('ما وصلنا تأكيد الدفع','Payment not confirmed')}</h2>
        <p>${LX('لو خُصم المبلغ فسيتأكد خلال دقائق وبنتواصل معك. ولا تعيد الدفع.','If you were charged it will confirm shortly and we will contact you. Do not pay again.')}</p></div>
        <button class="cta" style="margin-top:14px" onclick="go('home')">${LX('الرئيسية','Home')}</button>
      </div></div>`;
  return true;
}

const TERMS_VERSION = '2.0';
const TERMS_SEC = [{"n":"1","t":"التعريفات","i":["<b>«المزوّد»</b>: مؤسسة خافت للسباكة والكهرباء، سجل تجاري رقم <b>2052105014</b>، الرقم الموحد 7042751284.","<b>«المشترك»</b>: الشخص أو الجهة المسجّلة باسمها العقد والمذكور رقم جوالها عند الاشتراك.","<b>«العقار المشمول»</b>: وحدة سكنية <b>واحدة</b> فقط، بالعنوان المسجّل وقت الاشتراك.","<b>«الباقة»</b>: إحدى باقتي «ريّح بالك» المعلنتين في التطبيق: <b>باقة الشقة</b> (6 زيارات صيانة إضافية بالسنة) أو <b>باقة البيت</b> (8 زيارات صيانة إضافية بالسنة)، وما تتضمنه كل منهما من خدمات دورية بالحدود الواردة في البند الثالث.","<b>«الخدمات المشمولة»</b>: قائمة الـ64 خدمة المنشورة في التطبيق وقت الاشتراك، وهي جزء لا يتجزأ من هذا العقد.","<b>«الزيارة»</b>: حضور الفني إلى العقار المشمول بناءً على طلب واحد لتنفيذ عمل أو أكثر من الخدمات المشمولة، وتُخصم من رصيد الباقة.","<b>«الخدمات الدورية»</b>: الخدمات التي تُنفَّذ مرة واحدة في سنة العقد بحسب الباقة (تنظيف المكيفات، تنظيف مراوح الشفط، فحص أمان المنزل، صيانة السخان، ترويبة الصفاية)، ولا تُخصم من رصيد الزيارات.","<b>«أجرة اليد»</b>: قيمة عمل الفني فقط، دون قطع الغيار أو المواد."]},{"n":"2","t":"مدة العقد وقيمته وسريانه","i":["يبدأ سريان العقد من <b>تاريخ سداد قيمته كاملة</b>، ولمدة <b>سنة ميلادية واحدة</b>.","لا يبدأ السريان بمجرد تقديم الطلب أو الحجز، بل بالسداد فقط.","قيمة الاشتراك هي السعر المعلن في التطبيق للباقة المختارة وقت السداد، <b>شاملاً ضريبة القيمة المضافة</b>؛ وأي خصم ترويجي («خصم الآن») يسري على الاشتراكات المسدَّدة خلال فترة سريان العرض فقط، ولا يمتد تلقائياً إلى التجديد أو إلى اشتراكات لاحقة.","لا يُجدَّد العقد تلقائياً؛ يُرسل للمشترك إشعار قبل انتهائه بـ30 يوماً لتجديده باختياره وبالسعر المعلن وقت التجديد.","الزيارات والخدمات الدورية غير المستخدمة خلال سنة العقد <b>لا تُرحَّل</b> إلى سنة لاحقة، <b>ولا تُسترد</b> قيمتها ولا تُستبدل بمبالغ نقدية أو خدمات أخرى، باستثناء خصم تجديد السخان الوارد في البند الثامن."]},{"n":"3","t":"نطاق التغطية","i":["يغطي العقد <b>أجرة اليد فقط</b> لزيارات الصيانة الإضافية (سباكة · كهرباء · تركيبات) للأعمال البسيطة الواردة في قائمة الخدمات المشمولة، إضافةً إلى الخدمات الدورية المحددة في الباقة.","الأعمال المشمولة هي أعمال إصلاح وتركيب بسيطة لا تتطلب تكسيراً أو تمديدات جديدة أو معدات ثقيلة.","رصيد زيارات الصيانة الإضافية: <b>باقة الشقة 6 زيارات</b> بالسنة، و<b>باقة البيت 8 زيارات</b> بالسنة؛ تُطلب عند الحاجة عبر التطبيق، وتُخصم كل زيارة من الرصيد، ولا تُحتسب الخدمات الدورية منه.","الخدمات الدورية تُنفَّذ <b>مرة واحدة</b> في سنة العقد بمواعيد يُتفق عليها مسبقاً، وهي: تنظيف المكيفات (الوحدة الداخلية والخارجية)، تنظيف مراوح الشفط لدورات المياه، فحص أمان المنزل (اللوحة والتأريض والحماية والأفياش)، الصيانة الوقائية للسخان، وترويبة الصفاية (<b>باقة الشقة فقط</b>).","<b>الحدود القصوى للخدمات الدورية</b> في المرة الواحدة: تنظيف المكيفات حتى <b>8 مكيفات</b> في باقة الشقة و<b>12 مكيفاً</b> في باقة البيت؛ مراوح الشفط حتى <b>5 مراوح</b> في باقة الشقة و<b>6 مراوح</b> في باقة البيت؛ ترويبة صفاية <b>واحدة</b> في باقة الشقة <b>بالمواد القياسية من المزوّد</b>؛ صيانة السخان <b>لسخان واحد</b>. وما زاد على هذه الحدود أو طُلب بمواد خاصة يُحتسب بأجرة منفصلة وفق قائمة الأسعار المعتمدة.","يقتصر تنظيف المكيفات على <b>مكيفات السبليت فقط</b> سهلة الوصول؛ ولا يشمل المكيفات الشباك أو المركزية أو الوحدات التي يتطلب الوصول إليها رافعات أو سقالات أو فك تمديدات.","بعد استنفاد رصيد الزيارات أو الخدمات الدورية، تُقدَّم أي خدمة إضافية للمشترك بأجرة مستقلة وفق قائمة الأسعار المعتمدة وقت الطلب."]},{"n":"4","t":"الاستثناءات · ما لا يشمله العقد","i":["<b>قطع الغيار والمواد بجميع أنواعها</b> · تُحتسب على المشترك وفق البند الثامن، عدا ما نُصّ صراحةً على شموله (مواد ترويبة الصفاية القياسية في باقة الشقة).","أي عمل يتطلب <b>تكسيراً أو ترميماً أو تمديدات جديدة</b> أو تغيير مسارات المواسير والأسلاك.","الأعمال الإنشائية، العزل، الأسطح، الخزانات الأرضية، وشبكات الصرف الرئيسية خارج حدود العقار.","صيانة أو إصلاح <b>المكيفات</b> (العقد يشمل التنظيف فقط)، والسخان فيما يتجاوز الصيانة الوقائية السنوية لسخان واحد.","<b>كل ما لم يرد صراحةً</b> في قائمة الخدمات المشمولة من أجهزة أو أنظمة أو أعمال.","الأعطال الناتجة عن: سوء الاستخدام، الإهمال، العبث، أعمال طرف آخر غير المزوّد، ارتفاع الجهد، انقطاع أو رداءة الخدمات العامة.","الأضرار الناتجة عن <b>القوة القاهرة</b>: الأمطار والسيول والحرائق والزلازل والحوادث والقرارات الحكومية.","الأعطال <b>القائمة قبل بدء العقد</b> أو الناتجة عن عيوب إنشائية بالعقار.","الاستخدام <b>التجاري</b> للعقار أو تأجيره المفروش قصير المدى، ما لم يُتفق على ذلك كتابةً."]},{"n":"5","t":"الاستخدام العادل للزيارات (مهم)","i":["رصيد الزيارات في كل باقة <b>محدد العدد</b> (6 للشقة · 8 للفيلا) ومخصص للأعطال <b>الطبيعية</b> للعقار المشمول، ولا يجوز استخدامه لأعمال غير مشمولة أو لعقار آخر.","الزيارة الواحدة تقابل <b>طلباً واحداً</b>؛ وتُجمع الطلبات المتعددة في العقار الواحد بزيارة واحدة كلما أمكن فنياً، وتُخصم زيارة واحدة فقط.","إذا تعذّر إتمام العمل في الزيارة لسبب يعود إلى المزوّد (كعدم توفر قطعة لديه)، فلا تُحتسب زيارة العودة لإكمال العمل من الرصيد.","يحق للمزوّد الاعتراض كتابةً على الاستخدام المخالف لطبيعة العقد أو المتكرر بشكل غير طبيعي، ومنح المشترك مهلة 15 يوماً لتصحيح الاستخدام قبل إيقاف الخدمة.","العقد <b>شخصي</b> ويقتصر على العقار المسجّل؛ ولا يجوز استخدامه لعقار آخر أو لطرف ثالث."]},{"n":"6","t":"المواعيد والاستجابة","i":["الحجز يتم عبر تطبيق خافِت. تُبذل العناية لتقديم الخدمة خلال المدة المعلنة في الباقة.","المواعيد المعلنة <b>أهداف خدمة</b> يلتزم المزوّد ببذل عناية معقولة لتحقيقها، وليست ضماناً مطلقاً، ولا يترتب على تجاوزها تعويض.","يُعذر التأخير الناتج عن الظروف الجوية، ازدحام الطلبات، تعذّر الوصول، أو أي سبب خارج إرادة المزوّد.","إلغاء الموعد أو تعذّر الدخول بعد وصول الفني دون إشعار قبل 3 ساعات يُحتسب <b>زيارة مستهلكة</b> من رصيد الباقة."]},{"n":"7","t":"التزامات المشترك","i":["تمكين الفني من الوصول الآمن للموقع، ووجود شخص بالغ طوال مدة العمل.","توفير الكهرباء والماء وإخلاء محيط العمل من الأثاث والمقتنيات الثمينة.","الإفصاح عن أي عطل سابق أو إصلاح سابق يخص موضوع الطلب.","سداد قيمة قطع الغيار عند التركيب.","معاملة الفنيين باحترام؛ وأي إساءة لفظية أو جسدية تُنهي العقد فوراً دون استرداد."]},{"n":"8","t":"توريد قطع الغيار · حصري للمزوّد","i":["يلتزم المزوّد بتوفير جميع قطع الغيار والمواد اللازمة لتنفيذ الأعمال المشمولة، وهو <b>الجهة الوحيدة المخوّلة</b> بتوريدها وتركيبها ضمن هذا العقد.","توريد القطع من المزوّد <b>شرط أساسي</b> لسريان العقد وضماناته، وقد رُوعي ذلك عند تحديد قيمة الاشتراك.","تُحتسب قيمة القطع على المشترك وفق <b>قائمة أسعار المزوّد المعتمدة</b> السارية وقت التنفيذ، وتُدرج في فاتورة مستقلة.","<b>لا يجوز</b> للمشترك توريد قطع من خارج المزوّد، ولا مطالبة الفني بتركيب قطع لم يوردها المزوّد.","إذا أصرّ المشترك على تركيب قطعة من خارج المزوّد: يُنفَّذ العمل على <b>مسؤوليته الكاملة</b>، ويسقط الضمان عن العمل والقطعة معاً، وتُحتسب أجرة يد كاملة خارج نطاق العقد.","تشمل باقتا «ريّح بالك» <b>الصيانة الوقائية لسخان واحد مرة بالسنة</b> (أجرة اليد فقط، دون قطع الغيار التي تُحتسب وفق قائمة الأسعار)؛ وإذا لم يستخدم المشترك خدمة صيانة السخان خلال سنة العقد كاملة، يحصل عند التجديد على خصم قدره <b>250 ريالاً</b> من قيمة اشتراك السنة التالية.","ضمان القطع الموردة من المزوّد: <b>سنتان</b> ضد عيوب الصناعة فقط، ولا يشمل الكسر أو سوء الاستخدام أو التآكل الطبيعي.","جميع الأسعار المعلنة · قيمة الباقات وقطع الغيار وأجور الزيارات الفردية · <b>شاملة ضريبة القيمة المضافة</b>.","<b>توصيل</b> قطع الغيار والأغراض التي يوردها المزوّد إلى العقار المشمول <b>مجاني</b> للمشترك ضمن نطاق التغطية الجغرافي."]},{"n":"9","t":"ضمان الإصلاح · 30 يوماً","i":["يضمن المزوّد أعمال اليد (الإصلاح) لمدة <b>30 يوماً</b> من تاريخ التنفيذ، وضمن مدة سريان العقد؛ ويُعاد تنفيذ العمل المشمول بالضمان دون مقابل ودون خصم زيارة من الرصيد.","ضمان قطع الغيار الموردة من المزوّد <b>سنتان</b> وفق البند الثامن، وهو مستقل عن ضمان الإصلاح.","يسقط الضمان إذا: عبث بالإصلاح طرف آخر · تغيّرت ظروف التشغيل · نتج العطل عن سبب مختلف · استُخدمت قطعة من خارج المزوّد.","الضمان يقتصر على <b>إعادة التنفيذ</b> دون مقابل، ولا يشمل تعويضاً نقدياً."]},{"n":"10","t":"حدود المسؤولية","i":["مسؤولية المزوّد تقتصر على الأضرار <b>المباشرة</b> الناتجة عن خطأ جسيم مثبت من فنييه.","<b>الحد الأقصى للتعويض في جميع الأحوال = قيمة العقد المدفوعة</b>، مهما تعددت الحوادث خلال السنة.","لا يتحمّل المزوّد أي مسؤولية عن: الأضرار غير المباشرة أو التبعية، فوات المنفعة، فقد الأرباح، تلف المقتنيات غير المعلن عنها، أو الأعطال المترتبة على عيوب سابقة بالعقار.","لا يتحمّل المزوّد مسؤولية أي عمل نفّذه طرف آخر بناءً على توصيته أو ترشيحه."]},{"n":"11","t":"الإلغاء والاسترداد","i":["يحق للمشترك الإلغاء خلال <b>7 أيام</b> من السداد وقبل تنفيذ أي زيارة، ويُسترد المبلغ كاملاً بعد خصم رسوم التحويل البنكي.","بعد تنفيذ أول زيارة: يُحتسب المستحق على أساس <b>قيمة الخدمات المنفّذة بأسعار الأفراد المعلنة</b> ويُسترد الفارق إن وُجد، ولا يُسترد شيء إذا تجاوزت قيمتها قيمة العقد.","لا استرداد بعد مضي 30 يوماً من بدء العقد.","يحق للمزوّد إنهاء العقد فوراً ودون استرداد في حال: التلاعب أو تقديم بيانات غير صحيحة، استخدام العقد لعقار غير مسجّل، الإساءة للفنيين، أو مخالفة بند الاستخدام العادل بعد الإنذار."]},{"n":"12","t":"نقل العقد","i":["يجوز نقل العقد للمستأجر الجديد <b>لنفس العقار</b> دون رسوم، بإشعار المزوّد وتحديث بيانات التواصل؛ ويستمر العقد للمدة المتبقية وبالرصيد المتبقي من الزيارات والخدمات الدورية.","لا يجوز نقل العقد <b>لعقار آخر</b> إلا بموافقة المزوّد الكتابية وضمن نطاق التغطية الجغرافي.","نطاق التغطية: <b>الخبر · الظهران · الدمام</b> · وأي موقع خارجه قد يستوجب رسوم انتقال إضافية أو رفض الطلب."]},{"n":"13","t":"البيانات والخصوصية","i":["يوافق المشترك على معالجة بياناته (الاسم، الجوال، العنوان، سجل الطلبات) لأغراض تنفيذ العقد وفق نظام حماية البيانات الشخصية بالمملكة.","قد يُصوَّر موقع العمل قبل وبعد التنفيذ لأغراض التوثيق والضمان فقط."]},{"n":"14","t":"تعديل الشروط","i":["يحق للمزوّد تعديل هذه الشروط للعقود <b>الجديدة</b> في أي وقت.","العقود السارية تبقى خاضعة للشروط المتفق عليها وقت الاشتراك حتى انتهاء مدتها."]},{"n":"15","t":"الأنظمة والاختصاص","i":["يخضع هذا العقد لأنظمة المملكة العربية السعودية.","يُسعى لتسوية أي خلاف ودياً خلال 30 يوماً، وإلا فالاختصاص <b>للمحاكم المختصة بالمنطقة الشرقية</b>.","النسخة العربية من هذه الشروط هي المعتمدة عند أي اختلاف في الترجمة."]}];
let termsOK = false;

function termsHtml(){
  return TERMS_SEC.map(s=>`<div class="tsec"><h4><i>${s.n}</i>${esc(s.t)}</h4>
    <ol>${s.i.map(x=>'<li>'+x+'</li>').join('')}</ol></div>`).join('');
}
function openTerms(){
  let m=document.getElementById('termsModal');
  if(!m){
    m=document.createElement('div');
    m.id='termsModal'; m.className='tmodal';
    m.innerHTML=`<div class="tsheet">
      <div class="thead"><h3>📜 ${LX('شروط وأحكام العقد السنوي','Annual Contract Terms')}</h3>
        <button onclick="closeTerms()" aria-label="إغلاق">×</button></div>
      <div class="tbody">${termsHtml()}</div>
      <div class="tfoot"><button onclick="acceptTerms()">${LX('قرأت ووافقت','I have read and agree')}</button></div>
    </div>`;
    m.addEventListener('click', e=>{ if(e.target===m) closeTerms(); });
    document.body.appendChild(m);
  }
  m.classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTerms(){
  const m=document.getElementById('termsModal');
  if(m) m.classList.remove('on');
  document.body.style.overflow='';
}
function acceptTerms(){
  termsOK = true;
  const c=document.getElementById('agreeChk'); if(c) c.checked=true;
  syncAgree();
  closeTerms();
}
function toggleAgree(ev){
  /* الضغط على الرابط يفتح الشروط ولا يغيّر الصح */
  if(ev && ev.target && ev.target.tagName==='A') return;
  const c=document.getElementById('agreeChk');
  if(!c) return;
  if(ev && ev.target!==c) c.checked=!c.checked;
  termsOK=c.checked;
  syncAgree();
}
function syncAgree(){
  const w=document.getElementById('agreeBox'), b=document.getElementById('payCta');
  if(w) w.classList.toggle('on', termsOK);
  if(b){ b.disabled=!termsOK; b.style.opacity=termsOK?'1':'.55'; }
}
function agreeBox(){
  return `<div class="agree" id="agreeBox" onclick="toggleAgree(event)">
    <input type="checkbox" id="agreeChk" onclick="event.stopPropagation();toggleAgree()">
    <div class="t">${LX('أوافق على','I agree to the')} <a onclick="event.stopPropagation();openTerms()">${LX('شروط وأحكام العقد السنوي','annual contract terms')}</a>
    ${LX('وأقرّ بأني اطّلعت عليها.','and confirm I have read them.')}</div>
  </div>`;
}

           elec:true, ac:false, floor:true, paint:false, key:false };

function mjCalc(){
  const area = MJ.L * MJ.W;                                  // مساحة الأرضية
  const perim = 2 * (MJ.L + MJ.W);
  const openings = MJ.doors*2.0 + MJ.windows*1.5;            // م² الفتحات
  const walls = Math.max(0, perim * MJ.H - openings);
  const roof = area;
  const rate = MJ_RATE.panel[MJ.th] || MJ_RATE.panel[7.5];
  const panelCost = (walls + roof) * rate;
  const doorCost  = MJ.doors * (MJ_RATE.door[MJ.doorType] || MJ_RATE.door.steel);
  const winCost   = MJ.windows * MJ_RATE.window;
  const elecCost  = MJ.elec  ? MJ_RATE.elec : 0;
  const acCost    = MJ.ac    ? MJ_RATE.ac   : 0;
  const floorCost = MJ.floor ? area * MJ_RATE.floor : 0;
  const paintCost = MJ.paint ? (walls+roof) * MJ_RATE.paint : 0;
  const sub = panelCost + doorCost + winCost + elecCost + acCost + floorCost + paintCost;
  const total = Math.max(MJ_RATE.minPrice, Math.round(sub/50)*50);
  const days = Math.max(2, Math.ceil(area/12) + (MJ.elec?1:0) + (MJ.ac?1:0));
  return {area,walls,roof,panelCost,doorCost,winCost,elecCost,acCost,floorCost,paintCost,total,days};
}

let joinCtx=null;
function normJoinPhone(v){ let d=String(v||'').replace(/[^0-9]/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('0')) d='966'+d.slice(1); if(!d.startsWith('966')) d='966'+d; return '+'+d; }
async function submitProvider(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const name=g('pv_name'), phone=g('pv_phone'), pass=g('pv_pass');
  const cities=g('pv_cities').split(/[،,\n]+/).map(s=>s.trim()).filter(Boolean);
  const services=Array.from(document.querySelectorAll('.chips-pick input:checked')).map(c=>c.value);
  if(!name){ toast('اكتب الاسم'); return; }
  if(!phone){ toast('اكتب رقم الجوال'); return; }
  if(pass.length<6){ toast('كلمة المرور ٦ أحرف على الأقل'); return; }
  if(!cities.length){ toast('اكتب مدن الخدمة'); return; }
  if(!services.length){ toast('اختر نوع الخدمات'); return; }
  if(!cloudReady){ toast('لا يوجد اتصال، حاول بعد قليل'); return; }
  const e164=normJoinPhone(phone);
  joinCtx={ name, phone, pass, cities, services, note:g('pv_note'), e164, mode:'signup' };
  state.provider={ name, phone, cities, services, note:joinCtx.note }; save();
  const btn=document.querySelector('.cta'); if(btn){ btn.disabled=true; btn.textContent='⏳ نرسل رمز التحقق...'; }
  try{
    /* ينشئ حساب دخول (جوال + كلمة مرور) · Supabase يرسل رمز تحقق SMS تلقائياً */
    const { data, error }=await sb.auth.signUp({ phone:e164, password:pass });
    if(error){
      if(/already|registered|exists/i.test(error.message||'')){
        joinCtx.mode='existing';                       /* رقم له حساب (عميل سابق مثلاً) · نتحقق ثم نضبط كلمة المرور */
        const r2=await sb.auth.signInWithOtp({ phone:e164 });
        if(r2.error) throw r2.error;
      } else throw error;
    } else if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      /* رقم له حساب مسبقاً: signUp يرجّع «نجاحاً وهمياً» بلا رسالة · نرسل رمز دخول فعلياً */
      joinCtx.mode='existing';
      const r2=await sb.auth.signInWithOtp({ phone:e164 });
      if(r2.error) throw r2.error;
    }
    renderJoinOtp('');
  }catch(e2){
    toast('تعذّر إرسال الرمز، تأكد من الرقم وحاول ثانية');
    if(btn){ btn.disabled=false; btn.textContent='✅ سجّل وفعّل حسابك'; }
  }
}
function renderJoinOtp(msg){
  document.getElementById('app').innerHTML=`
    <div class="wrap screen">
      ${pageHead('تأكيد الجوال','join')}
      <div class="panel" style="margin-top:20px;text-align:center">
        <div style="font-size:2.4rem">📲</div>
        <h3 style="margin-top:8px">أدخل رمز التحقق</h3>
        <p style="color:var(--muted);font-size:.9rem;margin-top:6px">أرسلنا رمزاً إلى ${esc(joinCtx.e164)}</p>
        <div class="field" style="margin-top:14px"><input id="jn_otp" inputmode="numeric" autocomplete="one-time-code" placeholder="••••" style="text-align:center;letter-spacing:8px;font-size:1.4rem" onkeydown="if(event.key==='Enter')verifyJoinOtp()" /></div>
        <button class="cta" onclick="verifyJoinOtp()">تأكيد وتفعيل ✅</button>
        ${msg?`<div style="color:#c0392b;font-weight:700;margin-top:10px">${msg}</div>`:''}
      </div>
      <div style="height:26px"></div>
    </div>`;
}
async function verifyJoinOtp(){
  const code=((document.getElementById('jn_otp')||{}).value||'').trim();
  if(code.length<4){ renderJoinOtp('اكتب الرمز كاملاً'); return; }
  const btn=document.querySelector('.cta'); if(btn){ btn.disabled=true; btn.textContent='⏳ نتحقق...'; }
  try{
    const { error }=await sb.auth.verifyOtp({ phone:joinCtx.e164, token:code, type:'sms' });
    if(error){ renderJoinOtp('❌ الرمز غير صحيح، حاول ثانية'); return; }
    if(joinCtx.mode==='existing'){ try{ await sb.auth.updateUser({ password:joinCtx.pass }); }catch(e){} }
    /* أنشئ ملف المزوّد · الخادم وحده يقرر الحالة: الملف المكتمل يُعتمد فوراً */
    let already=false;
    const r=await sb.from('khafet_providers').insert({ name:joinCtx.name, phone:joinCtx.phone, city:joinCtx.cities[0]||'', cities:joinCtx.cities, services:joinCtx.services, note:joinCtx.note });
    if(r.error){ if((r.error.code||'')==='23505'||/duplicate/i.test(r.error.message||'')) already=true; else throw r.error; }
    try{ await sb.auth.signOut(); }catch(e){}
    try{ await ensureAnonSession(); }catch(e){}
    document.getElementById('app').innerHTML=`
      <div class="wrap screen">
        <div class="panel" style="margin-top:30px">
          <div class="success">
            <div class="circle">🎉</div>
            <h2>${already?'رقمك مسجّل مزوّداً من قبل':'تم تفعيل حسابك فوراً!'}</h2>
            <p style="color:var(--muted);margin-top:10px;line-height:1.9">${already?'ادخل بوابة المزوّدين بجوالك وكلمة مرورك مباشرة.':'حسابك جاهز، افتح بوابة المزوّدين وادخل بجوالك وكلمة المرور وابدأ استقبال طلبات مدنك.'}</p>
          </div>
          <a class="cta" style="margin-top:16px;display:block;text-align:center;text-decoration:none" href="https://fadiaalzhrani-debug.github.io/khaft-partners/www/provider.html" target="_blank" rel="noopener">🤝 افتح بوابة المزوّدين</a>
          <button class="cta gold" style="margin-top:10px" onclick="go('home')">العودة للرئيسية</button>
        </div>
      </div>`;
  }catch(e){ renderJoinOtp('تعذّر الإكمال، حاول مرة ثانية'); }
}
