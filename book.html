<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6ec">
<title>احجز زيارتك | خافت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* حجز سريع من رابط الواتساب (فادية 2026-11-13): الأيام عمود يمين، الأوقات عمود يسار بعد اختيار اليوم، زرّا الموقع جنب بعض، وزر التأكيد ثابت تحت.
   الخدمة «زيارة فني» (g3) والسعر بعد المعاينة، فما فيه دفع. نفس واجهة wa.html: /wa-bot/w/init و slots و geo و book برمز ?t= الموقّع لرقم العميل */
:root{--bg:#faf6ec;--card:#fff;--ink:#1d1a14;--mute:#776f60;--line:#e9e1cf;--gold:#f5c518;--gold-ink:#2a2100;--gold-soft:#fdf3cc;--off:#cfc6b3;--green:#16a34a;--ok:#15803d;--bad:#b42318;
  --display:"Cairo",system-ui,sans-serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;line-height:1.3}
.sub{color:var(--mute);margin:2px 0 0;font-size:.95rem}
.lbl{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row:empty{display:none}
.hint{color:var(--mute);font-size:.9rem;text-align:center;margin:auto 0}
.chip{flex:0 0 auto;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:.12s}
.chip:focus-visible,.lbtn:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.day{width:78px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.day b{font-family:var(--display);font-size:.95rem}
.day small{color:var(--mute);font-size:.8rem}
.time{padding:12px 14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.on small{color:#fff}

.loc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbtn{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.lbtn .ic{font-size:1.5rem;line-height:1}
.lbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.picked{font-size:.92rem;margin:8px 0 0;min-height:1.4em}
.picked.ok{color:var(--ok)} .picked.bad{color:var(--bad)}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.sum{font-size:.88rem;color:var(--mute);text-align:center;min-height:1.3em}
.go{font:inherit;font-family:var(--display);font-weight:800;font-size:1.1rem;width:100%;border:0;border-radius:14px;padding:14px;background:var(--gold);color:var(--gold-ink);cursor:pointer}
.go:disabled{background:var(--line);color:var(--mute);cursor:default}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:8px}
.msg .big{font-size:2.6rem;line-height:1}
.msg h2{font-family:var(--display);margin:0;font-size:1.3rem}
.msg p{margin:0;color:var(--mute)}
.msg a{color:var(--ink);font-weight:600}
.load{color:var(--mute);text-align:center;padding:40px 0}
.mapwrap{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.maphead{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.maphead b{font-family:var(--display)}
.x{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
#map{flex:1;position:relative}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:2.4rem;z-index:500;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.mapfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mapfoot p{margin:0;text-align:center;color:var(--mute);font-size:.92rem;min-height:1.4em}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="form" hidden>
  <header>
    <h1>احجز زيارتك</h1>
  </header>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="row" id="days" role="listbox" aria-label="اليوم"></div>
    <div class="row" id="times" role="listbox" aria-label="الوقت"></div>
  </section>
  <section>
    <div class="loc">
      <button class="lbtn" id="here" type="button"><span class="ic">📍</span>أرسل موقعي الحالي</button>
      <button class="lbtn" id="pickmap" type="button"><span class="ic">🗺️</span>اختر من الخريطة</button>
    </div>
    <p class="picked" id="picked"></p>
  </section>
</div>

<div class="wrap" id="loading" hidden></div>

<div class="wrap" id="end" hidden>
  <div class="msg"><div class="big" id="endIc">✅</div><h2 id="endT"></h2><p id="endS"></p></div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <button class="go" id="go" disabled>أكد الحجز</button>
</div></div>

<div class="mapwrap" id="mapwrap" hidden>
  <div class="maphead"><b>حرّك الخريطة على بيتك</b><button class="x" id="mapx" type="button">رجوع</button></div>
  <div id="map"><div class="pin">📍</div></div>
  <div class="mapfoot"><p id="mapp"></p><button class="go" id="mapok" type="button">اعتمد هذا الموقع</button></div>
</div>

<script>
(function () {
  "use strict";
  var API = "https://zulogtqxbuqxmdmjpzqj.supabase.co/functions/v1/wa-bot/w/";
  var T = new URLSearchParams(location.search).get("t") || "";
  var ITEMS = [{ id: "g3", qty: 1 }];   // «طلب مخصّص»: زيارة فني والسعر بعد المعاينة، مثل حجز رسائل الواتساب
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ERR = {
    KHAFET_BAD_TIME: "الوقت هذا انحجز قبل شوي، اختر وقت ثاني",
    KHAFET_OFF_DAY: "اليوم هذا إجازة، اختر يوم ثاني",
    KHAFET_COVERAGE: "الموقع خارج المناطق اللي نخدمها حاليًا",
    KHAFET_NO_LOCATION: "حدد موقع البيت",
    KHAFET_TOO_MANY_OPEN: "عندك طلبات مفتوحة كثير، تقدر تتابعها من تطبيق خافت",
    KHAFET_BLOCKED: "ما نقدر نكمل الحجز، تواصل معنا على الواتساب",
    NET: "النت ضعيف، جرّب مرة ثانية"
  };
  var D = null, DAYS = [], st = { day: null, time: null }, loc = { lat: null, lng: null, city: "", district: "", ok: false, how: "" };
  var map = null, busy = false;

  function api(op, body) {
    return fetch(API + op, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ t: T }, body || {})) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (r.status === 401) { end("⏰", "انتهت صلاحية الرابط", "اكتب لنا في الواتساب ونرسل لك رابط جديد"); throw new Error("expired"); } j.__s = r.status; return j; }); },
            function () { throw new Error("NET"); });
  }
  function end(ic, t, s) {
    ["form", "loading", "bar", "mapwrap"].forEach(function (id) { $(id).hidden = true; });
    $("endIc").textContent = ic; $("endT").textContent = t; $("endS").textContent = s; $("end").hidden = false;
  }

  // ───── الأيام والأوقات ─────
  var AR_D = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  var AR_M = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  // اسم اليوم وتاريخه من التاريخ نفسه (بتوقيت الرياض): اليوم، بكرة، ثم اسم اليوم
  function dayParts(iso) {
    var p = iso.split("-").map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    var today = new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10);
    var diff = Math.round((dt - new Date(today + "T00:00:00Z")) / 86400000);
    return { name: diff === 0 ? "اليوم" : diff === 1 ? "بكرة" : AR_D[dt.getUTCDay()], date: p[2] + " " + AR_M[p[1] - 1] };
  }
  function shortDay(x) { var q = dayParts(x.d); return q.name + " " + q.date; }
  function renderDays() {
    $("days").innerHTML = DAYS.map(function (x, i) {
      var q = dayParts(x.d), name = q.name, date = q.date;
      return '<button class="chip day' + (st.day === i ? " on" : "") + '" role="option" aria-selected="' + (st.day === i) + '" data-i="' + i + '"><b>' + esc(name) + "</b>" + (date ? "<small>" + esc(date) + "</small>" : "") + "</button>";
    }).join("") || '<p class="hint">ما فيه مواعيد متاحة حاليًا</p>';
    [].forEach.call($("days").querySelectorAll("button"), function (b) { b.onclick = function () { st.day = +b.dataset.i; st.time = null; renderDays(); renderTimes(); sync(); }; });
  }
  function renderTimes() {
    if (st.day === null) { $("times").innerHTML = ""; return; }
    $("times").innerHTML = DAYS[st.day].times.map(function (t, i) {
      return '<button class="chip time' + (st.time === i ? " on" : "") + '" role="option" aria-selected="' + (st.time === i) + '" data-i="' + i + '">' + esc(t.label) + "</button>";
    }).join("");
    [].forEach.call($("times").querySelectorAll("button"), function (b) { b.onclick = function () { st.time = +b.dataset.i; renderTimes(); sync(); }; });
  }

  // ───── الموقع ─────
  function showPicked(txt, ok) { $("picked").textContent = txt; $("picked").className = "picked " + (ok ? "ok" : "bad"); }
  function resolve(lat, lng, how) {
    loc.lat = +lat.toFixed(6); loc.lng = +lng.toFixed(6); loc.how = how; loc.ok = false;
    $("here").classList.toggle("on", how === "here"); $("pickmap").classList.toggle("on", how === "map");
    showPicked("نجيب العنوان…", true); sync();
    return api("geo", { lat: loc.lat, lng: loc.lng }).then(function (g) {
      loc.city = g.city || ""; loc.district = g.district || "";
      if (g.out) showPicked("الموقع خارج المملكة", false);
      else if (!loc.city) showPicked(g.raw ? "موقعك في " + g.raw + "، وحاليًا نخدم " + ((D && D.cover) || []).join(" و") + " فقط" : "ما عرفنا المدينة، اختر الموقع من الخريطة", false);
      else { loc.ok = true; showPicked("✓ " + loc.city + (loc.district ? " · " + loc.district : ""), true); }
      sync(); return g;
    }).catch(function (e) { if (e.message !== "expired") showPicked(ERR.NET, false); sync(); });
  }
  $("here").onclick = function () {
    if (!navigator.geolocation) { showPicked("جوالك ما يدعم تحديد الموقع، اختر من الخريطة", false); return; }
    showPicked("نحدد موقعك…", true);
    navigator.geolocation.getCurrentPosition(function (p) { resolve(p.coords.latitude, p.coords.longitude, "here"); },
      function () { showPicked("ما قدرنا نوصل لموقعك، فعّل الموقع أو اختر من الخريطة", false); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  function loadLeaflet(cb) {
    if (window.L) return cb();
    var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = cb; s.onerror = function () { $("mapp").textContent = ERR.NET; }; document.head.appendChild(s);
  }
  $("pickmap").onclick = function () {
    $("mapwrap").hidden = false; $("mapp").textContent = "";
    loadLeaflet(function () {
      var c = loc.lat ? [loc.lat, loc.lng] : (D && D.last ? [D.last.lat, D.last.lng] : [26.2794, 50.2083]);
      if (!map) {
        map = L.map("map", { zoomControl: false }).setView(c, loc.lat || (D && D.last) ? 17 : 12);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
        map.attributionControl.setPrefix(false);
      } else { map.setView(c); }
      setTimeout(function () { map.invalidateSize(); }, 60);
    });
  };
  $("mapx").onclick = function () { $("mapwrap").hidden = true; };
  $("mapok").onclick = function () {
    if (!map) return;
    var p = map.getCenter(); $("mapwrap").hidden = true; resolve(p.lat, p.lng, "map");
  };

  // ───── التأكيد ─────
  function sync() {
    var ready = st.day !== null && st.time !== null && loc.ok && !busy;
    $("go").disabled = !ready;
  }
  $("go").onclick = function () {
    if (busy) return; busy = true; sync(); $("go").textContent = "نأكد حجزك…";
    var dy = DAYS[st.day], tm = dy.times[st.time];
    api("book", { items: ITEMS, date: dy.d, start: tm.s, lat: loc.lat, lng: loc.lng, city: loc.city, district: loc.district }).then(function (r) {
      busy = false; $("go").textContent = "أكد الحجز";
      if (r.ok && r.pay) { location.href = r.pay; return; }
      if (r.ok) { end("✅", "تأكد طلبك" + (r.order_no ? " رقم " + r.order_no : ""), shortDay(dy) + " · " + tm.label + "، والفني يتواصل معك قبل الموعد"); return; }
      if (r.error === "KHAFET_BAD_TIME") { st.time = null; loadSlots(); }
      showPicked(ERR[r.error] || "صار خطأ، جرّب مرة ثانية", false); sync();
    }).catch(function (e) { busy = false; $("go").textContent = "أكد الحجز"; if (e.message !== "expired") showPicked(ERR.NET, false); sync(); });
  };

  function loadSlots() {
    return api("slots", { items: ITEMS, city: loc.city || "" }).then(function (r) {
      DAYS = (r.days || []).slice(0, 10);
      if (st.day !== null && st.day >= DAYS.length) st.day = null;
      renderDays(); renderTimes(); sync();
    });
  }
  if (!T) { end("🔗", "الرابط ناقص", "اكتب لنا في الواتساب ونرسل لك رابط الحجز"); return; }
  $("form").hidden = false; $("bar").hidden = false;
  Promise.all([api("init").then(function (d) { D = d; }), loadSlots()]).catch(function (e) { if (e.message !== "expired") end("📶", "ما قدرنا نفتح الصفحة", ERR.NET); });
})();
</script>
</body>
</html>
