<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>احجز زيارتك | خافت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* حجز سريع من رابط الواتساب (فادية 2026-11-13) بشكل shadcn/ui: خطوات وحدة وحدة؛ الأيام ثم الأوقات ثم الموقع وتأكيد الحجز.
   الخطوة اللي ما جا دورها موجودة بس باهتة، والاختيار أخضر والكلام أبيض. الخدمة g3 بلا دفع، وواجهة /wa-bot/w/* برمز ?t= */
:root{--background:#ffffff;--foreground:#09090b;--muted:#71717a;--muted-bg:#f4f4f5;--border:#e4e4e7;--ring:#a1a1aa;
  --primary:#16a34a;--primary-fg:#ffffff;--destructive:#dc2626;--radius:10px;
  --font:"IBM Plex Sans Arabic",ui-sans-serif,system-ui,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25}
.card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--background);box-shadow:0 1px 2px rgba(0,0,0,.05);padding:16px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.step{font-size:.875rem;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.step i{font-style:normal;width:22px;height:22px;border-radius:999px;border:1px solid var(--border);display:inline-grid;place-items:center;font-size:.75rem;color:var(--muted)}
.card.done .step i{background:var(--primary);border-color:var(--primary);color:#fff}
.card.off{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .15s,border-color .15s,opacity .15s,color .15s}
.chip:hover{background:var(--muted-bg)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.day{width:74px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.day b{font-weight:600;font-size:.9rem}
.day small{color:var(--muted);font-size:.75rem}
.time{padding:9px 14px;font-weight:500;font-size:.9rem;white-space:nowrap}
.row.picked .chip:not(.on){opacity:.4}
.chip.on,.chip.on:hover{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chip.on small{color:var(--primary-fg)}
.chip.ghost{pointer-events:none;color:var(--muted)}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:inherit;font-weight:500;font-size:.9rem;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn:hover{background:var(--muted-bg)}
.btn.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary{background:var(--foreground);border-color:var(--foreground);color:#fff;font-weight:600;font-size:1rem;width:100%;min-height:48px}
.btn.primary:hover{background:#27272a}
.btn.primary:disabled{opacity:.4;cursor:default}
.picked{font-size:.85rem;margin:0;min-height:1.3em}
.picked.ok{color:var(--primary)} .picked.bad{color:var(--destructive)}
.msg{text-align:center;align-items:center;padding:28px 16px}
.msg .big{font-size:2.4rem;line-height:1}
.msg h2{margin:0;font-size:1.2rem;font-weight:700}
.msg p{margin:0;color:var(--muted)}
.mapwrap{position:fixed;inset:0;background:var(--background);z-index:20;display:flex;flex-direction:column}
.maphead{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
#map{flex:1;position:relative}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:2.4rem;z-index:500;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.mapfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mapfoot p{margin:0;text-align:center;color:var(--muted);font-size:.85rem;min-height:1.3em}
@media (prefers-reduced-motion:reduce){.chip,.card,.btn{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="form" hidden>
  <h1>احجز زيارتك</h1>
  <section class="card" id="c1"><p class="step"><i>1</i>اليوم</p><div class="row" id="days" role="listbox" aria-label="اليوم"></div></section>
  <section class="card off" id="c2"><p class="step"><i>2</i>الوقت</p><div class="row" id="times" role="listbox" aria-label="الوقت"></div></section>
  <section class="card off" id="c3"><p class="step"><i>3</i>موقع البيت</p>
    <div class="loc">
      <button class="btn" id="here" type="button">📍 موقعي الحالي</button>
      <button class="btn" id="pickmap" type="button">🗺️ من الخريطة</button>
    </div>
    <p class="picked" id="picked"></p>
    <button class="btn primary" id="go" disabled>أكد الحجز</button>
  </section>
</div>

<div class="wrap" id="loading" hidden></div>
<div class="bar" id="bar" hidden></div>

<div class="wrap" id="end" hidden>
  <div class="card msg"><div class="big" id="endIc">✅</div><h2 id="endT"></h2><p id="endS"></p></div>
</div>

<div class="mapwrap" id="mapwrap" hidden>
  <div class="maphead">حرّك الخريطة على بيتك<button class="btn" id="mapx" type="button">رجوع</button></div>
  <div id="map"><div class="pin">📍</div></div>
  <div class="mapfoot"><p id="mapp"></p><button class="btn primary" id="mapok" type="button">اعتمد هذا الموقع</button></div>
</div>

<script>
(function () {
  "use strict";
  var API = "https://zulogtqxbuqxmdmjpzqj.supabase.co/functions/v1/wa-bot/w/";
  var T = new URLSearchParams(location.search).get("t") || "";
  var ITEMS = [{ id: "g3", qty: 1 }];   // «طلب مخصّص»: زيارة فني والسعر بعد المعاينة، مثل حجز رسائل الواتساب
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ERR = {
    KHAFET_BAD_TIME: "الوقت هذا انحجز قبل شوي، اختر وقت ثاني",
    KHAFET_OFF_DAY: "اليوم هذا إجازة، اختر يوم ثاني",
    KHAFET_COVERAGE: "الموقع خارج المناطق اللي نخدمها حاليًا",
    KHAFET_NO_LOCATION: "حدد موقع البيت",
    KHAFET_TOO_MANY_OPEN: "عندك طلبات مفتوحة كثير، تقدر تتابعها من تطبيق خافت",
    KHAFET_BLOCKED: "ما نقدر نكمل الحجز، تواصل معنا على الواتساب",
    NET: "النت ضعيف، جرّب مرة ثانية"
  };
  var D = null, DAYS = [], st = { day: null, time: null }, loc = { lat: null, lng: null, city: "", district: "", ok: false, how: "" };
  var map = null, busy = false;

  function api(op, body) {
    return fetch(API + op, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ t: T }, body || {})) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (r.status === 401) { end("⏰", "انتهت صلاحية الرابط", "اكتب لنا في الواتساب ونرسل لك رابط جديد"); throw new Error("expired"); } j.__s = r.status; return j; }); },
            function () { throw new Error("NET"); });
  }
  function end(ic, t, s) {
    ["form", "loading", "bar", "mapwrap"].forEach(function (id) { $(id).hidden = true; });
    $("endIc").textContent = ic; $("endT").textContent = t; $("endS").textContent = s; $("end").hidden = false;
  }

  // ───── الأيام والأوقات ─────
  var AR_D = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  var AR_M = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  // اسم اليوم وتاريخه من التاريخ نفسه (بتوقيت الرياض): اليوم، بكرة، ثم اسم اليوم
  function dayParts(iso) {
    var p = iso.split("-").map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    var today = new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10);
    var diff = Math.round((dt - new Date(today + "T00:00:00Z")) / 86400000);
    return { name: diff === 0 ? "اليوم" : diff === 1 ? "بكرة" : AR_D[dt.getUTCDay()], date: p[2] + " " + AR_M[p[1] - 1] };
  }
  function shortDay(x) { var q = dayParts(x.d); return q.name + " " + q.date; }
  function renderDays() {
    $("days").innerHTML = DAYS.map(function (x, i) {
      var q = dayParts(x.d), name = q.name, date = q.date;
      return '<button class="chip day' + (st.day === i ? " on" : "") + '" role="option" aria-selected="' + (st.day === i) + '" data-i="' + i + '"><b>' + esc(name) + "</b>" + (date ? "<small>" + esc(date) + "</small>" : "") + "</button>";
    }).join("") || '<p class="hint">ما فيه مواعيد متاحة حاليًا</p>';
    [].forEach.call($("days").querySelectorAll("button"), function (b) { b.onclick = function () { st.day = +b.dataset.i; st.time = null; renderDays(); renderTimes(); sync(); }; });
  }
  function renderTimes() {
    var GHOST = ["من 8 ص إلى 10 ص", "من 10 ص إلى 12 م", "من 12 م إلى 2 م", "من 2 م إلى 4 م", "من 4 م إلى 6 م", "من 6 م إلى 8 م", "من 8 م إلى 10 م"];
    var list = st.day !== null && DAYS[st.day].times ? DAYS[st.day].times : null;
    $("times").innerHTML = list ? list.map(function (t, i) {
      return '<button class="chip time' + (st.time === i ? " on" : "") + '" role="option" aria-selected="' + (st.time === i) + '" data-i="' + i + '">' + esc(t.label) + "</button>";
    }).join("") : GHOST.map(function (l) { return '<span class="chip time ghost">' + l + "</span>"; }).join("");
    [].forEach.call($("times").querySelectorAll("button"), function (b) { b.onclick = function () { st.time = +b.dataset.i; renderTimes(); sync(); setTimeout(function () { $("c3").scrollIntoView({ behavior: "smooth", block: "start" }); }, 120); }; });
  }

  // ───── الموقع ─────
  function showPicked(txt, ok) { $("picked").textContent = txt; $("picked").className = "picked " + (ok ? "ok" : "bad"); }
  function resolve(lat, lng, how) {
    loc.lat = +lat.toFixed(6); loc.lng = +lng.toFixed(6); loc.how = how; loc.ok = false;
    $("here").classList.toggle("on", how === "here"); $("pickmap").classList.toggle("on", how === "map");
    showPicked("نجيب العنوان…", true); sync();
    return api("geo", { lat: loc.lat, lng: loc.lng }).then(function (g) {
      loc.city = g.city || ""; loc.district = g.district || "";
      if (g.out) showPicked("الموقع خارج المملكة", false);
      else if (!loc.city) showPicked(g.raw ? "موقعك في " + g.raw + "، وحاليًا نخدم " + ((D && D.cover) || []).join(" و") + " فقط" : "ما عرفنا المدينة، اختر الموقع من الخريطة", false);
      else { loc.ok = true; showPicked("✓ " + loc.city + (loc.district ? " · " + loc.district : ""), true); }
      sync(); return g;
    }).catch(function (e) { if (e.message !== "expired") showPicked(ERR.NET, false); sync(); });
  }
  $("here").onclick = function () {
    if (!navigator.geolocation) { showPicked("جوالك ما يدعم تحديد الموقع، اختر من الخريطة", false); return; }
    showPicked("نحدد موقعك…", true);
    navigator.geolocation.getCurrentPosition(function (p) { resolve(p.coords.latitude, p.coords.longitude, "here"); },
      function () { showPicked("ما قدرنا نوصل لموقعك، فعّل الموقع أو اختر من الخريطة", false); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  function loadLeaflet(cb) {
    if (window.L) return cb();
    var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = cb; s.onerror = function () { $("mapp").textContent = ERR.NET; }; document.head.appendChild(s);
  }
  $("pickmap").onclick = function () {
    $("mapwrap").hidden = false; $("mapp").textContent = "";
    loadLeaflet(function () {
      var c = loc.lat ? [loc.lat, loc.lng] : (D && D.last ? [D.last.lat, D.last.lng] : [26.2794, 50.2083]);
      if (!map) {
        map = L.map("map", { zoomControl: false }).setView(c, loc.lat || (D && D.last) ? 17 : 12);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
        map.attributionControl.setPrefix(false);
      } else { map.setView(c); }
      setTimeout(function () { map.invalidateSize(); }, 60);
    });
  };
  $("mapx").onclick = function () { $("mapwrap").hidden = true; };
  $("mapok").onclick = function () {
    if (!map) return;
    var p = map.getCenter(); $("mapwrap").hidden = true; resolve(p.lat, p.lng, "map");
  };

  // ───── التأكيد ─────
  function sync() {
    $("days").classList.toggle("picked", st.day !== null);
    $("times").classList.toggle("picked", st.time !== null);
    $("c1").classList.toggle("done", st.day !== null);
    $("c2").classList.toggle("off", st.day === null);
    $("c2").classList.toggle("done", st.time !== null);
    $("c3").classList.toggle("off", st.time === null);
    $("c3").classList.toggle("done", loc.ok);
    var ready = st.day !== null && st.time !== null && loc.ok && !busy;
    $("go").disabled = !ready;
  }
  $("go").onclick = function () {
    if (busy) return; busy = true; sync(); $("go").textContent = "نأكد حجزك…";
    var dy = DAYS[st.day], tm = dy.times[st.time];
    api("book", { items: ITEMS, date: dy.d, start: tm.s, lat: loc.lat, lng: loc.lng, city: loc.city, district: loc.district }).then(function (r) {
      busy = false; $("go").textContent = "أكد الحجز";
      if (r.ok && r.pay) { location.href = r.pay; return; }
      if (r.ok) { end("✅", "تأكد طلبك" + (r.order_no ? " رقم " + r.order_no : ""), shortDay(dy) + " · " + tm.label + "، والفني يتواصل معك قبل الموعد"); return; }
      if (r.error === "KHAFET_BAD_TIME") { st.time = null; loadSlots(); }
      showPicked(ERR[r.error] || "صار خطأ، جرّب مرة ثانية", false); sync();
    }).catch(function (e) { busy = false; $("go").textContent = "أكد الحجز"; if (e.message !== "expired") showPicked(ERR.NET, false); sync(); });
  };

  function loadSlots() {
    return api("slots", { items: ITEMS, city: loc.city || "" }).then(function (r) {
      var picked = st.day !== null && DAYS[st.day] ? DAYS[st.day].d : null;
      DAYS = (r.days || []).slice(0, 10);
      st.day = null; st.time = null;
      DAYS.forEach(function (x, i) { if (x.d === picked) st.day = i; });
      renderDays(); renderTimes(); sync();
    });
  }
  if (!T) { end("🔗", "الرابط ناقص", "اكتب لنا في الواتساب ونرسل لك رابط الحجز"); return; }
  $("form").hidden = false;
  (function () {
    var now = new Date(Date.now() + 3 * 3600000), out = [];
    for (var i = 0; out.length < 10 && i < 20; i++) {
      var dt = new Date(now.getTime() + i * 86400000);
      if (dt.getUTCDay() === 5 || (i === 0 && now.getUTCHours() >= 19)) continue;
      out.push({ d: dt.toISOString().slice(0, 10), times: null });
    }
    DAYS = out; renderDays(); renderTimes(); sync();
  })();
  Promise.all([api("init").then(function (d) { D = d; }), loadSlots()]).catch(function (e) { if (e.message !== "expired") end("📶", "ما قدرنا نفتح الصفحة", ERR.NET); });
})();
</script>
</body>
</html>
